# Temporary probe for ci/mac-runner-intel-20261116; removed again before review.
# Keyless: no secret, no environment, contents: read only. Runs only on a push
# to that branch that changes this file.
#
# Second run: GitHub's handling of the YAML aliases mac-build.yml now uses: a
# job's `if:` (a folded scalar holding ${{ }}) and its `steps:` list, given an
# anchor in one job and an alias in another, with a job-level env that differs.
# The never-* pair checks that an aliased `if:` is really evaluated: both must
# be skipped (a dropped `if:` would default to success() and run).
name: Intel Mac probe (temporary)

on:
  push:
    branches: [ci/mac-runner-intel-20261116]
    paths: [.github/workflows/mac-intel-probe.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  first:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.out.outputs.value }}
    steps:
      - id: out
        run: echo "value=from-first" >> "${GITHUB_OUTPUT}"

  check-a:
    name: Check A
    needs: [first]
    if: &probe-check-if >-
      ${{ !cancelled() && needs.first.result == 'success' &&
      (github.ref == 'refs/heads/ci/mac-runner-intel-20261116' ||
      (github.ref == 'refs/heads/main' && vars.MAC_SIGNING == 'never-set')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      LAUNCH_ARCH: x86_64
    steps: &probe-check-steps
      - name: Show the job's own values
        env:
          FROM_NEEDS: ${{ needs.first.outputs.value }}
        run: |
          echo "job ${GITHUB_JOB}: LAUNCH_ARCH=${LAUNCH_ARCH}, needs.first.outputs.value=${FROM_NEEDS}"

  check-b:
    name: Check B
    needs: [first]
    if: *probe-check-if
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      LAUNCH_ARCH: arm64
    steps: *probe-check-steps

  never-a:
    needs: [first]
    if: &probe-never-if >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: echo "never-a ran"

  never-b:
    needs: [first]
    if: *probe-never-if
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: echo "never-b ran"

  after:
    needs: [check-a, check-b, never-a, never-b]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          A: ${{ needs.check-a.result }}
          B: ${{ needs.check-b.result }}
          NA: ${{ needs.never-a.result }}
          NB: ${{ needs.never-b.result }}
        run: echo "check-a ${A}, check-b ${B}, never-a ${NA}, never-b ${NB}"
