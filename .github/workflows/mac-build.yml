# Builds the Mac app on every push to main with tools/build-mac.sh (the same
# script as in the devcontainer), launches it on an Apple Silicon Mac to check
# the island loads, then publishes it as a new GitHub Release of its own, marked
# latest, so these fixed links always get the newest build:
#   https://github.com/pcomans/treasure-island/releases/latest/download/treasure-island-mac.zip
#   https://github.com/pcomans/treasure-island/releases/latest/download/treasure-island-linux.tar.gz
# The Linux package is the Linux export that tools/build-mac.sh makes and
# launch-checks from the same commit, with the same sounds. Owner-approved
# 2026-11-03. A run started by hand (workflow_dispatch) on another branch builds
# and checks the app and publishes nothing; on main, the dry_run input does the
# same.
#
# After the release, the itch job (owner-requested 2026-11-15) pushes the same
# two builds to the itch.io page phpp/grand-treasure-island with itch's butler:
# the Mac app to channel "mac", the Linux build to channel "linux". It runs only
# on main, and does nothing (with a notice) until the API key exists as the
# secret BUTLER_API_KEY, best kept in the GitHub environment `itch` with
# deployment branch main:
#     gh secret set BUTLER_API_KEY --env itch -R pcomans/treasure-island   (gh prompts)
# A failed itch push never touches the GitHub release: the job reports it and
# the run still succeeds. To push an existing release (again), start this
# workflow by hand on main with itch_release_tag set to its tag, for example
# mac-2026-11-15-c9746e7: that run builds nothing and only does the itch job.
#
# Also after the release, the virustotal job (owner-requested 2026-11-15)
# submits the release's two files to VirusTotal's public API and adds each
# file's SHA-256 and VirusTotal report link to the release notes, with the
# repository secret VIRUSTOTAL_API_KEY; without it the job only gives a notice.
# Detections are warnings for a person to look at, never failures, and a
# VirusTotal problem never touches the published files.
#
# Signing and notarization (owner-requested 2026-11-07; Apple ID route and
# ad-hoc fallback 2026-11-14) happen in the sign job, on main only, and only
# while the repository variable MAC_SIGNING is "on". With it unset the sign job
# is skipped, no build waits for the environment's approval, and verify and
# publish take the build job's ad-hoc app. The sign job uses only Apple's own
# tools on the macOS runner (security, codesign, xcrun notarytool and stapler,
# ditto), in the GitHub Environment `mac-signing` (Settings -> Environments),
# whose deployment branch rule admits only main. Keep its secrets in the
# environment only: a repository secret of the same name reaches every branch.
# Set each with gh, from a pipe or gh's own prompt rather than the clipboard.
# The certificate:
#   MACOS_CERTIFICATE_P12_BASE64  the "Developer ID Application" certificate with
#                                 its private key, exported from Keychain Access as .p12:
#     base64 -i cert.p12 | gh secret set MACOS_CERTIFICATE_P12_BASE64 --env mac-signing -R pcomans/treasure-island
#   MACOS_CERTIFICATE_PASSWORD    the password chosen for that .p12 export (gh prompts):
#     gh secret set MACOS_CERTIFICATE_PASSWORD --env mac-signing -R pcomans/treasure-island
# and one notarization credential. Preferred, an App Store Connect team API key:
#   APPSTORE_API_KEY_ID           an App Store Connect team API key (Users and
#   APPSTORE_API_ISSUER_ID        Access -> Integrations -> Team Keys, Developer
#   APPSTORE_API_KEY_P8_BASE64    role): its Key ID, the Issuer ID shown above the
#                                 key list, and the downloaded AuthKey_<id>.p8:
#     gh secret set APPSTORE_API_KEY_ID --env mac-signing -R pcomans/treasure-island
#     gh secret set APPSTORE_API_ISSUER_ID --env mac-signing -R pcomans/treasure-island
#     base64 -i AuthKey_<id>.p8 | gh secret set APPSTORE_API_KEY_P8_BASE64 --env mac-signing -R pcomans/treasure-island
# Otherwise the team's Apple ID with an app-specific password (account.apple.com
# -> Sign-In and Security -> App-Specific Passwords; changing the Apple Account
# password revokes them all). Both are secrets; the Apple ID is never printed.
#   APPLE_ID                      the Apple ID (e-mail) of the team's developer account:
#     gh secret set APPLE_ID --env mac-signing -R pcomans/treasure-island
#   APPLE_APP_SPECIFIC_PASSWORD   the app-specific password (gh prompts):
#     gh secret set APPLE_APP_SPECIFIC_PASSWORD --env mac-signing -R pcomans/treasure-island
# And one variable, not a secret, so logs show it unmasked (environment or
# repository level; a secret of the same name still works as a fallback):
#   APPLE_TEAM_ID                 the 10-character Team ID (developer.apple.com ->
#                                 Account -> Membership details):
#     gh variable set APPLE_TEAM_ID --env mac-signing --body XXXXXXXXXX -R pcomans/treasure-island
# The switch, a repository variable (a job's condition cannot see environment ones):
#     gh variable set MAC_SIGNING --body on -R pcomans/treasure-island
#
# What the sign job does. Its first step sees only which secrets are set:
#   certificate + API key, or certificate + Apple ID pair (the API key wins when
#     both are set): checks the credential with Apple (notarytool history)
#     before it touches the certificate, then signs, notarizes and staples.
#   Anything that keeps the build from being notarized publishes the build
#     job's ad-hoc zip unchanged, never a Developer ID build that is not
#     notarized, with a "Mac build NOT notarized" warning and the reason in the
#     release title and notes. The reason (output "fallback") is one of:
#       no-credential           the certificate or the credential is not set
#       credential-refused      Apple answered 401 or 403 to the credential
#       notary-error            Apple's notary service failed in another way
#       signing-failed          importing the certificate or signing failed
#       notarization-rejected   Apple's verdict was Invalid or Rejected
#       notarization-timeout    no verdict within 35 minutes
#       staple-failed           the ticket could not be stapled or validated
#   Fails, publishing nothing: a set only partly filled, a credential without
#     the certificate, the certificate without a valid APPLE_TEAM_ID, a password
#     with a line break, or a build artifact that is not one zip holding one app.
# As always, a notarized build that fails one of verify's checks, a failed island
# load check or a publish guard also stops the run. A stopped run publishes
# nothing, so the previous build stays at the fixed link. The publish job uses
# GITHUB_TOKEN.
#
# The sounds come from the owner's private audio repository (owner, 2026-11-14):
# its URL is the repository variable TI_SFX_SOURCE (with TI_SFX_SUBDIR and
# TI_SFX_REF, both optional) and a read-only token for it the secret
# TI_SFX_GIT_TOKEN, which only the build step's own script sees
# (tools/build-mac.sh, tools/fetch-sfx). With the variable unset the build
# fetches nothing and the app is silent, as before.
name: Mac build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and check, but publish nothing
        type: boolean
        default: false
      itch_release_tag:
        description: Only push this published release (for example mac-2026-11-15-c9746e7) to itch.io; build nothing
        type: string
        default: ""

# Read-only everywhere; only the publish job may write (the release).
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Concurrency is per job, not per workflow: a newer push cancels an older run's
# build or launch check, but never a publish that is under way.
jobs:
  build:
    name: Build
    # A run that only pushes an existing release to itch.io builds nothing, and
    # with this job skipped so are sign, verify and publish.
    if: ${{ !inputs.itch_release_tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # A group of its own: an older run's launch check, queued later, must not
    # cancel a newer run's build.
    concurrency:
      group: mac-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out without LFS (only evidence videos live there)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Install Weston and Mesa
        # The graphics packages of .devcontainer/post-create.sh. The static-world
        # bake needs a real renderer (the headless dummy one drops MultiMesh data),
        # and the runner has no GPU, so in the private Weston that tools/godot
        # starts, Godot renders on Mesa's software Vulkan (lavapipe; never xvfb).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq weston libgl1 libvulkan1 mesa-vulkan-drivers
          dpkg-query -W -f '${Package} ${Version}\n' weston mesa-vulkan-drivers libvulkan1
          # tools/godot frees a Godot exit hang by reading /proc/<pid>/syscall of a
          # sibling process, which Ubuntu's default ptrace_scope=1 forbids.
          sudo sysctl -q kernel.yama.ptrace_scope=0

      - name: Prepare /opt/godot
        id: godot
        run: |
          sudo mkdir -p /opt/godot
          sudo chown "$(id -u):$(id -g)" /opt/godot
          echo "version=$(sed -n 's/^VERSION=//p' .devcontainer/setup-godot.sh)" >> "${GITHUB_OUTPUT}"

      # The cache holds only the downloaded archives, never the installed Godot:
      # setup-godot.sh checks their pinned SHA-256 and extracts them on every run,
      # so a restored cache is verified again before its macOS template reaches a
      # signed release.
      - name: Restore the Godot downloads from the cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-downloads
          # setup-godot.sh pins the version and both SHA-256 hashes, so its hash keys the cache.
          key: godot-downloads-${{ steps.godot.outputs.version }}-${{ hashFiles('.devcontainer/setup-godot.sh') }}

      - name: Install Godot and its export templates (archives are SHA-256 checked on every run)
        env:
          GODOT_DOWNLOAD_CACHE: ${{ runner.temp }}/godot-downloads
        run: .devcontainer/setup-godot.sh

      - name: Save the Godot downloads to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-downloads
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Free the disk the Godot downloads used
        run: rm -rf "${RUNNER_TEMP:?}/godot-downloads"

      - name: Build the Mac app (tools/build-mac.sh)
        timeout-minutes: 45
        env:
          # tools/godot puts its private Weston socket here.
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
          # The private audio (tools/fetch-sfx): here only, never job-wide or on a
          # step that runs an action. An unset variable or secret is empty, and
          # build-mac.sh then fetches nothing; it logs one line saying what it
          # fetched, never the token, and drops the token once fetched.
          TI_SFX_SOURCE: ${{ vars.TI_SFX_SOURCE }}
          TI_SFX_SUBDIR: ${{ vars.TI_SFX_SUBDIR }}
          TI_SFX_REF: ${{ vars.TI_SFX_REF }}
          TI_SFX_GIT_TOKEN: ${{ secrets.TI_SFX_GIT_TOKEN }}
        # Its Linux launch check runs headless here: rendering the island on the
        # CPU takes minutes. The Apple Silicon job then launches the Mac app itself.
        run: tools/build-mac.sh --headless-launch

      - name: Upload the Mac app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: build/mac/treasure-island-mac-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Package the Linux build
        # tools/build-mac.sh has just exported it from this commit, with the same
        # sounds, audited its data pack and launched it. A player needs the
        # executable and its .pck side by side in one folder; tar keeps the
        # executable bit, which artifacts and plain zips can lose.
        run: |
          exes=(build/linux/*.x86_64)
          [ "${#exes[@]}" -eq 1 ] && [ -f "${exes[0]}" ] || { echo "::error::expected one Linux executable in build/linux, found ${#exes[@]}"; exit 1; }
          exe="${exes[0]}"
          pck="${exe%.x86_64}.pck"
          [ -f "${pck}" ] || { echo "::error::${pck} is missing: the Linux build needs its data pack beside the executable"; exit 1; }
          folder=build/linux-package/treasure-island-linux
          rm -rf build/linux-package
          mkdir -p "${folder}"
          cp "${exe}" "${pck}" "${folder}/"
          chmod 0755 "${folder}/$(basename "${exe}")"
          chmod 0644 "${folder}/$(basename "${pck}")"
          tar -C build/linux-package -czf "build/linux-package/treasure-island-linux-$(git rev-parse --short HEAD).tar.gz" treasure-island-linux
          tar -tvzf build/linux-package/treasure-island-linux-*.tar.gz

      - name: Upload the Linux build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-app
          path: build/linux-package/treasure-island-linux-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Disk use
        if: always()
        run: df -h / && du -sh .git . /opt/godot || true

  sign:
    name: Sign and notarize
    needs: build
    # Only on main, and only while the repository variable MAC_SIGNING is "on".
    # Otherwise this job is skipped, so nothing waits for the environment's
    # approval, and verify and publish take the build job's app. The signing
    # secrets live in the environment below, whose branch rule admits only main.
    if: github.ref == 'refs/heads/main' && vars.MAC_SIGNING == 'on'
    runs-on: macos-26
    timeout-minutes: 60
    environment: mac-signing
    concurrency:
      group: mac-sign-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      # "true" only for the signed, notarized and stapled app. Otherwise the job
      # hands on the build job's own zip, unchanged, and "fallback" names why
      # (the list is in the header).
      notarized: ${{ steps.result.outputs.notarized }}
      fallback: ${{ steps.result.outputs.fallback }}
      # "api-key", "apple-id" or "none".
      route: ${{ steps.mode.outputs.route }}
    # Each secret reaches only the run step that uses it, through that step's env:
    # never the job's env or a step that runs an action. The probe, sign and
    # notarize steps may fail without failing the job (continue-on-error); each
    # later one runs only after the one before it succeeded and said "ok", and
    # "Choose the build to publish" decides from their outcomes and outputs.
    steps:
      - name: Check out the entitlements file only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: tools/mac-entitlements.plist
          sparse-checkout-cone-mode: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Choose the signing mode
        id: mode
        # This step sees only whether each secret is set ("true" or "false"),
        # never a value. APPLE_TEAM_ID is a variable (a secret of that name is the
        # fallback).
        env:
          HAS_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          HAS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID != '' }}
          HAS_APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID != '' }}
          HAS_APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        # The decision table is in the header.
        run: |
          # Prints "none", "all", or "missing:" and the names that are not set.
          filled() {
            local name has count=0 missing=""
            for name in "$@"; do
              has="HAS_${name}"
              if [ "${!has}" = "true" ]; then count=$((count + 1)); else missing="${missing} ${name}"; fi
            done
            if [ "${count}" -eq 0 ]; then echo none; elif [ -z "${missing}" ]; then echo all; else echo "missing:${missing}"; fi
          }
          certificate="$(filled MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD)"
          api_key="$(filled APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_BASE64)"
          apple_id="$(filled APPLE_ID APPLE_APP_SPECIFIC_PASSWORD)"
          partial=0
          for set in "certificate=${certificate}" "App Store Connect API key=${api_key}" "Apple ID notarization=${apple_id}"; do
            case "${set#*=}" in
              missing:*) echo "::error::The ${set%%=*} is only partly set; missing:${set#*=missing:}. Set all of its secrets in the mac-signing environment, or none."; partial=1 ;;
            esac
          done
          [ "${partial}" -eq 0 ] || exit 1

          mode=adhoc
          route=none
          fallback=no-credential
          if [ "${certificate}" = none ]; then
            if [ "${api_key}" = all ] || [ "${apple_id}" = all ]; then
              echo "::error::A notarization credential is set but the certificate (MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD) is not. Its secrets are probably misnamed; check their exact names in the mac-signing environment."
              exit 1
            fi
            line="ad-hoc, not notarized: no signing secrets are set in the mac-signing environment"
          else
            if ! [[ "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
              echo "::error::The certificate is set, but APPLE_TEAM_ID (\"${APPLE_TEAM_ID}\") is not a 10-character Team ID (capital letters and digits). Set it as a variable of the mac-signing environment."
              exit 1
            fi
            if [ "${api_key}" = all ]; then
              mode=sign route=api-key fallback=""
              line="sign with the Developer ID and notarize; credential route: App Store Connect API key"
              [ "${apple_id}" = none ] || echo "::notice::Both notarization credentials are set; the App Store Connect API key is used and the Apple ID pair is ignored."
            elif [ "${apple_id}" = all ]; then
              mode=sign route=apple-id fallback=""
              line="sign with the Developer ID and notarize; credential route: Apple ID with an app-specific password"
            else
              line="ad-hoc, not notarized: the certificate is set but no notarization credential is"
            fi
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "route=${route}" >> "${GITHUB_OUTPUT}"
          echo "fallback=${fallback}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Mac signing mode::Chosen: ${line}"

      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
          path: in

      - name: Unpack the build job's app
        run: |
          zips=(in/treasure-island-mac-*.zip)
          [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::expected one zip from the build job, found ${#zips[@]}"; exit 1; }
          ditto -x -k "${zips[0]}" work
          apps=(work/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "::error::expected one .app in ${zips[0]}"; exit 1; }
          echo "${apps[0]}" > app-path.txt

      - name: Check the notarization credential with Apple
        id: probe
        if: steps.mode.outputs.mode == 'sign'
        continue-on-error: true
        env:
          ROUTE: ${{ steps.mode.outputs.route }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          # Only the chosen route's secrets reach this step; the others stay empty.
          APPSTORE_API_KEY_ID: ${{ steps.mode.outputs.route == 'api-key' && secrets.APPSTORE_API_KEY_ID || '' }}
          APPSTORE_API_ISSUER_ID: ${{ steps.mode.outputs.route == 'api-key' && secrets.APPSTORE_API_ISSUER_ID || '' }}
          APPSTORE_API_KEY_P8_BASE64: ${{ steps.mode.outputs.route == 'api-key' && secrets.APPSTORE_API_KEY_P8_BASE64 || '' }}
          APPLE_ID: ${{ steps.mode.outputs.route == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.mode.outputs.route == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          API_KEY_FILE: ${{ runner.temp }}/notary-api-key.p8
          NOTARY_KEYCHAIN: ${{ runner.temp }}/notary.keychain-db
          NOTARY_PROFILE: treasure-island-notary
        # Runs before the certificate is touched. notarytool store-credentials
        # (notarytool(1); Apple TN3147,
        # https://developer.apple.com/documentation/technotes/tn3147-migrating-to-the-latest-notarization-tool)
        # checks the credential with Apple and keeps it as a profile in a
        # throwaway keychain, so the notarize step needs no secret; then
        # notarytool history asks Apple once more with that profile. The API key
        # goes in as a file, deleted at once; the Apple ID and app-specific
        # password go on notarytool's command line, the form Apple documents
        # ("Customizing the notarization workflow"), on this single-use runner.
        # Apple's answers are printed with any e-mail address replaced. An answer
        # that refuses the credential writes "fallback" and leaves "ok" unset; the
        # step still succeeds, and the build is published ad-hoc.
        run: |
          quote() {
            local in="$1" out="" c i
            for ((i = 0; i < ${#in}; i++)); do
              c="${in:i:1}"
              case "${c}" in '\' | '"') out+="\\${c}" ;; *) out+="${c}" ;; esac
            done
            printf '"%s"' "${out}"
          }
          keychain_command() { printf '%s\n' "$1" | security -i; }
          show() { printf '%s\n' "$1" | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<e-mail>/g'; }
          refused() {
            if grep -q 'HTTP status code: 40[13]' <<< "$1"; then reason=credential-refused; else reason=notary-error; fi
            echo "fallback=${reason}" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Mac build NOT notarized::Apple did not accept the notarization credential (${reason}; its answer is in this step's log), so this run publishes the build job's ad-hoc app."
            exit 0
          }
          # The key file goes however the step ends; the keychain stays for the
          # notarize step only when the credential was accepted.
          trap 'rc=$?; rm -f "${API_KEY_FILE}"; if [ "${rc}" -ne 0 ] || ! grep -q "^ok=true$" "${GITHUB_OUTPUT}"; then if [ -e "${NOTARY_KEYCHAIN}" ]; then security delete-keychain "${NOTARY_KEYCHAIN}" || rm -f "${NOTARY_KEYCHAIN}"; fi; fi' EXIT
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            case "${!name}" in
              *[[:space:]]* | *[[:cntrl:]]*) echo "invalid=${name}" >> "${GITHUB_OUTPUT}"; echo "::error::${name} contains a space or a line break. Set it again without one."; exit 0 ;;
            esac
          done

          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          keychain_command "create-keychain -p $(quote "${keychain_password}") $(quote "${NOTARY_KEYCHAIN}")"
          security set-keychain-settings -lut 7200 "${NOTARY_KEYCHAIN}"
          keychain_command "unlock-keychain -p $(quote "${keychain_password}") $(quote "${NOTARY_KEYCHAIN}")"
          case "${ROUTE}" in
            api-key)
              ( umask 077 && printf '%s' "${APPSTORE_API_KEY_P8_BASE64}" | tr -d ' \r\n' | base64 --decode > "${API_KEY_FILE}" )
              credential=(--key "${API_KEY_FILE}" --key-id "${APPSTORE_API_KEY_ID}" --issuer "${APPSTORE_API_ISSUER_ID}")
              route_name="App Store Connect API key"
              ;;
            apple-id)
              credential=(--apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}")
              route_name="Apple ID with an app-specific password"
              ;;
            *) echo "::error::Unknown notarization route \"${ROUTE}\"."; exit 1 ;;
          esac
          status=0
          answer="$(xcrun notarytool store-credentials "${NOTARY_PROFILE}" "${credential[@]}" --keychain "${NOTARY_KEYCHAIN}" 2>&1)" || status=$?
          credential=()
          unset APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_BASE64 APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          rm -f "${API_KEY_FILE}"
          show "${answer}"
          [ "${status}" -eq 0 ] || refused "${answer}"
          answer="$(xcrun notarytool history --keychain-profile "${NOTARY_PROFILE}" --keychain "${NOTARY_KEYCHAIN}" 2>&1)" || status=$?
          show "${answer%%$'\n'*}"
          [ "${status}" -eq 0 ] || refused "${answer}"
          echo "Apple accepts the ${route_name} for notarization."
          echo "ok=true" >> "${GITHUB_OUTPUT}"

      - name: Sign with the Developer ID (hardened runtime)
        id: sign
        if: steps.probe.outcome == 'success' && steps.probe.outputs.ok == 'true'
        continue-on-error: true
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CERTIFICATE_FILE: ${{ runner.temp }}/developer-id.p12
        # A throwaway keychain holds the certificate for this step only, and this
        # step deletes it however it ends (the last step does so again). The
        # certificate's password and the keychain's reach security(1) through its
        # standard input (security -i), never a command line. The Godot export has
        # one Mach-O executable (MoltenVK is linked in statically) and no nested
        # code today; nested libraries or frameworks, as a GDExtension would add,
        # are signed first, deepest first, instead of with codesign --deep, which
        # Apple advises against for signing. Entitlements: tools/mac-entitlements.plist.
        # The log names the signature's team, never the certificate holder.
        run: |
          # One argument for a `security -i` command line. security splits each line
          # itself: inside double quotes a backslash makes the next character literal
          # (split_line in SecurityTool/macOS/security.c,
          # https://github.com/apple-oss-distributions/Security).
          quote() {
            local in="$1" out="" c i
            for ((i = 0; i < ${#in}; i++)); do
              c="${in:i:1}"
              case "${c}" in '\' | '"') out+="\\${c}" ;; *) out+="${c}" ;; esac
            done
            printf '"%s"' "${out}"
          }
          # One command per run: security -i exits with its last command's status.
          keychain_command() { printf '%s\n' "$1" | security -i; }
          cleanup() {
            rm -f "${CERTIFICATE_FILE}"
            if [ -e "${KEYCHAIN}" ]; then security delete-keychain "${KEYCHAIN}" || rm -f "${KEYCHAIN}"; fi
          }
          trap cleanup EXIT
          case "${MACOS_CERTIFICATE_PASSWORD}" in
            *$'\n'* | *$'\r'*) echo "invalid=MACOS_CERTIFICATE_PASSWORD" >> "${GITHUB_OUTPUT}"; echo "::error::MACOS_CERTIFICATE_PASSWORD contains a line break. Set it again without one (gh secret set prompts for it)."; exit 0 ;;
          esac
          app="$(cat app-path.txt)"

          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          keychain_command "create-keychain -p $(quote "${keychain_password}") $(quote "${KEYCHAIN}")"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          keychain_command "unlock-keychain -p $(quote "${keychain_password}") $(quote "${KEYCHAIN}")"
          # Only the decoded key file is private to this user (the app's own files keep
          # the runner's usual permissions).
          ( umask 077 && printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | tr -d ' \r\n' | base64 --decode > "${CERTIFICATE_FILE}" )
          keychain_command "import $(quote "${CERTIFICATE_FILE}") -k $(quote "${KEYCHAIN}") -f pkcs12 -P $(quote "${MACOS_CERTIFICATE_PASSWORD}") -T /usr/bin/codesign" >/dev/null \
            || { echo "::error::Importing the certificate failed (security's message is above). Check MACOS_CERTIFICATE_PASSWORD, and that MACOS_CERTIFICATE_P12_BASE64 is the base64 of the exported .p12."; exit 1; }
          rm -f "${CERTIFICATE_FILE}"
          unset MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD
          # Lets codesign use the key without a permission dialog.
          keychain_command "set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $(quote "${keychain_password}") $(quote "${KEYCHAIN}")" >/dev/null
          # codesign finds the intermediate certificates through the search list.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAIN}" "${existing[@]}"

          identities="$(security find-identity -v -p codesigning "${KEYCHAIN}" | grep "Developer ID Application: .*(${APPLE_TEAM_ID})" || true)"
          if [ "$(grep -c . <<< "${identities}")" -ne 1 ]; then
            echo "::error::Expected exactly one valid \"Developer ID Application\" identity for APPLE_TEAM_ID in the certificate; found $(grep -c . <<< "${identities}"). Check that the .p12 holds that certificate with its private key, and that macOS can reach its issuer: a missing \"Developer ID Certification Authority (G2)\" intermediate certificate also leaves the identity invalid."
            security find-identity -v -p codesigning "${KEYCHAIN}" | tail -1
            exit 1
          fi
          identity="$(awk '{print $2}' <<< "${identities}")"

          # Stray extended attributes make codesign fail ("detritus not allowed").
          xattr -cr "${app}"
          sign() { codesign --force --timestamp --options runtime --keychain "${KEYCHAIN}" --sign "${identity}" "$@"; }
          nested=()
          while IFS= read -r -d '' path; do
            nested+=("${path}")
          done < <(find "${app}/Contents" -depth \
            \( -name '*.framework' -o -name '*.dylib' -o -name '*.so' -o -name '*.bundle' -o -name '*.app' -o -name '*.xpc' \) -print0)
          for path in "${nested[@]}"; do
            echo "Signing nested ${path#"${app}/"}"
            sign "${path}"
          done
          sign --entitlements tools/mac-entitlements.plist "${app}"

          codesign --verify --deep --strict --verbose=2 "${app}"
          details="$(codesign -dvv "${app}" 2>&1)"
          grep -E '^(Identifier|Format|TeamIdentifier|Runtime Version)=' <<< "${details}"
          grep -q "^TeamIdentifier=${APPLE_TEAM_ID}$" <<< "${details}" || { echo "::error::the signature does not carry APPLE_TEAM_ID"; exit 1; }
          grep -q '^Authority=Developer ID Application: ' <<< "${details}" || { echo "::error::the signature is not a Developer ID Application signature"; exit 1; }
          grep -q '^Timestamp=' <<< "${details}" || { echo "::error::the signature has no secure timestamp"; exit 1; }
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(.*runtime' <<< "${details}" || { echo "::error::the signature lacks the hardened runtime"; exit 1; }
          echo "Signed with the Developer ID of team ${APPLE_TEAM_ID}: secure timestamp and hardened runtime present."
          echo "Entitlements:"
          codesign -d --entitlements - --xml "${app}" 2>/dev/null || true; echo
          echo "ok=true" >> "${GITHUB_OUTPUT}"

      - name: Notarize, staple and zip
        id: notarize
        if: steps.sign.outcome == 'success' && steps.sign.outputs.ok == 'true'
        continue-on-error: true
        env:
          ROUTE: ${{ steps.mode.outputs.route }}
          NOTARY_KEYCHAIN: ${{ runner.temp }}/notary.keychain-db
          NOTARY_PROFILE: treasure-island-notary
        # No secret here: notarytool reads the profile the probe step stored in
        # the throwaway keychain, which this step deletes however it ends (the
        # last step does so again). Only a stapled, validated app reaches out/.
        # A verdict that keeps the build from being notarized writes "fallback";
        # the step still succeeds, and the build is published ad-hoc.
        run: |
          show() { printf '%s\n' "$1" | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<e-mail>/g'; }
          not_notarized() {
            rm -rf out
            echo "fallback=$1" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Mac build NOT notarized::$2, so this run publishes the build job's ad-hoc app."
            exit 0
          }
          trap 'if [ -e "${NOTARY_KEYCHAIN}" ]; then security delete-keychain "${NOTARY_KEYCHAIN}" || rm -f "${NOTARY_KEYCHAIN}"; fi' EXIT
          app="$(cat app-path.txt)"
          zips=(in/treasure-island-mac-*.zip)
          name="$(basename "${zips[0]}")"
          auth=(--keychain-profile "${NOTARY_PROFILE}" --keychain "${NOTARY_KEYCHAIN}")

          ditto -c -k --keepParent "${app}" notarize.zip
          status=0
          xcrun notarytool submit notarize.zip "${auth[@]}" --wait --timeout 35m --output-format json > notary.json 2> notary.err || status=$?
          show "$(cat notary.json notary.err)"
          id="$(plutil -extract id raw -o - notary.json 2>/dev/null || true)"
          result="$(plutil -extract status raw -o - notary.json 2>/dev/null || true)"
          echo "notarytool exited ${status}; submission ${id:-none}, status ${result:-none}"
          if [ -n "${id}" ]; then
            echo "Notary log for ${id}:"
            show "$(xcrun notarytool log "${id}" "${auth[@]}" 2>&1 || true)"
          fi
          case "${result}" in
            Accepted) ;;
            Invalid | Rejected) not_notarized notarization-rejected "Apple's notary service did not accept this build (${result}; the notary log is above)" ;;
            *)
              if grep -q 'HTTP status code: 40[13]' notary.json notary.err; then
                not_notarized credential-refused "Apple refused the notarization credential at submission"
              elif [ -n "${id}" ]; then
                not_notarized notarization-timeout "Apple had not finished checking submission ${id} after 35 minutes; a later run submits again"
              else
                not_notarized notary-error "notarytool could not submit the app (its message is above)"
              fi
              ;;
          esac

          # The ticket can take a moment to reach Apple's ticket service after
          # acceptance, so try stapling a few times.
          stapled=no
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "${app}"; then stapled=yes; break; fi
            if [ "${attempt}" -lt 5 ]; then sleep 20; fi
          done
          [ "${stapled}" = yes ] || not_notarized staple-failed "Stapling the notarization ticket failed"
          xcrun stapler validate "${app}" || not_notarized staple-failed "The stapled ticket does not validate"

          rm -rf out
          mkdir out
          ditto -c -k --keepParent "${app}" "out/${name}"
          ls -l out
          echo "notarized=true" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Mac signing mode::Done: Developer ID signed, notarized (submission ${id}) and stapled; credential route: ${ROUTE}"

      - name: Choose the build to publish
        id: result
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_FALLBACK: ${{ steps.mode.outputs.fallback }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_OK: ${{ steps.probe.outputs.ok }}
          PROBE_FALLBACK: ${{ steps.probe.outputs.fallback }}
          PROBE_INVALID: ${{ steps.probe.outputs.invalid }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          SIGN_OK: ${{ steps.sign.outputs.ok }}
          SIGN_INVALID: ${{ steps.sign.outputs.invalid }}
          NOTARIZE_OUTCOME: ${{ steps.notarize.outcome }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          NOTARIZE_FALLBACK: ${{ steps.notarize.outputs.fallback }}
        # The signed app reaches out/ only when it is notarized and stapled.
        # Otherwise out/ holds the build job's zip, byte for byte, with the reason
        # in "fallback". A secret with a line break stops the run instead.
        run: |
          if [ -n "${PROBE_INVALID}${SIGN_INVALID}" ]; then
            echo "::error::${PROBE_INVALID}${SIGN_INVALID:+ }${SIGN_INVALID} must be set again (see the error above). Nothing is published."
            exit 1
          fi
          reason=""
          if [ "${MODE}" != sign ]; then
            reason="${MODE_FALLBACK}"
          elif [ "${PROBE_OUTCOME}" != success ]; then
            reason=notary-error
          elif [ "${PROBE_OK}" != true ]; then
            reason="${PROBE_FALLBACK:-notary-error}"
          elif [ "${SIGN_OUTCOME}" != success ] || [ "${SIGN_OK}" != true ]; then
            reason=signing-failed
          elif [ "${NOTARIZE_OUTCOME}" != success ]; then
            reason=notary-error
          elif [ "${NOTARIZED}" != true ]; then
            reason="${NOTARIZE_FALLBACK:-notary-error}"
          fi
          case "${reason}" in
            "") why="" ;;
            no-credential) why="the certificate or the notarization credential is not set" ;;
            credential-refused) why="Apple refused the notarization credential" ;;
            notary-error) why="Apple's notary service could not be used" ;;
            signing-failed) why="signing with the Developer ID failed" ;;
            notarization-rejected) why="Apple's notary service did not accept the build" ;;
            notarization-timeout) why="Apple had not finished checking the build in time" ;;
            staple-failed) why="the notarization ticket could not be stapled" ;;
            *) echo "::error::Unknown fallback reason \"${reason}\"."; exit 1 ;;
          esac
          if [ -z "${reason}" ]; then
            zips=(out/treasure-island-mac-*.zip)
            [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::the notarized zip is missing from out/"; exit 1; }
            echo "notarized=true" >> "${GITHUB_OUTPUT}"
            echo "fallback=" >> "${GITHUB_OUTPUT}"
            echo "### Mac build: Developer ID signed and notarized" >> "${GITHUB_STEP_SUMMARY}"
          else
            rm -rf out
            mkdir out
            cp in/treasure-island-mac-*.zip out/
            echo "notarized=false" >> "${GITHUB_OUTPUT}"
            echo "fallback=${reason}" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Mac build NOT notarized::${why} (${reason}). This run hands on the build job's ad-hoc app, unchanged."
            {
              echo "### Mac build NOT notarized"
              echo ""
              echo "Reason: \`${reason}\`: ${why}. The build job's ad-hoc app goes on to verify and publish, unchanged."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          ls -l out

      - name: Upload the release app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-release
          path: out/treasure-island-mac-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Delete the keychains and key files
        if: always()
        env:
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          NOTARY_KEYCHAIN: ${{ runner.temp }}/notary.keychain-db
          CERTIFICATE_FILE: ${{ runner.temp }}/developer-id.p12
          API_KEY_FILE: ${{ runner.temp }}/notary-api-key.p8
        run: |
          for keychain in "${KEYCHAIN}" "${NOTARY_KEYCHAIN}"; do
            if [ -e "${keychain}" ]; then security delete-keychain "${keychain}" || rm -f "${keychain}"; fi
          done
          rm -f "${CERTIFICATE_FILE}" "${API_KEY_FILE}"

  verify:
    name: Load on Apple Silicon
    needs: [build, sign]
    # The sign job's app when it ran; the build job's app when it was skipped (a
    # branch run, or MAC_SIGNING not "on"). A failed or cancelled sign job stops
    # this job, and with it the publish job.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' ||
      (needs.sign.result == 'skipped' && !(github.ref == 'refs/heads/main' && vars.MAC_SIGNING == 'on'))) }}
    runs-on: macos-26
    timeout-minutes: 20
    concurrency:
      group: mac-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'mac-app-release' || 'mac-app' }}

      - name: Launch it headless on arm64 and check the island loads
        # The same rule as the Linux launch check in tools/build-mac.sh: the game
        # loads the island, quits with 0 and prints no engine errors. A notarized
        # build must also pass Gatekeeper and carry its stapled ticket; any other
        # build must be the ad-hoc one, never a Developer ID build that is not
        # notarized. The log names the signature's team, never the certificate holder.
        env:
          NOTARIZED: ${{ needs.sign.outputs.notarized }}
          ROUTE: ${{ needs.sign.outputs.route }}
          FALLBACK: ${{ needs.sign.outputs.fallback }}
        run: |
          echo "$(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)"
          df -h .
          zip="$(ls treasure-island-mac-*.zip)"
          ditto -x -k "${zip}" app
          app="$(ls -d app/*.app)"
          exe="${app}/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"
          echo "${exe}: $(lipo -archs "${exe}")"
          codesign --verify --deep --strict --verbose=2 "${app}"
          dvv_status=0
          details="$(codesign -dvv "${app}" 2>&1)" || dvv_status=$?
          # On a failed signature check: what codesign -dvv said, filtered. Its
          # Authority= lines name a certificate holder, so only their number and
          # whether one is a Developer ID are printed, never their text.
          signature_report() {
            local authorities developer_id=no
            echo "codesign -dvv exited ${dvv_status}; its signature lines:"
            grep -E '^(Identifier|Format|Signature|TeamIdentifier)=|^Signature size=|^CodeDirectory ' <<< "${details}" || echo "  (none)"
            authorities="$(grep -c '^Authority=' <<< "${details}" || true)"
            if grep -q '^Authority=Developer ID' <<< "${details}"; then developer_id=yes; fi
            echo "Authority lines: ${authorities}; any Developer ID: ${developer_id}"
          }
          if [ "${NOTARIZED}" = "true" ]; then
            if [ "${dvv_status}" -ne 0 ] || ! grep -q '^Authority=Developer ID Application: ' <<< "${details}"; then
              signature_report
              echo "FAIL: the notarized build has no Developer ID signature" >&2
              exit 1
            fi
            grep -E '^(TeamIdentifier|Timestamp)=' <<< "${details}" || true
            status=0
            assessment="$(spctl --assess --type execute -vv "${app}" 2>&1)" || status=$?
            grep -E 'accepted|rejected|^source=|^override=' <<< "${assessment}" || true
            [ "${status}" -eq 0 ] || { echo "FAIL: Gatekeeper rejects the notarized app" >&2; exit 1; }
            # With Gatekeeper switched off on the runner spctl accepts anything, so
            # its verdict would prove nothing; the ticket check below still counts.
            if grep -q 'override=security disabled' <<< "${assessment}"; then
              echo "::warning::Gatekeeper assessments are switched off on this runner, so spctl's verdict proves nothing here."
            fi
            xcrun stapler validate "${app}" || { echo "FAIL: the notarization ticket is not stapled" >&2; exit 1; }
            echo "::notice title=Mac signing mode::This build is Developer ID signed and notarized (credential route: ${ROUTE}), and passes Gatekeeper."
          else
            # Godot's built-in signer (codesign/codesign=1 in export_presets.cfg) gives
            # each code directory the flags adhoc,runtime, no team and an empty
            # signature blob (editor/export/codesign.cpp). For a code directory with
            # the adhoc flag, Apple's codesign prints "Signature=adhoc" and no
            # Authority= line; those come only with a certificate signature
            # (cs_dump.cpp in Apple's security_systemkeychain source). So an
            # Authority= line of any kind means the app is not the ad-hoc build.
            if [ "${dvv_status}" -ne 0 ] || ! grep -q '^Signature=adhoc$' <<< "${details}" || grep -q '^Authority=' <<< "${details}"; then
              signature_report
              echo "FAIL: this build is not notarized, so it must be the build job's ad-hoc app, but codesign does not show an ad-hoc signature without certificates (see above)" >&2
              exit 1
            fi
            echo "::notice title=Mac signing mode::This build is ad-hoc signed and not notarized${FALLBACK:+ (reason: ${FALLBACK})}."
          fi
          log=launch.log
          arch -arm64 "${exe}" --headless -- --quit-on-ready >"${log}" 2>&1 &
          pid=$!
          # Stop it after 300 s, as tools/build-mac.sh's timeout does.
          ( for _ in $(seq 300); do sleep 1; kill -0 "${pid}" || exit 0; done; kill "${pid}" ) 2>/dev/null &
          watchdog=$!
          status=0
          wait "${pid}" || status=$?
          wait "${watchdog}" || true
          cat "${log}"
          errors="$(grep -E '^ERROR|SCRIPT ERROR' "${log}" | grep -v 'Parameter "ss" is null' || true)"
          if [ "${status}" -ne 0 ] || ! grep -q '^WORLD_READY' "${log}" || ! grep -q '^PLAY_READY' "${log}" || [ -n "${errors}" ]; then
            echo "FAIL: the Mac app (arm64, headless) exited ${status} without loading the island cleanly" >&2
            exit 1
          fi
          echo "PASS: ${zip} loads the island on $(uname -m)"

  publish:
    name: Publish
    needs: [build, sign, verify]
    # Main only, never on a dry run. The sign job's app when it ran; the build
    # job's app when MAC_SIGNING is not "on" and the sign job was skipped.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.build.result == 'success' && needs.verify.result == 'success' &&
      (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && vars.MAC_SIGNING != 'on')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Never cancelled mid-publish. A newer publish waits for it, and replaces an
    # older one that is still waiting.
    concurrency:
      group: mac-publish
      cancel-in-progress: false
    outputs:
      # Set only once the release exists and the fixed links lead to it.
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'mac-app-release' || 'mac-app' }}

      - name: Download the Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-app

      - name: Publish this build as a new release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGN_RESULT: ${{ needs.sign.result }}
          NOTARIZED: ${{ needs.sign.outputs.notarized }}
          FALLBACK: ${{ needs.sign.outputs.fallback }}
        # Each build gets a tag and release of its own, and nothing here replaces a
        # published build. gh uploads to a draft and then publishes it, so the fixed
        # link never reaches a release without its zip. If the reply to that publish
        # is lost, gh deletes the release it just published and the tag stays, so a
        # tag with no release stops the step for a person to look at.
        #
        # Only the head of main publishes. An older build must not take the fixed
        # link from a newer one. GitHub also refuses (HTTP 404 or 403) a release whose
        # commit has .github/workflows files that differ from main's, unless the token
        # may change workflows, and GITHUB_TOKEN never may. A commit that edits a
        # workflow is fine while it is the head of main, because then it matches main.
        # See https://docs.github.com/en/rest/releases/releases#create-a-release
        #
        # The release title and notes say whether the build is notarized, from
        # fixed text for each fallback reason; nothing from Apple's tools reaches
        # them. With MAC_SIGNING off they are as they were before signing existed.
        run: |
          signing=""
          title_extra=""
          if [ "${SIGN_RESULT}" = success ]; then
            if [ "${NOTARIZED}" = true ]; then
              signing="Signed and notarized (Developer ID)."
            else
              case "${FALLBACK}" in
                no-credential) why="notarization is not set up (the certificate or the notarization credential is missing)" ;;
                credential-refused) why="notarization is not available yet (Apple refused the notarization credential)" ;;
                notary-error) why="Apple's notary service could not be used for this build" ;;
                signing-failed) why="signing with the Developer ID failed for this build" ;;
                notarization-rejected) why="Apple's notary service did not accept this build" ;;
                notarization-timeout) why="Apple had not finished checking this build in time" ;;
                staple-failed) why="Apple's notarization ticket could not be attached to this build" ;;
                *) echo "::error::Unknown fallback reason from the sign job; refusing to publish."; exit 1 ;;
              esac
              signing="Ad-hoc signed, NOT notarized: ${why}. macOS blocks the first launch after a browser download; see Build for the Mac in the README."
              title_extra=", not notarized"
              echo "::warning title=Mac build NOT notarized::${signing}"
            fi
          fi
          name=treasure-island-mac.zip
          api="repos/${GITHUB_REPOSITORY}"
          site="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          # The commit's date, not today's: a re-run on a later day must find the same
          # tag, and stop.
          committed="$(gh api "${api}/commits/${GITHUB_SHA}" --jq .commit.committer.date)"
          day="${committed%%T*}"
          short="${GITHUB_SHA:0:7}"
          tag="mac-${day}-${short}"
          if gh api "${api}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            if lookup="$(gh api "${api}/releases/tags/${tag}" --silent 2>&1)"; then
              echo "::error::Tag ${tag} already exists, with its release. Stopping: a re-run never replaces a published build, and nothing was changed."
            else
              # gh's own error: only a 404 means there is no published release. Any
              # other failure (a 502, say) leaves that unknown.
              echo "${lookup}"
              if grep -q 'HTTP 404' <<< "${lookup}"; then
                echo "::error::Tag ${tag} exists, but no published release was found for it. An earlier publish may have lost its reply, which makes gh delete the release it had just published. Stopping with nothing changed: to publish this commit, delete the tag by hand and re-run."
              else
                echo "::error::Tag ${tag} exists, but looking up its release failed with the error above, so whether it has one is unknown. Stopping with nothing changed: re-run later, and check ${site} before deleting any tag."
              fi
            fi
            exit 1
          fi
          head="$(gh api "${api}/commits/main" --jq .sha)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::SKIP: ${GITHUB_SHA} is no longer the head of main (${head}); the newer run publishes if it passes."
            exit 0
          fi
          mv treasure-island-mac-*.zip "${name}"
          linux_name=treasure-island-linux.tar.gz
          mv treasure-island-linux-*.tar.gz "${linux_name}"
          notes="Built from commit ${GITHUB_SHA} (committed ${committed}) by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on $(date -u +%Y-%m-%dT%H:%MZ)."
          if [ -n "${signing}" ]; then
            notes="${notes}

          ${signing}"
          fi
          notes="${notes}

          The newest build is always at ${site}/latest/download/${name}
          For the first launch, see Build for the Mac in the README.

          The Linux build of the same commit is ${linux_name}: unpack it and run the .x86_64 program in its treasure-island-linux folder. The newest is always at ${site}/latest/download/${linux_name}"
          title="Mac build ${day} (${short}${title_extra})"
          gh release create "${tag}" "${name}" "${linux_name}" --target "${GITHUB_SHA}" --latest --title "${title}" --notes "${notes}" || {
            echo "::error::Publishing ${tag} failed, so the previous build normally stays at the fixed link. If gh printed HTTP 404 or 403, the likely cause is that main changed .github/workflows during this publish: GitHub then refuses GITHUB_TOKEN for this commit, and the newer run publishes if it passes."
            exit 1
          }
          # The fixed link must now lead to this build. Allow a moment for the redirect.
          for _ in $(seq 12); do
            if [ "$(curl -sI -o /dev/null -w '%{redirect_url}' "${site}/latest/download/${name}")" = "${site}/download/${tag}/${name}" ]; then
              echo "Published ${site}/tag/${tag}"
              echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
              {
                echo "### Published ${tag}: ${title}"
                echo ""
                echo "${signing:-Ad-hoc signed, not notarized (MAC_SIGNING is not on, so no signing was tried).}"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${tag} is published, but the fixed link does not lead to it."
          exit 1

  itch:
    name: Publish to itch.io
    needs: [publish]
    # After a release on main, or by hand on main for a published release (input
    # itch_release_tag), never on a dry run. Never on another branch, so never for
    # a pull request or a fork. The API key is the repository secret
    # BUTLER_API_KEY, which only the butler steps see. A failure here never
    # touches the GitHub release: continue-on-error keeps the run green, and the
    # job reports what failed.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      (needs.publish.outputs.tag != '' || inputs.itch_release_tag != '') }}
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: itch-publish
      cancel-in-progress: false
    env:
      ITCH_TARGET: phpp/grand-treasure-island
    steps:
      - name: Check for the itch.io API key
        id: key
        # Sees only whether the secret is set, never its value.
        env:
          HAS_BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
        run: |
          if [ "${HAS_BUTLER_API_KEY}" = true ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=itch.io::No BUTLER_API_KEY secret is set, so nothing goes to itch.io. The GitHub release is complete."
            echo "### itch.io: skipped (no BUTLER_API_KEY secret)" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Download the release's builds
        id: builds
        if: steps.key.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag || inputs.itch_release_tag }}
        # The exact files of the GitHub release, each checked against the SHA-256
        # GitHub recorded when it was uploaded.
        run: |
          if ! [[ "${TAG}" =~ ^mac-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7}$ ]]; then
            echo "::error::\"${TAG}\" is not a Mac build tag such as mac-2026-11-15-c9746e7."
            exit 1
          fi
          mkdir release
          gh release download "${TAG}" --dir release --pattern treasure-island-mac.zip --pattern treasure-island-linux.tar.gz
          for file in release/*; do
            name="$(basename "${file}")"
            recorded="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${name}\") | .digest")"
            actual="sha256:$(shasum -a 256 "${file}" | cut -d' ' -f1)"
            echo "${name}: ${actual}"
            if [ -z "${recorded}" ] || [ "${recorded}" = null ]; then
              echo "::warning::GitHub recorded no digest for ${name}, so the download could not be checked."
            elif [ "${recorded}" != "${actual}" ]; then
              echo "::error::${name} does not match the digest GitHub recorded (${recorded})."
              exit 1
            fi
          done
          [ -f release/treasure-island-mac.zip ] || { echo "::error::${TAG} has no treasure-island-mac.zip."; exit 1; }
          if [ -f release/treasure-island-linux.tar.gz ]; then
            echo "linux=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=itch.io::${TAG} has no Linux build (releases before the Linux package have none), so only the mac channel is pushed."
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          # The release's date and commit, as in its tag.
          echo "version=${TAG#mac-}" >> "${GITHUB_OUTPUT}"

      - name: Install butler
        if: steps.builds.outcome == 'success'
        env:
          # itch's own build from broth (https://itch.io/docs/butler/installing.html).
          # itch publishes no checksum for it: this SHA-256 is of the 15.32.0
          # archive as broth served it on 2026-11-15, whose butler executable and
          # 7-zip libraries are byte-identical to those in the v15.32.0 release of
          # github.com/itchio/butler, for which GitHub records the zip's digest.
          BUTLER_VERSION: "15.32.0"
          BUTLER_SHA256: f1c460f08c02686b49f8da74344e5578ece9ea1a8bae1779445b5d98e0a794b3
        run: |
          dir="${RUNNER_TEMP}/butler"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/butler.zip" "https://broth.itch.zone/butler/darwin-arm64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  ${dir}/butler.zip" | shasum -a 256 -c -
          unzip -q -o "${dir}/butler.zip" -d "${dir}"
          chmod 0755 "${dir}/butler"
          "${dir}/butler" version
          echo "${dir}" >> "${GITHUB_PATH}"

      - name: Stage the Mac app and check its signature
        id: mac
        if: steps.builds.outcome == 'success'
        # What is pushed is this folder, exactly: the app as ditto unpacks it from
        # the release zip, checked with codesign here. butler keeps symlinks and
        # permissions and only adds missing execute bits to executables
        # (https://itch.io/docs/itch/integrating/platforms/macos.html).
        run: |
          ditto -x -k release/treasure-island-mac.zip stage/mac
          apps=(stage/mac/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "::error::expected one .app in the Mac zip"; exit 1; }
          [ "$(find stage/mac -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 1 ] || { echo "::error::the Mac zip holds more than the app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          # A list of what is pushed (type, mode, SHA-256 or link target, path), to
          # compare with what itch.io serves afterwards.
          cat > "${RUNNER_TEMP}/manifest.py" <<'PY'
          import hashlib, os, stat, sys
          root = sys.argv[1]
          for top, dirs, files in os.walk(root):
              dirs.sort()
              for name in sorted(dirs) + sorted(files):
                  path = os.path.join(top, name)
                  info = os.lstat(path)
                  rel = os.path.relpath(path, root)
                  if stat.S_ISLNK(info.st_mode):
                      print("link", oct(info.st_mode & 0o777), os.readlink(path), rel)
                  elif stat.S_ISDIR(info.st_mode):
                      print("dir ", oct(info.st_mode & 0o777), "-", rel)
                  else:
                      digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
                      print("file", oct(info.st_mode & 0o777), digest, rel)
          PY
          python3 -I "${RUNNER_TEMP}/manifest.py" stage/mac > mac-pushed.txt
          cat mac-pushed.txt

      - name: Push the Mac app to itch.io
        id: push_mac
        if: steps.mac.outcome == 'success'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.builds.outputs.version }}
        run: butler push stage/mac "${ITCH_TARGET}:mac" --userversion "${VERSION}" --if-changed

      - name: Stage the Linux build
        id: linux
        if: steps.builds.outcome == 'success' && steps.builds.outputs.linux == 'true'
        run: |
          mkdir -p stage/linux
          tar -xzf release/treasure-island-linux.tar.gz -C stage/linux
          folder=stage/linux/treasure-island-linux
          exes=("${folder}"/*.x86_64)
          [ "${#exes[@]}" -eq 1 ] && [ -x "${exes[0]}" ] || { echo "::error::expected one executable .x86_64 in the Linux package"; exit 1; }
          [ -f "${exes[0]%.x86_64}.pck" ] || { echo "::error::the Linux package lacks the .pck beside its executable"; exit 1; }
          ls -l "${folder}"

      - name: Push the Linux build to itch.io
        id: push_linux
        if: steps.linux.outcome == 'success'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.builds.outputs.version }}
        run: butler push stage/linux/treasure-island-linux "${ITCH_TARGET}:linux" --userversion "${VERSION}" --if-changed

      - name: Check the Mac app itch.io serves
        id: served
        if: steps.push_mac.outcome == 'success'
        timeout-minutes: 30
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        # butler fetch downloads the channel's latest build as itch.io serves it,
        # once itch.io has processed it (until then it says "still processing").
        # The fetched app must pass codesign and match what was pushed, file for
        # file. A mismatch or a timeout is reported, not a failure: the push itself
        # succeeded, and a newer push may already be the channel's latest build.
        run: |
          fetched=""
          for _ in $(seq 1 25); do
            rm -rf served
            status=0
            answer="$(butler fetch "${ITCH_TARGET}:mac" served 2>&1)" || status=$?
            if [ "${status}" -eq 0 ]; then fetched=yes; break; fi
            tail -n 3 <<< "${answer}"
            grep -q "still processing" <<< "${answer}" || break
            sleep 60
          done
          if [ -z "${fetched}" ]; then
            echo "::warning title=itch.io::The Mac build was pushed, but itch.io did not serve it within 25 minutes (or butler fetch failed, above), so the app it serves was not checked."
            echo "check=not-done" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          apps=(served/*.app)
          if [ "${#apps[@]}" -eq 1 ] && codesign --verify --deep --strict --verbose=2 "${apps[0]}"; then
            signature=ok
          else
            signature=failed
          fi
          python3 -I "${RUNNER_TEMP}/manifest.py" served > mac-served.txt
          if [ "${signature}" = ok ] && diff mac-pushed.txt mac-served.txt; then
            echo "check=same" >> "${GITHUB_OUTPUT}"
            echo "The Mac app itch.io serves is the one pushed, file for file, and passes codesign --verify --deep --strict."
          else
            echo "check=different" >> "${GITHUB_OUTPUT}"
            echo "::warning title=itch.io::The Mac app itch.io serves differs from the one pushed (codesign: ${signature}; differences above). A newer push may be the channel's latest build; otherwise look at the mac channel on itch.io."
          fi

      - name: Report
        if: always() && steps.key.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.builds.outputs.tag }}
          RETRY_TAG: ${{ needs.publish.outputs.tag || inputs.itch_release_tag }}
          BUILDS: ${{ steps.builds.outcome }}
          PUSH_MAC: ${{ steps.push_mac.outcome }}
          PUSH_LINUX: ${{ steps.push_linux.outcome }}
          LINUX: ${{ steps.builds.outputs.linux }}
          SERVED: ${{ steps.served.outputs.check }}
        run: |
          {
            echo "### itch.io: ${ITCH_TARGET} for ${TAG:-${RETRY_TAG}}"
            echo ""
            echo "- mac channel: ${PUSH_MAC:-not pushed}${SERVED:+ (the app itch.io serves: ${SERVED})}"
            if [ "${LINUX}" = true ]; then
              echo "- linux channel: ${PUSH_LINUX:-not pushed}"
            else
              echo "- linux channel: not pushed (no Linux build in this release)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${BUILDS}" != success ] || [ "${PUSH_MAC}" != success ] || { [ "${LINUX}" = true ] && [ "${PUSH_LINUX}" != success ]; }; then
            echo "::error title=itch.io::Pushing to itch.io failed (see the steps above). The GitHub release is complete and unaffected. To try again, start this workflow by hand on main with itch_release_tag=${RETRY_TAG}."
            exit 1
          fi

  virustotal:
    name: Scan on VirusTotal
    needs: [publish]
    # After a release on main; never on a dry run, another branch, a pull request
    # or a fork. Submits the release's own files to VirusTotal's public API, then
    # adds each file's SHA-256 and report link to the release notes. The key is
    # the repository secret VIRUSTOTAL_API_KEY, seen only by the two VirusTotal
    # steps. Detections, timeouts, quota limits and outages never fail the run or
    # touch the published files (continue-on-error); the job reports them.
    #
    # VirusTotal's terms, as they stood on 2026-11-15: the public API is for
    # non-commercial use, at most 4 requests a minute and 500 a day, in workflows
    # that contribute new files (https://docs.virustotal.com/reference/public-vs-premium-api);
    # uploaded files are shared with VirusTotal's partners and premium customers,
    # so only these already public release files are sent; results may not be
    # passed on to third parties or publicly attributed to a named engine vendor
    # (Google SecOps service terms, section 3, https://cloud.google.com/terms/secops/service-terms).
    # So the release notes carry links to VirusTotal's own reports, never
    # verdicts, and the job's summary gives counts only, never engine names.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.publish.outputs.tag != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      # Only for adding the VirusTotal section to the release notes.
      contents: write
    concurrency:
      group: virustotal
      cancel-in-progress: false
    steps:
      - name: Check for the VirusTotal API key
        id: key
        # Sees only whether the secret is set, never its value.
        env:
          HAS_VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
        run: |
          if [ "${HAS_VIRUSTOTAL_API_KEY}" = true ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=VirusTotal::No VIRUSTOTAL_API_KEY secret is set, so the release is not submitted to VirusTotal."
            echo "### VirusTotal: skipped (no VIRUSTOTAL_API_KEY secret)" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Download the release's files
        id: files
        if: steps.key.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
        # Exactly the published files, each checked against the SHA-256 GitHub
        # recorded for it; nothing else is ever uploaded.
        run: |
          mkdir release
          gh release download "${TAG}" --dir release --pattern treasure-island-mac.zip --pattern treasure-island-linux.tar.gz
          for file in release/*; do
            name="$(basename "${file}")"
            recorded="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${name}\") | .digest")"
            actual="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
            if [ "${recorded}" != "${actual}" ]; then
              echo "::error::${name} does not match the digest GitHub recorded (${recorded:-none})."
              exit 1
            fi
            echo "${name} ${actual#sha256:}"
          done | tee files.txt

      - name: Submit the files to VirusTotal
        id: submit
        if: steps.files.outcome == 'success'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        # One request at a time, at most four a minute. The key goes to curl on
        # standard input (-H @-), never on its command line. A file VirusTotal
        # already has is not uploaded again. Results go to results.txt:
        # name, SHA-256, state (submitted, known, quota or failed), analysis id.
        run: |
          api=https://www.virustotal.com/api/v3
          last=0
          # vt METHOD URL [curl arguments]: the reply goes to reply.json, the HTTP
          # status to ${code}; 000 means no answer at all.
          vt() {
            local wait=$(( last + 16 - $(date +%s) ))
            if [ "${wait}" -gt 0 ]; then sleep "${wait}"; fi
            last="$(date +%s)"
            code="$(printf 'x-apikey: %s\n' "${VIRUSTOTAL_API_KEY}" | curl -sS --max-time 900 -o reply.json -w '%{http_code}' -H @- -X "$1" "$2" "${@:3}")" || code=000
          }
          state_of() { # an HTTP status that is not a success
            if [ "$1" = 429 ]; then echo quota; else echo failed; fi
          }
          : > results.txt
          while read -r name sha; do
            vt GET "${api}/files/${sha}"
            if [ "${code}" = 200 ]; then
              jq -c '.data.attributes.last_analysis_stats' reply.json > "stats-${sha}.json"
              echo "${name} ${sha} known -" >> results.txt
              continue
            elif [ "${code}" != 404 ]; then
              echo "::warning title=VirusTotal::Looking up ${name} failed (HTTP ${code})."
              echo "${name} ${sha} $(state_of "${code}") -" >> results.txt
              continue
            fi
            vt GET "${api}/files/upload_url"
            url="$(jq -r '.data // empty' reply.json 2>/dev/null || true)"
            if [ "${code}" != 200 ] || [ -z "${url}" ]; then
              echo "::warning title=VirusTotal::Getting an upload address for ${name} failed (HTTP ${code})."
              echo "${name} ${sha} $(state_of "${code}") -" >> results.txt
              continue
            fi
            vt POST "${url}" -F "file=@release/${name}"
            analysis="$(jq -r '.data.id // empty' reply.json 2>/dev/null || true)"
            if [ "${code}" != 200 ] || [ -z "${analysis}" ]; then
              echo "::warning title=VirusTotal::Uploading ${name} failed (HTTP ${code})."
              echo "${name} ${sha} $(state_of "${code}") -" >> results.txt
              continue
            fi
            echo "${name} ${sha} submitted ${analysis}" >> results.txt
          done < files.txt
          cat results.txt

      - name: Wait for VirusTotal's analyses
        id: wait
        if: steps.submit.outcome == 'success'
        timeout-minutes: 25
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        # Asks about each unfinished analysis about once a minute, for up to 20
        # minutes. An analysis still running then stays unfinished here; its
        # report on VirusTotal completes on its own.
        run: |
          api=https://www.virustotal.com/api/v3
          last=0
          vt() {
            local wait=$(( last + 16 - $(date +%s) ))
            if [ "${wait}" -gt 0 ]; then sleep "${wait}"; fi
            last="$(date +%s)"
            code="$(printf 'x-apikey: %s\n' "${VIRUSTOTAL_API_KEY}" | curl -sS --max-time 120 -o reply.json -w '%{http_code}' -H @- -X "$1" "$2" "${@:3}")" || code=000
          }
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            pending=0
            while read -r name sha state analysis; do
              [ "${state}" = submitted ] && [ ! -f "stats-${sha}.json" ] || continue
              vt GET "${api}/analyses/${analysis}"
              status="$(jq -r '.data.attributes.status // empty' reply.json 2>/dev/null || true)"
              if [ "${code}" = 200 ] && [ "${status}" = completed ]; then
                jq -c '.data.attributes.stats' reply.json > "stats-${sha}.json"
                echo "${name}: analysis completed"
              else
                pending=$((pending + 1))
                echo "${name}: ${status:-HTTP ${code}}"
              fi
            done < results.txt
            if [ "${pending}" -eq 0 ] || [ "$(date +%s)" -ge "${deadline}" ]; then break; fi
            sleep 30
          done

      - name: Add the reports to the release notes
        id: notes
        if: always() && steps.files.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
        # Every file gets its SHA-256 and VirusTotal's report link by that hash,
        # with a fixed note on its state; no verdicts. Re-running replaces the
        # section instead of adding a second one.
        run: |
          [ -f results.txt ] || while read -r name sha; do echo "${name} ${sha} failed -"; done < files.txt > results.txt
          {
            echo "VirusTotal reports, by each file's SHA-256 (submitted after publishing):"
            while read -r name sha state _; do
              link="https://www.virustotal.com/gui/file/${sha}"
              case "${state}" in
                submitted | known)
                  if [ -f "stats-${sha}.json" ]; then note=""; else note=" (the analysis was still running when this was written; the report completes on its own)"; fi ;;
                quota) note=" (not submitted: VirusTotal's daily request limit was reached; the link finds the file once anyone submits it)" ;;
                *) note=" (not submitted: VirusTotal could not be reached; the link finds the file once anyone submits it)" ;;
              esac
              echo "- ${name}: SHA-256 ${sha}, ${link}${note}"
            done < results.txt
          } > section.md
          gh release view "${TAG}" --json body --jq .body > body.md
          # Drop an earlier VirusTotal section (the last paragraph of the notes).
          python3 -I - body.md <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read().rstrip("\n")
          marker = "\n\nVirusTotal reports, by each file's SHA-256"
          if marker in text:
              text = text[:text.index(marker)]
          open(path, "w").write(text + "\n\n")
          PY
          cat section.md >> body.md
          gh release edit "${TAG}" --notes-file body.md >/dev/null
          cat section.md

      - name: Report
        if: always() && steps.key.outputs.enabled == 'true'
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          NOTES: ${{ steps.notes.outcome }}
        # Counts only, as VirusTotal's own report shows them; engine names stay on
        # VirusTotal. Any engine flagging a file is a warning for a person to look
        # at (game engines' export templates do get false positives), never a
        # failure.
        run: |
          {
            echo "### VirusTotal for ${TAG}"
            echo ""
            if [ -f results.txt ]; then
              while read -r name sha state _; do
                link="https://www.virustotal.com/gui/file/${sha}"
                if [ -f "stats-${sha}.json" ]; then
                  counts="$(jq -r '"malicious \(.malicious // 0), suspicious \(.suspicious // 0), undetected \(.undetected // 0), harmless \(.harmless // 0), unsupported \(.["type-unsupported"] // 0), timeouts \((.timeout // 0) + (.["confirmed-timeout"] // 0)), failures \(.failure // 0)"' "stats-${sha}.json")"
                  flagged="$(jq -r '(.malicious // 0) + (.suspicious // 0)' "stats-${sha}.json")"
                  echo "- [${name}](${link}): ${counts}"
                  if [ "${flagged}" -gt 0 ]; then
                    echo "::warning title=VirusTotal::${flagged} engine(s) flag ${name} as malicious or suspicious. A person should look at the report before anyone relies on it (false positives on game engine builds happen): ${link}"
                  fi
                else
                  echo "- [${name}](${link}): ${state}, no completed analysis yet"
                fi
              done < results.txt
            else
              echo "- nothing was submitted (see the steps above)"
            fi
            echo ""
            echo "Release notes updated: ${NOTES:-no}"
          } >> "${GITHUB_STEP_SUMMARY}"
          tail -n 8 "${GITHUB_STEP_SUMMARY}"
          if [ "${NOTES}" != success ]; then
            echo "::error title=VirusTotal::The VirusTotal section could not be added to the release notes of ${TAG}. The release itself is complete and unaffected."
            exit 1
          fi
