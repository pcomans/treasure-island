# Builds the Mac app on every push to main that changes more than documentation
# with tools/build-mac.sh (the same script as in the devcontainer), with the
# Linux and Windows builds of the same commit; launches the Mac app on an Intel
# Mac and on an Apple Silicon Mac and the Windows build on a Windows runner to
# check the island loads, then publishes them as a new GitHub Release of its
# own, marked latest, so this page always has the newest build:
# https://github.com/pcomans/treasure-island/releases/latest
# The Windows build goes in only when its launch check passed; otherwise the Mac
# and Linux builds publish without it and the release notes say so (owner,
# 2026-11-16: shipping comes first).
# Its files are named after the game and the build number (owner, 2026-11-16),
# for example grand-treasure-island-mac-build-1970.zip,
# grand-treasure-island-linux-build-1970.tar.gz and
# grand-treasure-island-windows-build-1970.zip. Releases from before then keep
# treasure-island-mac.zip and treasure-island-linux.tar.gz and have no Windows
# build (owner, 2026-11-16: "Why no windows build"). The Linux package is the
# Linux export that tools/build-mac.sh makes and launch-checks from the same
# commit, with the same sounds (owner-approved 2026-11-03); the Windows build is
# its x86-64 Windows export, a zip of one folder holding the .exe and its .pck.
# Inside the build job and its artifacts the files keep their working names
# (treasure-island-mac-<commit>.zip and treasure-island-windows-<commit>.zip
# from tools/build-mac.sh); the publish job gives them the release names. A run
# started by hand (workflow_dispatch) on another branch builds and checks the
# app and publishes nothing; on main, the dry_run input does the same.
#
# A push to main that changes only documentation, that is only Markdown files
# (tools/docs-only; owner-requested 2026-11-15), builds and releases nothing:
# the changes job says so in the run, and the other jobs show as skipped. A run
# started by hand always builds. Because such a push builds nothing, a build
# whose commit main has passed only by documentation is still the newest one,
# and publishes (the publish job checks).
#
# Every build has a build number (owner-requested 2026-11-15) from
# tools/build-number: the number of commits in its commit's history. A newer
# build of main always has a larger number, and the Mac, Linux and web builds
# of one commit share it. The build job checks out the whole history for it
# (commits and trees only); tools/build-number refuses a shallow clone, whose
# number would be too small. A release's tag is build-<number, six
# digits>-<commit date>-<short commit>, so tags sort by number, and its title
# is "<config/name in project.godot>, build <number> (<commit date>, <short
# commit>)": for example build-001918-2026-11-16-1a2b3c4 and "Grand Treasure
# Island, build 1918 (2026-11-16, 1a2b3c4)". Older releases keep their
# mac-<date>-<commit> tags.
#
# After the release, the itch job (owner-requested 2026-11-15) pushes the same
# builds to the itch.io page phppco/grand-treasure-island with itch's butler:
# the Mac app, notarized or not, to channel "mac", the Linux build to channel
# "linux" and the Windows build to channel "windows" (butler tags a channel
# named so as Windows), with the build number as their version.
#
# The itch.io and VirusTotal keys live in the GitHub Environment `itch`, whose
# deployment branch rule admits only main and which has no required reviewers:
# a repository secret could be read by a workflow on any branch, an environment
# secret only by jobs that the environment's rule lets in. Set them from gh's
# own prompt, and keep no repository secret of the same names:
#     gh secret set BUTLER_API_KEY --env itch -R pcomans/treasure-island
#     gh secret set VIRUSTOTAL_API_KEY --env itch -R pcomans/treasure-island
# GitHub creates a missing environment, with no rule and no secret, the first
# time a job names it. So before using a key each job reads the environment's
# rule through the API, and pushes or submits nothing, with a warning, unless it
# admits the branch main alone; without a key it gives a notice and does
# nothing. A failed itch push never touches the GitHub release: the job reports
# it and the run still succeeds. To push an existing release (again), start this
# workflow by hand on main with itch_release_tag set to its tag: that run builds
# nothing and only does the itch job.
#
# Every release's notes start with the build's changes from CHANGELOG.md, the
# players' changelog (owner-requested 2026-11-16; tools/changelog.py). A build
# has its entry when CHANGELOG.md's newest entry is numbered above the newest
# released build in its history (build-* tags) and at most its own number; the
# notes start with the tool's fixed header (the game's name and its website),
# then say "Changes in build <its number>" and take every entry since that
# release. Before it builds anything, the build job stops on main when the build
# has no entry; it hands the notes and CHANGELOG.txt to the publish and itch jobs
# as files (the artifact changelog), never through a run: line, an output or an
# argument. The itch job ships CHANGELOG.txt in each channel's folder and puts it
# in its summary as a devlog for the owner to post by hand: itch.io has no API or
# butler command that posts one. A re-push by hand re-makes it from CHANGELOG.md
# at the run's own commit on main; nothing is ever read back from the release
# notes. A push of Markdown alone builds nothing and needs no entry.
#
# Also after the release, the virustotal job (owner-requested 2026-11-15)
# submits the release's files to VirusTotal's public API with the key
# VIRUSTOTAL_API_KEY, and the virustotal-notes job, which has no key, adds each
# file's SHA-256 and VirusTotal report link to the release notes. Links only,
# never verdicts or counts; a file that VirusTotal flags is a warning for a
# person to look at, never a failure, and a VirusTotal problem never touches the
# published files.
#
# Signing and notarization (owner-requested 2026-11-07; Apple ID route and
# ad-hoc fallback 2026-11-14) happen in the sign job, on main only, and only
# while the repository variable MAC_SIGNING is "on". With it unset the sign job
# is skipped, no build waits for the environment's approval, and the Mac checks
# and publish take the build job's ad-hoc app. The sign job uses only Apple's own
# tools on an Intel macOS runner (security, codesign, xcrun notarytool and
# stapler, ditto), in the GitHub Environment `mac-signing` (Settings ->
# Environments), whose deployment branch rule admits only main. Keep its
# secrets in the environment only: a repository secret of the same name reaches
# every branch. Set each with gh, from a pipe or gh's own prompt rather than
# the clipboard.
# The certificate:
#   MACOS_CERTIFICATE_P12_BASE64  the "Developer ID Application" certificate with
#                                 its private key, exported from Keychain Access as .p12:
#     base64 -i cert.p12 | gh secret set MACOS_CERTIFICATE_P12_BASE64 --env mac-signing -R pcomans/treasure-island
#   MACOS_CERTIFICATE_PASSWORD    the password chosen for that .p12 export (gh prompts):
#     gh secret set MACOS_CERTIFICATE_PASSWORD --env mac-signing -R pcomans/treasure-island
# and one notarization credential. Preferred, an App Store Connect team API key:
#   APPSTORE_API_KEY_ID           an App Store Connect team API key (Users and
#   APPSTORE_API_ISSUER_ID        Access -> Integrations -> Team Keys, Developer
#   APPSTORE_API_KEY_P8_BASE64    role): its Key ID, the Issuer ID shown above the
#                                 key list, and the downloaded AuthKey_<id>.p8:
#     gh secret set APPSTORE_API_KEY_ID --env mac-signing -R pcomans/treasure-island
#     gh secret set APPSTORE_API_ISSUER_ID --env mac-signing -R pcomans/treasure-island
#     base64 -i AuthKey_<id>.p8 | gh secret set APPSTORE_API_KEY_P8_BASE64 --env mac-signing -R pcomans/treasure-island
# Otherwise the team's Apple ID with an app-specific password (account.apple.com
# -> Sign-In and Security -> App-Specific Passwords; changing the Apple Account
# password revokes them all). Both are secrets; the Apple ID is never printed.
#   APPLE_ID                      the Apple ID (e-mail) of the team's developer account:
#     gh secret set APPLE_ID --env mac-signing -R pcomans/treasure-island
#   APPLE_APP_SPECIFIC_PASSWORD   the app-specific password (gh prompts):
#     gh secret set APPLE_APP_SPECIFIC_PASSWORD --env mac-signing -R pcomans/treasure-island
# And one variable, not a secret, so logs show it unmasked (environment or
# repository level; a secret of the same name still works as a fallback):
#   APPLE_TEAM_ID                 the 10-character Team ID (developer.apple.com ->
#                                 Account -> Membership details):
#     gh variable set APPLE_TEAM_ID --env mac-signing --body XXXXXXXXXX -R pcomans/treasure-island
# The switch, a repository variable (a job's condition cannot see environment ones):
#     gh variable set MAC_SIGNING --body on -R pcomans/treasure-island
#
# What the sign job does. Its first step sees only which secrets are set:
#   certificate + API key, or certificate + Apple ID pair (the API key wins when
#     both are set): checks the credential with Apple (notarytool history)
#     before it touches the certificate, then signs, notarizes and staples.
#   Anything that keeps the build from being notarized publishes the build
#     job's ad-hoc zip unchanged, never a Developer ID build that is not
#     notarized, with a "Mac build NOT notarized" warning and the reason in the
#     release title and notes. The reason (output "fallback") is one of:
#       no-credential           the certificate or the credential is not set
#       credential-refused      Apple answered 401 or 403 to the credential
#       notary-error            Apple's notary service failed in another way
#       signing-failed          importing the certificate or signing failed
#       notarization-rejected   Apple's verdict was Invalid or Rejected
#       notarization-timeout    no verdict within 35 minutes
#       staple-failed           the ticket could not be stapled or validated
#   Fails, publishing nothing: a set only partly filled, a credential without
#     the certificate, the certificate without a valid APPLE_TEAM_ID, a password
#     with a line break, or a build artifact that is not one zip holding one app.
# As always, a notarized build that fails one of the Mac checks' signature
# checks, a failed island load check or a publish guard also stops the run. A
# stopped run publishes nothing, so the previous build stays the latest release.
# The publish job uses GITHUB_TOKEN.
#
# Which Mac runs what (2026-11-16). GitHub is often short of Apple Silicon
# (arm64) runners, and cancels a job that has waited 15 minutes for one ("The job
# was not acquired by Runner of type hosted even after multiple attempts"). So
# the sign job, the Intel check and the itch job run on an Intel Mac
# (macos-26-intel, with the same Xcode 26.6 as macos-26): codesign, notarytool,
# stapler and ditto do not depend on the Mac's chip, and codesign signs and
# verifies every architecture of the universal app. Only the Apple Silicon check
# runs on macos-26. The Intel check ("Check on an Intel Mac") and the Apple
# Silicon check ("Load on Apple Silicon") run the same steps on the same app:
# both halves of the universal app present, the signature checks above, then a
# headless launch as x86_64 or as arm64 that must load the island. A release
# needs both checks to pass (owner, 2026-11-16: wait for Apple Silicon).
#
# When GitHub finds no Apple Silicon Mac, that check ends cancelled and nothing
# is published. Once GitHub has one again, open the run and choose "Re-run
# failed jobs" (gh run rerun RUN_ID --failed), not "Re-run all jobs": it re-runs
# the Apple Silicon check and the jobs after it (publish, itch, VirusTotal),
# while the build, the sign job and the Intel check keep their results and
# files, so nothing is built or signed again and no approval is asked for. Those
# files (the artifacts mac-app, mac-app-release, linux-app, windows-app and
# changelog) are kept for one day after they are uploaded (retention-days: 1).
# After that the re-run's check stops at its download with an error saying so,
# and only a new run on main publishes, building and signing main's head again
# (with the owner's approval). Either way the publish job publishes only while
# the build is still the newest of main (its head-of-main check).
#
# GitHub ends its Intel macOS images around August 2027
# (https://github.com/actions/runner-images/issues/13045). From 2027-02-01 the
# changes job warns in every run until the sign job, the itch job and the Intel
# check no longer run on macos-26-intel (butler's darwin-arm64 pin for the itch
# job is in INSTALL_LOG.md).
#
# The sounds come from the owner's private audio repository (owner, 2026-11-14):
# its URL is the repository variable TI_SFX_SOURCE (with TI_SFX_SUBDIR and
# TI_SFX_REF, both optional) and a read-only token for it the secret
# TI_SFX_GIT_TOKEN, which only the build step's own script sees
# (tools/build-mac.sh, tools/fetch-sfx). With the variable unset the build
# fetches nothing and the app is silent, as before.
name: Mac build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and check, but publish nothing
        type: boolean
        default: false
      itch_release_tag:
        description: Only push this published release to itch.io (its tag, such as build-001918-2026-11-16-1a2b3c4); build nothing
        type: string
        default: ""

# Read-only everywhere; only the publish job may write (the release).
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Concurrency is per job, not per workflow: a newer push cancels an older run's
# build or launch check, but never a publish that is under way.
jobs:
  changes:
    name: Decide whether to build
    # A push to main that changes only documentation (Markdown files, as
    # tools/docs-only decides) builds and releases nothing: this job says so in
    # a notice and the run's summary, and every other job shows as skipped. Any
    # other push, and every run started by hand, builds. The changed files are
    # GitHub's comparison of the commit before the push with the pushed one, so
    # a push of several commits, merges among them, counts every file any of
    # them changed. A comparison that fails or lists 300 files or more (GitHub
    # lists no more) builds, and so does anything else this job cannot decide.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Remind about GitHub's Intel Macs
        # GitHub ends its Intel macOS images around August 2027
        # (https://github.com/actions/runner-images/issues/13045), and the sign
        # job, the itch job and the Intel check run on macos-26-intel ("Which Mac
        # runs what" in the header). From 2027-02-01 every run warns, by the
        # runner's date, until they move; this step goes with them.
        run: |
          if [[ "$(date -u +%F)" > 2027-01-31 ]]; then
            echo "::warning title=GitHub's Intel Macs end around August 2027::GitHub ends its Intel macOS images around August 2027 (https://github.com/actions/runner-images/issues/13045). Before then move the sign job and the itch job back to macos-26 (the itch job with butler's darwin-arm64 pin, in INSTALL_LOG.md) and remove or replace the Check on an Intel Mac job; then delete this reminder."
          fi

      - name: Check out tools/docs-only
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: tools/docs-only
          sparse-checkout-cone-mode: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Decide from the files the push changed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          build() {
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "This run builds: $1."
          }
          if [ "${EVENT}" != push ]; then
            build "it was started by hand"
            exit 0
          fi
          if ! [[ "${BEFORE}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BEFORE}" =~ ^0+$ ]]; then
            build "the push has no earlier commit to compare with"
            exit 0
          fi
          if [ ! -x tools/docs-only ]; then
            build "tools/docs-only could not be checked out"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" > compare.json; then
            build "GitHub's comparison of the push failed (above)"
            exit 0
          fi
          status="$(jq -r .status compare.json)"
          count="$(jq '.files // [] | length' compare.json)"
          if [ "${status}" != ahead ] || [ "${count}" -ge 300 ]; then
            build "GitHub's comparison of the push is \"${status}\" with ${count} files, not a step forward with under 300"
            exit 0
          fi
          jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' compare.json > paths.txt
          if ! verdict="$(tools/docs-only < paths.txt)"; then
            build "${verdict}"
            exit 0
          fi
          echo "build=false" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Not built: documentation only::This push changes only Markdown files (${count}), so nothing is built, released, pushed to itch.io or sent to VirusTotal. The next push with any other change builds."
          {
            echo "### Not built: documentation only"
            echo ""
            echo "This push changes only Markdown files, which nothing in the build or the game reads, so no build, release, itch.io push or VirusTotal upload runs. The next push with any other change builds, and its build number counts these commits too. To build anyway, start this workflow by hand on main."
            echo ""
            sed 's/^/- /' paths.txt
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build
    needs: [changes]
    # A push of documentation alone builds nothing (the changes job). A run that
    # only pushes an existing release to itch.io builds nothing either. With this
    # job skipped so are sign, the Mac checks and publish.
    if: ${{ !inputs.itch_release_tag && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # A group of its own: an older run's launch check, queued later, must not
    # cancel a newer run's build.
    concurrency:
      group: mac-build-${{ github.ref }}-${{ needs.changes.outputs.build }}
      cancel-in-progress: true
    outputs:
      # The release's tag and title use them (publish job).
      build_number: ${{ steps.number.outputs.number }}
      game_name: ${{ steps.number.outputs.game_name }}
    steps:
      - name: Check out without LFS (only evidence videos live there)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          # The whole history, which the build number counts, without old file
          # contents (on 2026-11-15 every commit and tree came to a few MB, every
          # version of every file to about 2 GB). The checked-out files download
          # as before.
          fetch-depth: 0
          filter: blob:none
          # The release tags (build-*), which tools/changelog.py's rule reads.
          # actions/checkout fetches every tag with fetch-depth 0 anyway; this
          # says so rather than relying on that default.
          fetch-tags: true
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Work out the build number
        id: number
        # tools/build-number counts the commits in this commit's history and
        # refuses a shallow clone. The release title also names the game, as
        # project.godot's config/name does.
        run: |
          number="$(tools/build-number)" || { echo "::error::No build number (tools/build-number, above), so this build could not be published."; exit 1; }
          name="$(sed -n 's/^config\/name="\([^"\\]*\)"$/\1/p' project.godot)"
          if ! [[ "${number}" =~ ^[1-9][0-9]*$ ]] || [ -z "${name}" ] || [ "$(wc -l <<< "${name}")" -ne 1 ]; then
            echo "::error::Expected a build number and one plain config/name=\"...\" line in project.godot; got \"${number}\" and \"${name}\"."
            exit 1
          fi
          echo "number=${number}" >> "${GITHUB_OUTPUT}"
          echo "game_name=${name}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Build number::${name}, build ${number} (commit ${GITHUB_SHA:0:7})"

      - name: Check this build's changelog entry (tools/changelog.py)
        id: changelog
        # The build must have its entry before anything is built: CHANGELOG.md's
        # newest entry numbered above the newest released build in its history
        # and at most this build's number. The tool writes the start of the
        # release notes (notes.md: its first line the marker the publish job
        # checks, then the tool's fixed header with the game's website, "Changes
        # in build N:" and the lines of every entry since that release) and
        # CHANGELOG.txt (the same without the marker lines) to files; their text
        # never reaches a run: line, an output or the log. A run that publishes
        # nothing (another branch, a dry run) goes on with a warning.
        env:
          BUILD_NUMBER: ${{ steps.number.outputs.number }}
          PUBLISHES: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md
        run: |
          if python3 -I tools/changelog.py notes --build "${BUILD_NUMBER}" --out "${RUNNER_TEMP}/changelog" --link "${LINK}"; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${PUBLISHES}" != true ]; then
            echo "::warning title=No changelog entry::CHANGELOG.md gives build ${BUILD_NUMBER} no entry (why is above). This run publishes nothing, so it goes on."
            exit 0
          fi
          echo "::error title=No changelog entry::CHANGELOG.md gives build ${BUILD_NUMBER} no entry (why is above), so nothing was built or published. To fix it: in one commit on main, write the entry under the heading that tools/changelog.py next prints there (any number above the newest released build will do); check it with tools/changelog.py check --hand-run; push it (Markdown alone, so that push builds nothing); then start this workflow by hand on main (gh workflow run mac-build.yml --ref main). Or let the next release's entry say what this build changed."
          exit 1

      - name: Upload this build's changelog
        if: steps.changelog.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: |
            ${{ runner.temp }}/changelog/notes.md
            ${{ runner.temp }}/changelog/CHANGELOG.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install Weston and Mesa
        # The graphics packages of .devcontainer/post-create.sh. The static-world
        # bake needs a real renderer (the headless dummy one drops MultiMesh data),
        # and the runner has no GPU, so in the private Weston that tools/godot
        # starts, Godot renders on Mesa's software Vulkan (lavapipe; never xvfb).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq weston libgl1 libvulkan1 mesa-vulkan-drivers
          dpkg-query -W -f '${Package} ${Version}\n' weston mesa-vulkan-drivers libvulkan1
          # tools/godot frees a Godot exit hang by reading /proc/<pid>/syscall of a
          # sibling process, which Ubuntu's default ptrace_scope=1 forbids.
          sudo sysctl -q kernel.yama.ptrace_scope=0

      - name: Prepare /opt/godot
        id: godot
        run: |
          sudo mkdir -p /opt/godot
          sudo chown "$(id -u):$(id -g)" /opt/godot
          echo "version=$(sed -n 's/^VERSION=//p' .devcontainer/setup-godot.sh)" >> "${GITHUB_OUTPUT}"

      # The cache holds only the downloaded archives, never the installed Godot:
      # setup-godot.sh checks their pinned SHA-256 and extracts them on every run,
      # so a restored cache is verified again before its macOS template reaches a
      # signed release.
      - name: Restore the Godot downloads from the cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-downloads
          # setup-godot.sh pins the version and both SHA-256 hashes, so its hash keys the cache.
          key: godot-downloads-${{ steps.godot.outputs.version }}-${{ hashFiles('.devcontainer/setup-godot.sh') }}

      - name: Install Godot and its export templates (archives are SHA-256 checked on every run)
        env:
          GODOT_DOWNLOAD_CACHE: ${{ runner.temp }}/godot-downloads
        run: .devcontainer/setup-godot.sh

      - name: Save the Godot downloads to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-downloads
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Free the disk the Godot downloads used
        run: rm -rf "${RUNNER_TEMP:?}/godot-downloads"

      - name: Build the Mac, Linux and Windows builds (tools/build-mac.sh)
        timeout-minutes: 45
        env:
          # tools/godot puts its private Weston socket here.
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
          # The private audio (tools/fetch-sfx): here only, never job-wide or on a
          # step that runs an action. An unset variable or secret is empty, and
          # build-mac.sh then fetches nothing; it logs one line saying what it
          # fetched, never the token, and drops the token once fetched.
          TI_SFX_SOURCE: ${{ vars.TI_SFX_SOURCE }}
          TI_SFX_SUBDIR: ${{ vars.TI_SFX_SUBDIR }}
          TI_SFX_REF: ${{ vars.TI_SFX_REF }}
          TI_SFX_GIT_TOKEN: ${{ secrets.TI_SFX_GIT_TOKEN }}
        # Its Linux launch check runs headless here: rendering the island on the
        # CPU takes minutes. The Mac checks then launch the Mac app itself.
        run: tools/build-mac.sh --headless-launch

      - name: Upload the Mac app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: build/mac/treasure-island-mac-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Package the Linux build
        # tools/build-mac.sh has just exported it from this commit, with the same
        # sounds, audited its data pack and launched it. A player needs the
        # executable and its .pck side by side in one folder; tar keeps the
        # executable bit, which artifacts and plain zips can lose.
        run: |
          exes=(build/linux/*.x86_64)
          [ "${#exes[@]}" -eq 1 ] && [ -f "${exes[0]}" ] || { echo "::error::expected one Linux executable in build/linux, found ${#exes[@]}"; exit 1; }
          exe="${exes[0]}"
          pck="${exe%.x86_64}.pck"
          [ -f "${pck}" ] || { echo "::error::${pck} is missing: the Linux build needs its data pack beside the executable"; exit 1; }
          folder=build/linux-package/treasure-island-linux
          rm -rf build/linux-package
          mkdir -p "${folder}"
          cp "${exe}" "${pck}" "${folder}/"
          chmod 0755 "${folder}/$(basename "${exe}")"
          chmod 0644 "${folder}/$(basename "${pck}")"
          tar -C build/linux-package -czf "build/linux-package/treasure-island-linux-$(git rev-parse --short HEAD).tar.gz" treasure-island-linux
          tar -tvzf build/linux-package/treasure-island-linux-*.tar.gz

      - name: Upload the Linux build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-app
          path: build/linux-package/treasure-island-linux-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # tools/build-mac.sh has just exported it from this commit, with the same
      # sounds, audited its data pack and zipped the folder a player unpacks: the
      # .exe and its .pck. The windows job launches it.
      - name: Upload the Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: build/windows/treasure-island-windows-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Disk use
        if: always()
        run: df -h / && du -sh .git . /opt/godot || true

  sign:
    name: Sign and notarize
    needs: build
    # Only on main, and only while the repository variable MAC_SIGNING is "on".
    # Otherwise this job is skipped, so nothing waits for the environment's
    # approval, and the Mac checks and publish take the build job's app. The
    # signing secrets live in the environment below, whose branch rule admits
    # only main. An Intel Mac (see "Which Mac runs what" in the header): GitHub's
    # 15 minutes for finding a runner start when the owner approves the job, so a
    # shortage of Apple Silicon runners cost an approval each time.
    if: github.ref == 'refs/heads/main' && vars.MAC_SIGNING == 'on'
    runs-on: macos-26-intel
    timeout-minutes: 60
    environment: mac-signing
    concurrency:
      group: mac-sign-${{ github.ref }}-${{ needs.build.result }}
      cancel-in-progress: true
    outputs:
      # "true" only for the signed, notarized and stapled app. Otherwise the job
      # hands on the build job's own zip, unchanged, and "fallback" names why
      # (the list is in the header).
      notarized: ${{ steps.result.outputs.notarized }}
      fallback: ${{ steps.result.outputs.fallback }}
      # "api-key", "apple-id" or "none".
      route: ${{ steps.mode.outputs.route }}
    # Each secret reaches only the run step that uses it, through that step's env:
    # never the job's env or a step that runs an action. The probe, sign and
    # notarize steps may fail without failing the job (continue-on-error); each
    # later one runs only after the one before it succeeded and said "ok", and
    # "Choose the build to publish" decides from their outcomes and outputs.
    steps:
      - name: Check out the entitlements file only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: tools/mac-entitlements.plist
          sparse-checkout-cone-mode: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Choose the signing mode
        id: mode
        # This step sees only whether each secret is set ("true" or "false"),
        # never a value. APPLE_TEAM_ID is a variable (a secret of that name is the
        # fallback).
        env:
          HAS_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          HAS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID != '' }}
          HAS_APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID != '' }}
          HAS_APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        # The decision table is in the header.
        run: |
          # Prints "none", "all", or "missing:" and the names that are not set.
          filled() {
            local name has count=0 missing=""
            for name in "$@"; do
              has="HAS_${name}"
              if [ "${!has}" = "true" ]; then count=$((count + 1)); else missing="${missing} ${name}"; fi
            done
            if [ "${count}" -eq 0 ]; then echo none; elif [ -z "${missing}" ]; then echo all; else echo "missing:${missing}"; fi
          }
          certificate="$(filled MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD)"
          api_key="$(filled APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_BASE64)"
          apple_id="$(filled APPLE_ID APPLE_APP_SPECIFIC_PASSWORD)"
          partial=0
          for set in "certificate=${certificate}" "App Store Connect API key=${api_key}" "Apple ID notarization=${apple_id}"; do
            case "${set#*=}" in
              missing:*) echo "::error::The ${set%%=*} is only partly set; missing:${set#*=missing:}. Set all of its secrets in the mac-signing environment, or none."; partial=1 ;;
            esac
          done
          [ "${partial}" -eq 0 ] || exit 1

          mode=adhoc
          route=none
          fallback=no-credential
          if [ "${certificate}" = none ]; then
            if [ "${api_key}" = all ] || [ "${apple_id}" = all ]; then
              echo "::error::A notarization credential is set but the certificate (MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD) is not. Its secrets are probably misnamed; check their exact names in the mac-signing environment."
              exit 1
            fi
            line="ad-hoc, not notarized: no signing secrets are set in the mac-signing environment"
          else
            if ! [[ "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
              echo "::error::The certificate is set, but APPLE_TEAM_ID (\"${APPLE_TEAM_ID}\") is not a 10-character Team ID (capital letters and digits). Set it as a variable of the mac-signing environment."
              exit 1
            fi
            if [ "${api_key}" = all ]; then
              mode=sign route=api-key fallback=""
              line="sign with the Developer ID and notarize; credential route: App Store Connect API key"
              [ "${apple_id}" = none ] || echo "::notice::Both notarization credentials are set; the App Store Connect API key is used and the Apple ID pair is ignored."
            elif [ "${apple_id}" = all ]; then
              mode=sign route=apple-id fallback=""
              line="sign with the Developer ID and notarize; credential route: Apple ID with an app-specific password"
            else
              line="ad-hoc, not notarized: the certificate is set but no notarization credential is"
            fi
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "route=${route}" >> "${GITHUB_OUTPUT}"
          echo "fallback=${fallback}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Mac signing mode::Chosen: ${line}"

      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
          path: in

      - name: Unpack the build job's app
        run: |
          zips=(in/treasure-island-mac-*.zip)
          [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::expected one zip from the build job, found ${#zips[@]}"; exit 1; }
          ditto -x -k "${zips[0]}" work
          apps=(work/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "::error::expected one .app in ${zips[0]}"; exit 1; }
          echo "${apps[0]}" > app-path.txt

      - name: Check the notarization credential with Apple
        id: probe
        if: steps.mode.outputs.mode == 'sign'
        continue-on-error: true
        env:
          ROUTE: ${{ steps.mode.outputs.route }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          # Only the chosen route's secrets reach this step; the others stay empty.
          APPSTORE_API_KEY_ID: ${{ steps.mode.outputs.route == 'api-key' && secrets.APPSTORE_API_KEY_ID || '' }}
          APPSTORE_API_ISSUER_ID: ${{ steps.mode.outputs.route == 'api-key' && secrets.APPSTORE_API_ISSUER_ID || '' }}
          APPSTORE_API_KEY_P8_BASE64: ${{ steps.mode.outputs.route == 'api-key' && secrets.APPSTORE_API_KEY_P8_BASE64 || '' }}
          APPLE_ID: ${{ steps.mode.outputs.route == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.mode.outputs.route == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          API_KEY_FILE: ${{ runner.temp }}/notary-api-key.p8
          NOTARY_KEYCHAIN: ${{ runner.temp }}/notary.keychain-db
          NOTARY_PROFILE: treasure-island-notary
        # Runs before the certificate is touched. notarytool store-credentials
        # (notarytool(1); Apple TN3147,
        # https://developer.apple.com/documentation/technotes/tn3147-migrating-to-the-latest-notarization-tool)
        # checks the credential with Apple and keeps it as a profile in a
        # throwaway keychain, so the notarize step needs no secret; then
        # notarytool history asks Apple once more with that profile. The API key
        # goes in as a file, deleted at once; the Apple ID and app-specific
        # password go on notarytool's command line, the form Apple documents
        # ("Customizing the notarization workflow"), on this single-use runner.
        # Apple's answers are printed with any e-mail address replaced. An answer
        # that refuses the credential writes "fallback" and leaves "ok" unset; the
        # step still succeeds, and the build is published ad-hoc.
        run: |
          quote() {
            local in="$1" out="" c i
            for ((i = 0; i < ${#in}; i++)); do
              c="${in:i:1}"
              case "${c}" in '\' | '"') out+="\\${c}" ;; *) out+="${c}" ;; esac
            done
            printf '"%s"' "${out}"
          }
          keychain_command() { printf '%s\n' "$1" | security -i; }
          show() { printf '%s\n' "$1" | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<e-mail>/g'; }
          refused() {
            if grep -q 'HTTP status code: 40[13]' <<< "$1"; then reason=credential-refused; else reason=notary-error; fi
            echo "fallback=${reason}" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Mac build NOT notarized::Apple did not accept the notarization credential (${reason}; its answer is in this step's log), so this run publishes the build job's ad-hoc app."
            exit 0
          }
          # The key file goes however the step ends; the keychain stays for the
          # notarize step only when the credential was accepted.
          trap 'rc=$?; rm -f "${API_KEY_FILE}"; if [ "${rc}" -ne 0 ] || ! grep -q "^ok=true$" "${GITHUB_OUTPUT}"; then if [ -e "${NOTARY_KEYCHAIN}" ]; then security delete-keychain "${NOTARY_KEYCHAIN}" || rm -f "${NOTARY_KEYCHAIN}"; fi; fi' EXIT
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            case "${!name}" in
              *[[:space:]]* | *[[:cntrl:]]*) echo "invalid=${name}" >> "${GITHUB_OUTPUT}"; echo "::error::${name} contains a space or a line break. Set it again without one."; exit 0 ;;
            esac
          done

          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          keychain_command "create-keychain -p $(quote "${keychain_password}") $(quote "${NOTARY_KEYCHAIN}")"
          security set-keychain-settings -lut 7200 "${NOTARY_KEYCHAIN}"
          keychain_command "unlock-keychain -p $(quote "${keychain_password}") $(quote "${NOTARY_KEYCHAIN}")"
          case "${ROUTE}" in
            api-key)
              ( umask 077 && printf '%s' "${APPSTORE_API_KEY_P8_BASE64}" | tr -d ' \r\n' | base64 --decode > "${API_KEY_FILE}" )
              credential=(--key "${API_KEY_FILE}" --key-id "${APPSTORE_API_KEY_ID}" --issuer "${APPSTORE_API_ISSUER_ID}")
              route_name="App Store Connect API key"
              ;;
            apple-id)
              credential=(--apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}")
              route_name="Apple ID with an app-specific password"
              ;;
            *) echo "::error::Unknown notarization route \"${ROUTE}\"."; exit 1 ;;
          esac
          status=0
          answer="$(xcrun notarytool store-credentials "${NOTARY_PROFILE}" "${credential[@]}" --keychain "${NOTARY_KEYCHAIN}" 2>&1)" || status=$?
          credential=()
          unset APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_BASE64 APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          rm -f "${API_KEY_FILE}"
          show "${answer}"
          [ "${status}" -eq 0 ] || refused "${answer}"
          answer="$(xcrun notarytool history --keychain-profile "${NOTARY_PROFILE}" --keychain "${NOTARY_KEYCHAIN}" 2>&1)" || status=$?
          show "${answer%%$'\n'*}"
          [ "${status}" -eq 0 ] || refused "${answer}"
          echo "Apple accepts the ${route_name} for notarization."
          echo "ok=true" >> "${GITHUB_OUTPUT}"

      - name: Sign with the Developer ID (hardened runtime)
        id: sign
        if: steps.probe.outcome == 'success' && steps.probe.outputs.ok == 'true'
        continue-on-error: true
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CERTIFICATE_FILE: ${{ runner.temp }}/developer-id.p12
        # A throwaway keychain holds the certificate for this step only, and this
        # step deletes it however it ends (the last step does so again). The
        # certificate's password and the keychain's reach security(1) through its
        # standard input (security -i), never a command line. The Godot export has
        # one Mach-O executable (MoltenVK is linked in statically) and no nested
        # code today; nested libraries or frameworks, as a GDExtension would add,
        # are signed first, deepest first, instead of with codesign --deep, which
        # Apple advises against for signing. Entitlements: tools/mac-entitlements.plist.
        # The log names the signature's team, never the certificate holder.
        run: |
          # One argument for a `security -i` command line. security splits each line
          # itself: inside double quotes a backslash makes the next character literal
          # (split_line in SecurityTool/macOS/security.c,
          # https://github.com/apple-oss-distributions/Security).
          quote() {
            local in="$1" out="" c i
            for ((i = 0; i < ${#in}; i++)); do
              c="${in:i:1}"
              case "${c}" in '\' | '"') out+="\\${c}" ;; *) out+="${c}" ;; esac
            done
            printf '"%s"' "${out}"
          }
          # One command per run: security -i exits with its last command's status.
          keychain_command() { printf '%s\n' "$1" | security -i; }
          cleanup() {
            rm -f "${CERTIFICATE_FILE}"
            if [ -e "${KEYCHAIN}" ]; then security delete-keychain "${KEYCHAIN}" || rm -f "${KEYCHAIN}"; fi
          }
          trap cleanup EXIT
          case "${MACOS_CERTIFICATE_PASSWORD}" in
            *$'\n'* | *$'\r'*) echo "invalid=MACOS_CERTIFICATE_PASSWORD" >> "${GITHUB_OUTPUT}"; echo "::error::MACOS_CERTIFICATE_PASSWORD contains a line break. Set it again without one (gh secret set prompts for it)."; exit 0 ;;
          esac
          app="$(cat app-path.txt)"

          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          keychain_command "create-keychain -p $(quote "${keychain_password}") $(quote "${KEYCHAIN}")"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          keychain_command "unlock-keychain -p $(quote "${keychain_password}") $(quote "${KEYCHAIN}")"
          # Only the decoded key file is private to this user (the app's own files keep
          # the runner's usual permissions).
          ( umask 077 && printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | tr -d ' \r\n' | base64 --decode > "${CERTIFICATE_FILE}" )
          keychain_command "import $(quote "${CERTIFICATE_FILE}") -k $(quote "${KEYCHAIN}") -f pkcs12 -P $(quote "${MACOS_CERTIFICATE_PASSWORD}") -T /usr/bin/codesign" >/dev/null \
            || { echo "::error::Importing the certificate failed (security's message is above). Check MACOS_CERTIFICATE_PASSWORD, and that MACOS_CERTIFICATE_P12_BASE64 is the base64 of the exported .p12."; exit 1; }
          rm -f "${CERTIFICATE_FILE}"
          unset MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD
          # Lets codesign use the key without a permission dialog.
          keychain_command "set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $(quote "${keychain_password}") $(quote "${KEYCHAIN}")" >/dev/null
          # codesign finds the intermediate certificates through the search list.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAIN}" "${existing[@]}"

          identities="$(security find-identity -v -p codesigning "${KEYCHAIN}" | grep "Developer ID Application: .*(${APPLE_TEAM_ID})" || true)"
          if [ "$(grep -c . <<< "${identities}")" -ne 1 ]; then
            echo "::error::Expected exactly one valid \"Developer ID Application\" identity for APPLE_TEAM_ID in the certificate; found $(grep -c . <<< "${identities}"). Check that the .p12 holds that certificate with its private key, and that macOS can reach its issuer: a missing \"Developer ID Certification Authority (G2)\" intermediate certificate also leaves the identity invalid."
            security find-identity -v -p codesigning "${KEYCHAIN}" | tail -1
            exit 1
          fi
          identity="$(awk '{print $2}' <<< "${identities}")"

          # Stray extended attributes make codesign fail ("detritus not allowed").
          xattr -cr "${app}"
          sign() { codesign --force --timestamp --options runtime --keychain "${KEYCHAIN}" --sign "${identity}" "$@"; }
          nested=()
          while IFS= read -r -d '' path; do
            nested+=("${path}")
          done < <(find "${app}/Contents" -depth \
            \( -name '*.framework' -o -name '*.dylib' -o -name '*.so' -o -name '*.bundle' -o -name '*.app' -o -name '*.xpc' \) -print0)
          for path in "${nested[@]}"; do
            echo "Signing nested ${path#"${app}/"}"
            sign "${path}"
          done
          sign --entitlements tools/mac-entitlements.plist "${app}"

          codesign --verify --deep --strict --verbose=2 "${app}"
          details="$(codesign -dvv "${app}" 2>&1)"
          grep -E '^(Identifier|Format|TeamIdentifier|Runtime Version)=' <<< "${details}"
          grep -q "^TeamIdentifier=${APPLE_TEAM_ID}$" <<< "${details}" || { echo "::error::the signature does not carry APPLE_TEAM_ID"; exit 1; }
          grep -q '^Authority=Developer ID Application: ' <<< "${details}" || { echo "::error::the signature is not a Developer ID Application signature"; exit 1; }
          grep -q '^Timestamp=' <<< "${details}" || { echo "::error::the signature has no secure timestamp"; exit 1; }
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(.*runtime' <<< "${details}" || { echo "::error::the signature lacks the hardened runtime"; exit 1; }
          echo "Signed with the Developer ID of team ${APPLE_TEAM_ID}: secure timestamp and hardened runtime present."
          echo "Entitlements:"
          codesign -d --entitlements - --xml "${app}" 2>/dev/null || true; echo
          echo "ok=true" >> "${GITHUB_OUTPUT}"

      - name: Notarize, staple and zip
        id: notarize
        if: steps.sign.outcome == 'success' && steps.sign.outputs.ok == 'true'
        continue-on-error: true
        # notarytool waits at most 35 minutes and stapling at most about 4 more,
        # so this is a backstop: a step that hangs past it ends as a failure, and
        # "Choose the build to publish" hands on the ad-hoc app (notary-error)
        # within the job's 60 minutes, rather than the whole job timing out with
        # nothing published and the owner's approval spent.
        timeout-minutes: 50
        env:
          ROUTE: ${{ steps.mode.outputs.route }}
          NOTARY_KEYCHAIN: ${{ runner.temp }}/notary.keychain-db
          NOTARY_PROFILE: treasure-island-notary
        # No secret here: notarytool reads the profile the probe step stored in
        # the throwaway keychain, which this step deletes however it ends (the
        # last step does so again). Only a stapled, validated app reaches out/.
        # A verdict that keeps the build from being notarized writes "fallback";
        # the step still succeeds, and the build is published ad-hoc.
        run: |
          show() { printf '%s\n' "$1" | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<e-mail>/g'; }
          not_notarized() {
            rm -rf out
            echo "fallback=$1" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Mac build NOT notarized::$2, so this run publishes the build job's ad-hoc app."
            exit 0
          }
          trap 'if [ -e "${NOTARY_KEYCHAIN}" ]; then security delete-keychain "${NOTARY_KEYCHAIN}" || rm -f "${NOTARY_KEYCHAIN}"; fi' EXIT
          app="$(cat app-path.txt)"
          zips=(in/treasure-island-mac-*.zip)
          name="$(basename "${zips[0]}")"
          auth=(--keychain-profile "${NOTARY_PROFILE}" --keychain "${NOTARY_KEYCHAIN}")

          ditto -c -k --keepParent "${app}" notarize.zip
          status=0
          xcrun notarytool submit notarize.zip "${auth[@]}" --wait --timeout 35m --output-format json > notary.json 2> notary.err || status=$?
          show "$(cat notary.json notary.err)"
          id="$(plutil -extract id raw -o - notary.json 2>/dev/null || true)"
          result="$(plutil -extract status raw -o - notary.json 2>/dev/null || true)"
          echo "notarytool exited ${status}; submission ${id:-none}, status ${result:-none}"
          if [ -n "${id}" ]; then
            echo "Notary log for ${id}:"
            show "$(xcrun notarytool log "${id}" "${auth[@]}" 2>&1 || true)"
          fi
          case "${result}" in
            Accepted) ;;
            Invalid | Rejected) not_notarized notarization-rejected "Apple's notary service did not accept this build (${result}; the notary log is above)" ;;
            *)
              if grep -q 'HTTP status code: 40[13]' notary.json notary.err; then
                not_notarized credential-refused "Apple refused the notarization credential at submission"
              elif [ -n "${id}" ]; then
                not_notarized notarization-timeout "Apple had not finished checking submission ${id} after 35 minutes; a later run submits again"
              else
                not_notarized notary-error "notarytool could not submit the app (its message is above)"
              fi
              ;;
          esac

          # The ticket can take a moment to reach Apple's ticket service after
          # acceptance, so try stapling a few times. On GitHub's Intel Macs that
          # service's HTTP/3 connections (UDP port 443) have been seen to drop, so
          # that stapler fails while HTTPS over TCP works
          # (https://github.com/actions/runner-images/issues/14924, macos-15-intel,
          # October 2026; stapling worked at once on macos-26-intel and
          # macos-15-intel on 2026-11-16). So after five failures this job blocks
          # outgoing UDP 443, as GitHub advises there, and tries five more times.
          staple() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if xcrun stapler staple "${app}"; then return 0; fi
              if [ "${attempt}" -lt 5 ]; then sleep 20; fi
            done
            return 1
          }
          if ! staple; then
            echo "Stapling failed five times; blocking outgoing UDP 443 for this job (actions/runner-images#14924) and trying again."
            { echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f - && sudo pfctl -E && staple; } \
              || not_notarized staple-failed "Stapling the notarization ticket failed"
          fi
          xcrun stapler validate "${app}" || not_notarized staple-failed "The stapled ticket does not validate"

          rm -rf out
          mkdir out
          ditto -c -k --keepParent "${app}" "out/${name}"
          ls -l out
          echo "notarized=true" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Mac signing mode::Done: Developer ID signed, notarized (submission ${id}) and stapled; credential route: ${ROUTE}"

      - name: Choose the build to publish
        id: result
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_FALLBACK: ${{ steps.mode.outputs.fallback }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_OK: ${{ steps.probe.outputs.ok }}
          PROBE_FALLBACK: ${{ steps.probe.outputs.fallback }}
          PROBE_INVALID: ${{ steps.probe.outputs.invalid }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          SIGN_OK: ${{ steps.sign.outputs.ok }}
          SIGN_INVALID: ${{ steps.sign.outputs.invalid }}
          NOTARIZE_OUTCOME: ${{ steps.notarize.outcome }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
          NOTARIZE_FALLBACK: ${{ steps.notarize.outputs.fallback }}
        # The signed app reaches out/ only when it is notarized and stapled.
        # Otherwise out/ holds the build job's zip, byte for byte, with the reason
        # in "fallback". A secret with a line break stops the run instead.
        run: |
          if [ -n "${PROBE_INVALID}${SIGN_INVALID}" ]; then
            echo "::error::${PROBE_INVALID}${SIGN_INVALID:+ }${SIGN_INVALID} must be set again (see the error above). Nothing is published."
            exit 1
          fi
          reason=""
          if [ "${MODE}" != sign ]; then
            reason="${MODE_FALLBACK}"
          elif [ "${PROBE_OUTCOME}" != success ]; then
            reason=notary-error
          elif [ "${PROBE_OK}" != true ]; then
            reason="${PROBE_FALLBACK:-notary-error}"
          elif [ "${SIGN_OUTCOME}" != success ] || [ "${SIGN_OK}" != true ]; then
            reason=signing-failed
          elif [ "${NOTARIZE_OUTCOME}" != success ]; then
            reason=notary-error
          elif [ "${NOTARIZED}" != true ]; then
            reason="${NOTARIZE_FALLBACK:-notary-error}"
          fi
          case "${reason}" in
            "") why="" ;;
            no-credential) why="the certificate or the notarization credential is not set" ;;
            credential-refused) why="Apple refused the notarization credential" ;;
            notary-error) why="Apple's notary service could not be used" ;;
            signing-failed) why="signing with the Developer ID failed" ;;
            notarization-rejected) why="Apple's notary service did not accept the build" ;;
            notarization-timeout) why="Apple had not finished checking the build in time" ;;
            staple-failed) why="the notarization ticket could not be stapled" ;;
            *) echo "::error::Unknown fallback reason \"${reason}\"."; exit 1 ;;
          esac
          if [ -z "${reason}" ]; then
            zips=(out/treasure-island-mac-*.zip)
            [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::the notarized zip is missing from out/"; exit 1; }
            echo "notarized=true" >> "${GITHUB_OUTPUT}"
            echo "fallback=" >> "${GITHUB_OUTPUT}"
            echo "### Mac build: Developer ID signed and notarized" >> "${GITHUB_STEP_SUMMARY}"
          else
            rm -rf out
            mkdir out
            cp in/treasure-island-mac-*.zip out/
            echo "notarized=false" >> "${GITHUB_OUTPUT}"
            echo "fallback=${reason}" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Mac build NOT notarized::${why} (${reason}). This run hands on the build job's ad-hoc app, unchanged."
            {
              echo "### Mac build NOT notarized"
              echo ""
              echo "Reason: \`${reason}\`: ${why}. The build job's ad-hoc app goes on to the Mac checks and publish, unchanged."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          ls -l out

      - name: Upload the release app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-release
          path: out/treasure-island-mac-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Delete the keychains and key files
        if: always()
        env:
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          NOTARY_KEYCHAIN: ${{ runner.temp }}/notary.keychain-db
          CERTIFICATE_FILE: ${{ runner.temp }}/developer-id.p12
          API_KEY_FILE: ${{ runner.temp }}/notary-api-key.p8
        run: |
          for keychain in "${KEYCHAIN}" "${NOTARY_KEYCHAIN}"; do
            if [ -e "${keychain}" ]; then security delete-keychain "${keychain}" || rm -f "${keychain}"; fi
          done
          rm -f "${CERTIFICATE_FILE}" "${API_KEY_FILE}"

  verify-intel:
    name: Check on an Intel Mac
    needs: [build, sign]
    # The sign job's app when it ran; the build job's app when it was skipped (a
    # branch run, or MAC_SIGNING not "on"). A failed or cancelled sign job stops
    # this job and the Apple Silicon one, and with them the publish job, which
    # needs this job to pass.
    if: &mac-check-if >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' ||
      (needs.sign.result == 'skipped' && !(github.ref == 'refs/heads/main' && vars.MAC_SIGNING == 'on'))) }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    concurrency:
      group: mac-verify-intel-${{ github.ref }}-${{ needs.build.result }}
      cancel-in-progress: true
    env:
      # The half of the universal app this Mac launches.
      LAUNCH_ARCH: x86_64
    # The Apple Silicon job runs these same steps (a YAML alias of this list).
    steps: &mac-check-steps
      - name: Download the Mac app
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'mac-app-release' || 'mac-app' }}

      # A "Re-run failed jobs" more than a day after the build finds the app's
      # artifact gone (retention-days: 1); say so instead of leaving only the
      # download action's error.
      - name: Explain a missing app
        if: failure() && steps.download.outcome == 'failure'
        env:
          ARTIFACT: ${{ needs.sign.result == 'success' && 'mac-app-release' || 'mac-app' }}
        run: |
          echo "::error title=Mac app not found::This run's artifact ${ARTIFACT} could not be downloaded (the download step's error is above). A run's build artifacts are kept for one day after upload, so a re-run of an older run cannot check or publish its build. The next run on main (a push, or gh workflow run mac-build.yml --ref main) builds and signs main's head again, with the owner's approval of the sign job."
          exit 1

      - name: Check the signature, launch it headless and check the island loads
        # The same rule as the Linux launch check in tools/build-mac.sh: the game
        # loads the island, quits with 0 and prints no engine errors. A notarized
        # build must also pass Gatekeeper and carry its stapled ticket; any other
        # build must be the ad-hoc one, never a Developer ID build that is not
        # notarized. codesign --verify checks every architecture of the universal
        # app (its default). The log names the signature's team, never the
        # certificate holder. The job's LAUNCH_ARCH is the Mac's own architecture
        # and the half of the app it launches.
        env:
          NOTARIZED: ${{ needs.sign.outputs.notarized }}
          ROUTE: ${{ needs.sign.outputs.route }}
          FALLBACK: ${{ needs.sign.outputs.fallback }}
        run: |
          echo "$(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)"
          case "${LAUNCH_ARCH}" in
            x86_64 | arm64) ;;
            *) echo "::error::LAUNCH_ARCH is \"${LAUNCH_ARCH}\", not x86_64 or arm64."; exit 1 ;;
          esac
          if [ "$(uname -m)" != "${LAUNCH_ARCH}" ]; then
            echo "::error::This job checks the app on ${LAUNCH_ARCH}, but the runner GitHub gave it is $(uname -m)."
            exit 1
          fi
          df -h .
          zip="$(ls treasure-island-mac-*.zip)"
          ditto -x -k "${zip}" app
          app="$(ls -d app/*.app)"
          exe="${app}/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"
          # Both halves of the universal app, whichever this Mac launches: a build
          # that lost one fails both checks.
          archs="$(lipo -archs "${exe}")"
          echo "${exe}: ${archs}"
          for want in x86_64 arm64; do
            [[ " ${archs} " == *" ${want} "* ]] || { echo "FAIL: the app's executable has no ${want} half (lipo -archs: ${archs})" >&2; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "${app}"
          # Each half's own signature, from its code directory (no Authority=
          # lines, which name the certificate holder).
          for half in x86_64 arm64; do
            echo "${half}: $(codesign -dvv --architecture "${half}" "${app}" 2>&1 | grep -E '^(Format|CodeDirectory|Signature)' | tr '\n' ';' || true)"
          done
          dvv_status=0
          details="$(codesign -dvv "${app}" 2>&1)" || dvv_status=$?
          # On a failed signature check: what codesign -dvv said, filtered. Its
          # Authority= lines name a certificate holder, so only their number and
          # whether one is a Developer ID are printed, never their text.
          signature_report() {
            local authorities developer_id=no
            echo "codesign -dvv exited ${dvv_status}; its signature lines:"
            grep -E '^(Identifier|Format|Signature|TeamIdentifier)=|^Signature size=|^CodeDirectory ' <<< "${details}" || echo "  (none)"
            authorities="$(grep -c '^Authority=' <<< "${details}" || true)"
            if grep -q '^Authority=Developer ID' <<< "${details}"; then developer_id=yes; fi
            echo "Authority lines: ${authorities}; any Developer ID: ${developer_id}"
          }
          if [ "${NOTARIZED}" = "true" ]; then
            if [ "${dvv_status}" -ne 0 ] || ! grep -q '^Authority=Developer ID Application: ' <<< "${details}"; then
              signature_report
              echo "FAIL: the notarized build has no Developer ID signature" >&2
              exit 1
            fi
            grep -E '^(TeamIdentifier|Timestamp)=' <<< "${details}" || true
            status=0
            assessment="$(spctl --assess --type execute -vv "${app}" 2>&1)" || status=$?
            grep -E 'accepted|rejected|^source=|^override=' <<< "${assessment}" || true
            [ "${status}" -eq 0 ] || { echo "FAIL: Gatekeeper rejects the notarized app" >&2; exit 1; }
            # With Gatekeeper switched off on the runner spctl accepts anything, so
            # its verdict would prove nothing; the ticket check below still counts.
            if grep -q 'override=security disabled' <<< "${assessment}"; then
              echo "::warning::Gatekeeper assessments are switched off on this runner, so spctl's verdict proves nothing here."
            fi
            xcrun stapler validate "${app}" || { echo "FAIL: the notarization ticket is not stapled" >&2; exit 1; }
            echo "::notice title=Mac signing mode::This build is Developer ID signed and notarized (credential route: ${ROUTE}), and passes Gatekeeper on ${LAUNCH_ARCH}."
          else
            # Godot's built-in signer (codesign/codesign=1 in export_presets.cfg) gives
            # each code directory the flags adhoc,runtime, no team and an empty
            # signature blob (editor/export/codesign.cpp). For a code directory with
            # the adhoc flag, Apple's codesign prints "Signature=adhoc" and no
            # Authority= line; those come only with a certificate signature
            # (cs_dump.cpp in Apple's security_systemkeychain source). So an
            # Authority= line of any kind means the app is not the ad-hoc build.
            if [ "${dvv_status}" -ne 0 ] || ! grep -q '^Signature=adhoc$' <<< "${details}" || grep -q '^Authority=' <<< "${details}"; then
              signature_report
              echo "FAIL: this build is not notarized, so it must be the build job's ad-hoc app, but codesign does not show an ad-hoc signature without certificates (see above)" >&2
              exit 1
            fi
            echo "::notice title=Mac signing mode::This build is ad-hoc signed and not notarized${FALLBACK:+ (reason: ${FALLBACK})}."
          fi
          log=launch.log
          arch "-${LAUNCH_ARCH}" "${exe}" --headless -- --quit-on-ready >"${log}" 2>&1 &
          pid=$!
          # Stop it after 300 s, as tools/build-mac.sh's timeout does.
          ( for _ in $(seq 300); do sleep 1; kill -0 "${pid}" || exit 0; done; kill "${pid}" ) 2>/dev/null &
          watchdog=$!
          status=0
          wait "${pid}" || status=$?
          wait "${watchdog}" || true
          cat "${log}"
          errors="$(grep -E '^ERROR|SCRIPT ERROR' "${log}" | grep -v 'Parameter "ss" is null' || true)"
          if [ "${status}" -ne 0 ] || ! grep -q '^WORLD_READY' "${log}" || ! grep -q '^PLAY_READY' "${log}" || [ -n "${errors}" ]; then
            echo "FAIL: the Mac app (${LAUNCH_ARCH}, headless) exited ${status} without loading the island cleanly" >&2
            exit 1
          fi
          echo "PASS: ${zip} loads the island on $(uname -m)"

  verify:
    name: Load on Apple Silicon
    needs: [build, sign]
    # The Intel check's condition and steps, on an Apple Silicon Mac. The
    # publish job needs this job to pass too; when GitHub has no Apple Silicon
    # Mac for it, "Re-run failed jobs" later ("Which Mac runs what" in the
    # header).
    if: *mac-check-if
    runs-on: macos-26
    timeout-minutes: 20
    concurrency:
      group: mac-verify-${{ github.ref }}-${{ needs.build.result }}
      cancel-in-progress: true
    env:
      LAUNCH_ARCH: arm64
    steps: *mac-check-steps

  windows:
    name: Load on Windows
    needs: [build]
    # Every run that builds. The publish job takes the Windows build only when
    # this job passes.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: windows-load-${{ github.ref }}-${{ needs.build.result }}
      cancel-in-progress: true
    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app

      - name: Launch it headless on Windows and check the island loads
        timeout-minutes: 10
        # The same rule as the Mac and Linux launch checks: the game loads the
        # island, quits with 0 and prints no engine errors. Headless, as the
        # runner has no GPU: this shows that the .exe starts on Windows, mounts
        # its .pck and loads the island, not that it renders (the windows-render
        # job tries that). Godot's own log must also land in the folder
        # project.godot pins for Windows players' saved settings, which shows
        # where user:// is on Windows. Bash is Git for Windows'; 7-Zip is on the
        # runner image.
        run: |
          echo "$(uname -s) $(uname -r), $(uname -m)"
          zips=(treasure-island-windows-*.zip)
          [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::expected one Windows zip, found ${#zips[@]}"; exit 1; }
          7z x -y -oapp "${zips[0]}" > /dev/null
          shopt -s nullglob dotglob
          top=(app/*)
          files=(app/treasure-island-windows/*)
          if [ "${top[*]}" != app/treasure-island-windows ] || [ "${files[*]}" != "app/treasure-island-windows/treasure-island.exe app/treasure-island-windows/treasure-island.pck" ]; then
            printf -v shown '%q ' "${top[@]}" : "${files[@]}"
            echo "::error::the Windows zip should hold the folder treasure-island-windows with treasure-island.exe and treasure-island.pck alone; it holds ${shown}"
            exit 1
          fi
          userdir="$(cygpath -u "${APPDATA}")/Godot/app_userdata/Treasure Island First Playable"
          status=0
          app/treasure-island-windows/treasure-island.exe --headless -- --quit-on-ready 2>&1 | tee launch.log || status=$?
          errors="$(grep -E '^ERROR|SCRIPT ERROR' launch.log | grep -v 'Parameter "ss" is null' || true)"
          if [ "${status}" -ne 0 ] || ! grep -q '^WORLD_READY' launch.log || ! grep -q '^PLAY_READY' launch.log || [ -n "${errors}" ]; then
            echo "::error title=Windows build::The Windows build (headless) exited ${status} without loading the island cleanly; its output is above."
            exit 1
          fi
          if ! grep -qs '^WORLD_READY' "${userdir}/logs/godot.log"; then
            echo "::error title=Windows build::Godot's log is not in ${userdir}/logs, so user:// on Windows is not the folder project.godot pins."
            exit 1
          fi
          echo "PASS: ${zips[0]} loads the island on Windows (headless); user:// is ${userdir}"

  windows-render:
    name: Try rendering on Windows (information only)
    needs: [build]
    # The runner has no GPU. Godot 4.7.2 starts this project on Vulkan and, where
    # Vulkan does not work, falls back to Direct3D 12 (rendering/rendering_device/
    # fallback_to_d3d12, on by default). On windows-2025, in the first run
    # (43804401649, 2026-11-16), Vulkan failed (no VK_KHR_surface: two ERROR
    # lines) and Godot switched to Direct3D 12 on "Microsoft Basic Render Driver"
    # (WARP, Windows' software renderer); the island loaded in about 3.5 minutes.
    # So this launches the build with rendering and reports which renderer it got
    # and whether the island loaded. Rendering in software says something about
    # the Direct3D 12 path, nothing about a player's GPU. Nothing waits for this
    # job, and its failure never fails the run.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 25
    continue-on-error: true
    concurrency:
      group: windows-render-${{ github.ref }}-${{ needs.build.result }}-${{ github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app

      - name: Launch it with rendering
        continue-on-error: true
        timeout-minutes: 15
        run: |
          zips=(treasure-island-windows-*.zip)
          7z x -y -oapp "${zips[0]}" > /dev/null
          app/treasure-island-windows/treasure-island.exe --audio-driver Dummy -- --quit-on-ready 2>&1 | tee render.log

      - name: Report
        if: always()
        run: |
          touch render.log
          renderer="$(grep -m 1 -E ' - (Forward\+|Mobile|Compatibility) - ' render.log | tr -d '\r' || true)"
          errors="$(grep -E '^ERROR|SCRIPT ERROR' render.log | grep -c -v 'Parameter "ss" is null' || true)"
          if grep -q '^WORLD_READY' render.log && grep -q '^PLAY_READY' render.log; then loaded=yes; else loaded=no; fi
          {
            echo "### Windows rendering, information only"
            echo ""
            echo "- renderer: ${renderer:-none reported}"
            echo "- island loaded with rendering: ${loaded}"
            echo "- engine error lines: ${errors:-0}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Windows rendering (information only)::renderer: ${renderer:-none reported}; island loaded: ${loaded}; engine error lines: ${errors:-0}"

  publish:
    name: Publish
    needs: [build, sign, verify-intel, verify, windows]
    # Main only, never on a dry run. The sign job's app when it ran; the build
    # job's app when MAC_SIGNING is not "on" and the sign job was skipped. It
    # waits for the Windows check but never depends on it: the Windows build goes
    # in only when that check passed, and otherwise the Mac and Linux builds
    # publish without it (owner, 2026-11-16: shipping comes first). Both Mac
    # checks must pass, the Intel one and the Apple Silicon one; when the Apple
    # Silicon one found no runner, "Re-run failed jobs" later ("Which Mac runs
    # what" in the header).
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.build.result == 'success' && needs.verify-intel.result == 'success' &&
      needs.verify.result == 'success' &&
      (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && vars.MAC_SIGNING != 'on')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Never cancelled mid-publish. A newer publish waits for it, and replaces an
    # older one that is still waiting.
    concurrency:
      group: mac-publish
      cancel-in-progress: false
    outputs:
      # Set only once the release exists and is GitHub's latest release, with
      # exactly its files. Their names and the SHA-256 of each as uploaded: the
      # itch and VirusTotal jobs download and check these. The Windows ones are
      # empty when the release leaves the Windows build out.
      tag: ${{ steps.release.outputs.tag }}
      build_number: ${{ steps.release.outputs.build_number }}
      mac_name: ${{ steps.release.outputs.mac_name }}
      linux_name: ${{ steps.release.outputs.linux_name }}
      windows_name: ${{ steps.release.outputs.windows_name }}
      mac_sha256: ${{ steps.release.outputs.mac_sha256 }}
      linux_sha256: ${{ steps.release.outputs.linux_sha256 }}
      windows_sha256: ${{ steps.release.outputs.windows_sha256 }}
    steps:
      # For the head-of-main check below; without it that check counts any later
      # commit on main as more than documentation.
      - name: Check out tools/docs-only
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: tools/docs-only
          sparse-checkout-cone-mode: false
          path: docs-only
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'mac-app-release' || 'mac-app' }}

      - name: Download the Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-app

      - name: Download the Windows build
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app

      # The start of the release notes, which the build job wrote from
      # CHANGELOG.md. Without it nothing is published.
      - name: Download this build's changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
          path: changelog

      - name: Publish this build as a new release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGN_RESULT: ${{ needs.sign.result }}
          NOTARIZED: ${{ needs.sign.outputs.notarized }}
          FALLBACK: ${{ needs.sign.outputs.fallback }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          GAME_NAME: ${{ needs.build.outputs.game_name }}
          # success, or anything else (failure, cancelled, skipped), which leaves
          # the Windows build out.
          WINDOWS_RESULT: ${{ needs.windows.result }}
        # Each build gets a tag and release of its own, and nothing here replaces a
        # published build. gh uploads to a draft and then publishes it, so no
        # published release lacks its files. If the reply to that publish
        # is lost, gh deletes the release it just published and the tag stays, so a
        # tag with no release stops the step for a person to look at.
        #
        # Only the newest build of main publishes: the head of main, or a commit
        # after which main has changed only documentation, since a push of
        # documentation alone builds nothing (the changes job). An older build must
        # not become the latest release over a newer one. GitHub also refuses (HTTP 404 or
        # 403) a release whose commit has .github/workflows files that differ from
        # main's, unless the token may change workflows, and GITHUB_TOKEN never may.
        # A commit that edits a workflow is fine while it is the newest build,
        # because then its workflows match main's (documentation never includes a
        # workflow). See https://docs.github.com/en/rest/releases/releases#create-a-release
        #
        # The tag and title carry the build number (build job), and the title the
        # game's name. The title and notes say whether the build is notarized,
        # from fixed text for each fallback reason; nothing from Apple's tools
        # reaches them. With MAC_SIGNING off they say nothing about signing.
        #
        # The notes start with this build's changelog (changelog/notes.md, from
        # CHANGELOG.md), and gh reads them from a file, so the changelog's text
        # never passes through the shell.
        run: |
          if ! [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]] || [ -z "${GAME_NAME}" ]; then
            echo "::error::The build job gave no build number or game name, so this build has no tag or title; refusing to publish."
            exit 1
          fi
          if [ "$(head -n 1 changelog/notes.md)" != "<!-- changelog: build ${BUILD_NUMBER} -->" ]; then
            echo "::error::changelog/notes.md does not hold build ${BUILD_NUMBER}'s changelog, so this build has no release notes; refusing to publish."
            exit 1
          fi
          signing=""
          title_extra=""
          if [ "${SIGN_RESULT}" = success ]; then
            if [ "${NOTARIZED}" = true ]; then
              signing="Signed and notarized (Developer ID)."
            else
              case "${FALLBACK}" in
                no-credential) why="notarization is not set up (the certificate or the notarization credential is missing)" ;;
                credential-refused) why="notarization is not available yet (Apple refused the notarization credential)" ;;
                notary-error) why="Apple's notary service could not be used for this build" ;;
                signing-failed) why="signing with the Developer ID failed for this build" ;;
                notarization-rejected) why="Apple's notary service did not accept this build" ;;
                notarization-timeout) why="Apple had not finished checking this build in time" ;;
                staple-failed) why="Apple's notarization ticket could not be attached to this build" ;;
                *) echo "::error::Unknown fallback reason from the sign job; refusing to publish."; exit 1 ;;
              esac
              signing="Ad-hoc signed, NOT notarized: ${why}. macOS blocks the first launch after a browser download; see Build for the Mac in the README."
              title_extra=", not notarized"
              echo "::warning title=Mac build NOT notarized::${signing}"
            fi
          fi
          # The release's files carry the game and the build number; the app inside
          # the zip and the folder inside the archive keep their own names.
          name="grand-treasure-island-mac-build-${BUILD_NUMBER}.zip"
          linux_name="grand-treasure-island-linux-build-${BUILD_NUMBER}.tar.gz"
          # The Windows build goes in only when its launch check passed.
          windows_name=""
          if [ "${WINDOWS_RESULT}" = success ]; then
            windows_name="grand-treasure-island-windows-build-${BUILD_NUMBER}.zip"
          fi
          api="repos/${GITHUB_REPOSITORY}"
          site="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          # The commit's date, not today's: a re-run on a later day must find the same
          # tag, and stop. Six digits, so that tags sort by build number.
          committed="$(gh api "${api}/commits/${GITHUB_SHA}" --jq .commit.committer.date)"
          day="${committed%%T*}"
          short="${GITHUB_SHA:0:7}"
          tag="$(printf 'build-%06d-%s-%s' "${BUILD_NUMBER}" "${day}" "${short}")"
          if gh api "${api}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            if lookup="$(gh api "${api}/releases/tags/${tag}" --silent 2>&1)"; then
              echo "::error::Tag ${tag} already exists, with its release. Stopping: a re-run never replaces a published build, and nothing was changed."
            else
              # gh's own error: only a 404 means there is no published release. Any
              # other failure (a 502, say) leaves that unknown.
              echo "${lookup}"
              if grep -q 'HTTP 404' <<< "${lookup}"; then
                echo "::error::Tag ${tag} exists, but no published release was found for it. An earlier publish may have lost its reply, which makes gh delete the release it had just published. Stopping with nothing changed: to publish this commit, delete the tag by hand and re-run."
              else
                echo "::error::Tag ${tag} exists, but looking up its release failed with the error above, so whether it has one is unknown. Stopping with nothing changed: re-run later, and check ${site} before deleting any tag."
              fi
            fi
            exit 1
          fi
          head="$(gh api "${api}/commits/main" --jq .sha)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            # What main has changed since this commit, from GitHub's comparison; one
            # that fails or lists 300 files or more counts as more than documentation.
            since=code
            if gh api "${api}/compare/${GITHUB_SHA}...${head}" > later.json \
              && [ "$(jq -r .status later.json)" = ahead ] && [ "$(jq '.files // [] | length' later.json)" -lt 300 ] \
              && jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' later.json | docs-only/tools/docs-only; then
              since=documentation
            fi
            if [ "${since}" != documentation ]; then
              echo "::notice::SKIP: ${GITHUB_SHA} is no longer the head of main (${head}), and main has changed more than documentation since; the newer run publishes if it passes."
              exit 0
            fi
            echo "main is at ${head}, but has changed only documentation since ${GITHUB_SHA}, so this is still the newest build and it publishes."
          fi
          mv treasure-island-mac-*.zip "${name}"
          mv treasure-island-linux-*.tar.gz "${linux_name}"
          mac_sha256="$(sha256sum "${name}" | cut -d' ' -f1)"
          linux_sha256="$(sha256sum "${linux_name}" | cut -d' ' -f1)"
          windows_sha256=""
          if [ -n "${windows_name}" ]; then
            mv treasure-island-windows-*.zip "${windows_name}"
            windows_sha256="$(sha256sum "${windows_name}" | cut -d' ' -f1)"
            windows_notes="The Windows build of the same commit is ${windows_name}: unzip it and run treasure-island.exe in its treasure-island-windows folder. It is not signed, so Windows may first show \"Windows protected your PC\": click More info, then Run anyway."
          else
            windows_notes="Windows build left out: its launch check failed."
            echo "::warning title=Windows build left out::Windows build left out: its launch check failed (the windows job ended ${WINDOWS_RESULT:-without a result}). The Mac and Linux builds are published."
          fi
          notes="${GAME_NAME}, build ${BUILD_NUMBER}: commit ${GITHUB_SHA} (committed ${committed}), built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on $(date -u +%Y-%m-%dT%H:%MZ). The build number counts the commits in main's history, so a newer build always has a larger one."
          if [ -n "${signing}" ]; then
            notes="${notes}

          ${signing}"
          fi
          notes="${notes}

          The Mac app is ${name}. For the first launch, see Build for the Mac in the README.

          The Linux build of the same commit is ${linux_name}: unpack it and run the .x86_64 program in its treasure-island-linux folder.

          ${windows_notes}

          The newest builds are always on ${site}/latest."
          title="${GAME_NAME}, build ${BUILD_NUMBER} (${day}, ${short}${title_extra})"
          { cat changelog/notes.md; echo ""; printf '%s\n' "${notes}"; } > release-notes.md
          gh release create "${tag}" "${name}" "${linux_name}" ${windows_name:+"${windows_name}"} --target "${GITHUB_SHA}" --latest --title "${title}" --notes-file release-notes.md || {
            echo "::error::Publishing ${tag} failed, so the previous build normally stays the latest release. If gh printed HTTP 404 or 403, the likely cause is that main changed .github/workflows during this publish: GitHub then refuses GITHUB_TOKEN for this commit, and the newer run publishes if it passes."
            exit 1
          }
          # GitHub's latest release must now be this one, holding exactly its files
          # (two, or three with the Windows build), all uploaded. Allow a moment for
          # GitHub to catch up.
          want="${tag}|$(printf '%s\n' "${name}" "${linux_name}" ${windows_name:+"${windows_name}"} | LC_ALL=C sort | paste -sd' ' -)"
          for _ in $(seq 12); do
            latest="$(gh api "${api}/releases/latest" --jq '.tag_name + "|" + ([.assets[] | select(.state == "uploaded") | .name] | sort | join(" "))' || true)"
            if [ "${latest}" = "${want}" ]; then
              echo "Published ${site}/tag/${tag}"
              {
                echo "tag=${tag}"
                echo "build_number=${BUILD_NUMBER}"
                echo "mac_name=${name}"
                echo "linux_name=${linux_name}"
                echo "windows_name=${windows_name}"
                echo "mac_sha256=${mac_sha256}"
                echo "linux_sha256=${linux_sha256}"
                echo "windows_sha256=${windows_sha256}"
              } >> "${GITHUB_OUTPUT}"
              {
                echo "### Published ${tag}: ${title}"
                echo ""
                echo "${signing:-Ad-hoc signed, not notarized (MAC_SIGNING is not on, so no signing was tried).}"
                if [ -z "${windows_name}" ]; then
                  echo ""
                  echo "Windows build left out: its launch check failed."
                fi
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${tag} is published, but GitHub's latest release is not it with exactly ${want#*|} (GitHub answered \"${latest:-nothing}\")."
          exit 1

  itch:
    name: Publish to itch.io
    needs: [publish]
    # After a release on main, or by hand on main for a published release (input
    # itch_release_tag), never on a dry run. Never on another branch, so never for
    # a pull request or a fork. The API key is the secret BUTLER_API_KEY of the
    # environment itch, whose deployment branch rule admits only main, and only
    # the butler steps see it. The first step lets the job go on only while that
    # rule stands: GitHub creates a missing environment, with no rule and no
    # secret, the first time a job names it, and then this job pushes nothing and
    # says why. A failure here never touches the GitHub release: continue-on-error
    # keeps the run green, and the job reports what failed.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      (needs.publish.outputs.tag != '' || inputs.itch_release_tag != '') }}
    # An Intel Mac, as the sign job ("Which Mac runs what" in the header): its
    # steps need ditto and codesign, not a particular chip.
    runs-on: macos-26-intel
    timeout-minutes: 190
    continue-on-error: true
    environment: itch
    permissions:
      contents: read
      # Only to read the environment's deployment branch rule.
      actions: read
    concurrency:
      group: itch-publish
      cancel-in-progress: false
    env:
      # The page as butler names it, user/game (https://phppco.itch.io/grand-treasure-island).
      # Every butler step and message takes it from here.
      ITCH_TARGET: phppco/grand-treasure-island
    steps:
      - name: Check the release tag, the API key and the environment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag || inputs.itch_release_tag }}
          # Only whether the secret is set, never its value.
          HAS_BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
        # The tag is checked before anything prints it. The version on itch.io is
        # the build number in the tag; a release from before build numbers has
        # its date and commit instead, as in its mac-<date>-<commit> tag.
        run: |
          if [[ "${TAG}" =~ ^build-([0-9]{6,})-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7}$ ]]; then
            version="$((10#${BASH_REMATCH[1]}))"
          elif [[ "${TAG}" =~ ^mac-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7}$ ]]; then
            version="${TAG#mac-}"
          else
            echo "::error title=itch.io::The release tag is not one such as build-001918-2026-11-16-1a2b3c4 (or an older mac-2026-11-15-c9746e7), so nothing was pushed."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [ "${HAS_BUTLER_API_KEY}" != true ]; then
            echo "::notice title=itch.io::No BUTLER_API_KEY secret is set, so nothing goes to itch.io. The GitHub release is complete."
            echo "### itch.io: skipped (no BUTLER_API_KEY secret)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # The environment's rule, from the API: custom branch rules, exactly one,
          # for the branch main.
          custom="$(gh api "repos/${GITHUB_REPOSITORY}/environments/itch" --jq '.deployment_branch_policy.custom_branch_policies // false')" || custom=unknown
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/itch/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | join(",")')" || rules=unknown
          if [ "${custom}" = unknown ] || { [ "${custom}" = true ] && [ "${rules}" = unknown ]; }; then
            echo "::warning title=itch.io::The deployment branch rule of the environment itch could not be read (GitHub's answer is above), so its key is not used and nothing goes to itch.io. The GitHub release is complete."
            echo "### itch.io: skipped (the environment's rule could not be read)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${custom}" != true ] || [ "${rules}" != branch:main ]; then
            echo "::warning title=itch.io::The environment itch does not admit the branch main alone (Settings -> Environments -> itch -> Deployment branches and tags), so its key is not used and nothing goes to itch.io. The GitHub release is complete."
            echo "### itch.io: skipped (the environment itch is not limited to main)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      # The build's CHANGELOG.txt and devlog text come only from this run's own
      # commit on main, never from the release notes or the release's tag: after
      # a release, the build job's artifact; in a re-push by hand
      # (itch_release_tag), CHANGELOG.md at this run's commit, through
      # tools/changelog.py, with the history and tags its rule reads.
      - name: Download this build's changelog
        id: changelog_artifact
        if: ${{ steps.check.outputs.enabled == 'true' && !inputs.itch_release_tag }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog

      - name: Check out CHANGELOG.md and tools/changelog.py (re-push by hand)
        id: changelog_source
        if: ${{ steps.check.outputs.enabled == 'true' && inputs.itch_release_tag }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          # The release tags, which the rule reads (as in the build job).
          fetch-tags: true
          sparse-checkout: |
            CHANGELOG.md
            tools/changelog.py
          sparse-checkout-cone-mode: false
          path: changelog-source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Choose the build's changelog
        id: changelog
        if: steps.check.outputs.enabled == 'true'
        continue-on-error: true
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          BY_HAND: ${{ inputs.itch_release_tag != '' }}
          ARTIFACT: ${{ steps.changelog_artifact.outcome }}
          SOURCE: ${{ steps.changelog_source.outcome }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md
        # Ends with found=true only when ${RUNNER_TEMP}/changelog holds this
        # build's notes.md and CHANGELOG.txt as tools/changelog.py wrote them. A
        # release with no entry gets no CHANGELOG.txt, with a notice.
        run: |
          dir="${RUNNER_TEMP}/changelog"
          if [ "${BY_HAND}" = true ]; then
            if ! [[ "${VERSION}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::notice title=itch.io::${TAG} is from before build numbers and changelogs, so its channels get no CHANGELOG.txt."
              exit 0
            fi
            if [ "${SOURCE}" != success ]; then
              echo "::warning title=itch.io::CHANGELOG.md could not be checked out (above), so the channels get no CHANGELOG.txt."
              exit 0
            fi
            status=0
            python3 -I changelog-source/tools/changelog.py notes --build "${VERSION}" --published --out "${dir}" --link "${LINK}" || status=$?
            case "${status}" in
              0) ;;
              3) echo "::notice title=itch.io::CHANGELOG.md on main has no entry for build ${VERSION}, so its channels get no CHANGELOG.txt."; exit 0 ;;
              *) echo "::warning title=itch.io::Build ${VERSION}'s changelog could not be made from CHANGELOG.md (above), so its channels get no CHANGELOG.txt."; exit 0 ;;
            esac
          elif [ "${ARTIFACT}" != success ]; then
            echo "::warning title=itch.io::This run's changelog artifact could not be downloaded (above), so the channels get no CHANGELOG.txt."
            exit 0
          fi
          if [ "$(head -n 1 "${dir}/notes.md")" != "<!-- changelog: build ${VERSION} -->" ] \
            || [ -L "${dir}/CHANGELOG.txt" ] || [ ! -f "${dir}/CHANGELOG.txt" ]; then
            echo "::warning title=itch.io::${dir} does not hold build ${VERSION}'s changelog as tools/changelog.py writes it, so the channels get no CHANGELOG.txt."
            exit 0
          fi
          echo "found=true" >> "${GITHUB_OUTPUT}"

      - name: Download the release's builds
        id: builds
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          # What the publish job uploaded: names and SHA-256. Empty in a run by
          # hand, which finds the files by name in the release and checks them
          # against the SHA-256 GitHub recorded at upload instead.
          PUBLISHED_MAC_NAME: ${{ needs.publish.outputs.mac_name }}
          PUBLISHED_LINUX_NAME: ${{ needs.publish.outputs.linux_name }}
          PUBLISHED_WINDOWS_NAME: ${{ needs.publish.outputs.windows_name }}
          PUBLISHED_MAC_SHA256: ${{ needs.publish.outputs.mac_sha256 }}
          PUBLISHED_LINUX_SHA256: ${{ needs.publish.outputs.linux_sha256 }}
          PUBLISHED_WINDOWS_SHA256: ${{ needs.publish.outputs.windows_sha256 }}
        # A release's files are grand-treasure-island-mac-build-<N>.zip,
        # grand-treasure-island-linux-build-<N>.tar.gz and
        # grand-treasure-island-windows-build-<N>.zip, or, for releases from before
        # 2026-11-16, treasure-island-mac.zip and treasure-island-linux.tar.gz, with
        # no Windows build. They are kept here as release/mac.zip,
        # release/linux.tar.gz and release/windows.zip.
        run: |
          if [ -n "${PUBLISHED_MAC_NAME}" ]; then
            mac_name="${PUBLISHED_MAC_NAME}"
            linux_name="${PUBLISHED_LINUX_NAME}"
            windows_name="${PUBLISHED_WINDOWS_NAME}"
          else
            assets="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets[].name')"
            mac_name=""
            linux_name=""
            windows_name=""
            for candidate in "grand-treasure-island-mac-build-${VERSION}.zip" treasure-island-mac.zip; do
              if grep -qxF "${candidate}" <<< "${assets}"; then mac_name="${candidate}"; break; fi
            done
            for candidate in "grand-treasure-island-linux-build-${VERSION}.tar.gz" treasure-island-linux.tar.gz; do
              if grep -qxF "${candidate}" <<< "${assets}"; then linux_name="${candidate}"; break; fi
            done
            if grep -qxF "grand-treasure-island-windows-build-${VERSION}.zip" <<< "${assets}"; then
              windows_name="grand-treasure-island-windows-build-${VERSION}.zip"
            fi
          fi
          [ -n "${mac_name}" ] || { echo "::error::${TAG} has no Mac zip (grand-treasure-island-mac-build-${VERSION}.zip or treasure-island-mac.zip)."; exit 1; }
          mkdir release
          gh release download "${TAG}" --dir release --pattern "${mac_name}" ${linux_name:+--pattern "${linux_name}"} ${windows_name:+--pattern "${windows_name}"}
          for name in "${mac_name}" ${linux_name:+"${linux_name}"} ${windows_name:+"${windows_name}"}; do
            file="release/${name}"
            [ -f "${file}" ] || { echo "::error::${name} was not downloaded from ${TAG}."; exit 1; }
            actual="$(shasum -a 256 "${file}" | cut -d' ' -f1)"
            echo "${name}: SHA-256 ${actual}"
            case "${name}" in
              "${mac_name}") expected="${PUBLISHED_MAC_SHA256}" ;;
              "${linux_name}") expected="${PUBLISHED_LINUX_SHA256}" ;;
              *) expected="${PUBLISHED_WINDOWS_SHA256}" ;;
            esac
            source="the publish job uploaded"
            if [ -z "${expected}" ]; then
              recorded="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${name}\") | .digest")"
              expected="${recorded#sha256:}"
              source="GitHub recorded"
            fi
            if [ -z "${expected}" ] || [ "${expected}" = null ]; then
              echo "::warning::GitHub recorded no digest for ${name}, so the download could not be checked."
            elif [ "${expected}" != "${actual}" ]; then
              echo "::error::${name} is not the file ${source} (SHA-256 ${expected})."
              exit 1
            fi
          done
          mv "release/${mac_name}" release/mac.zip
          if [ -n "${linux_name}" ]; then
            mv "release/${linux_name}" release/linux.tar.gz
            echo "linux=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=itch.io::${TAG} has no Linux build (releases before the Linux package have none), so the linux channel gets nothing."
          fi
          if [ -n "${windows_name}" ]; then
            mv "release/${windows_name}" release/windows.zip
            echo "windows=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=itch.io::${TAG} has no Windows build (releases before the Windows build have none, and a release whose Windows launch check failed leaves it out), so the windows channel gets nothing."
          fi

      - name: Install butler
        id: butler
        if: steps.builds.outcome == 'success'
        env:
          # itch's own build from broth (https://itch.io/docs/butler/installing.html),
          # for the Intel Mac this job runs on (darwin-amd64). itch publishes no
          # checksum for it: this SHA-256 is of the darwin-amd64 15.32.0 archive as
          # broth served it on 2026-11-16 (twice, the same bytes), whose butler
          # executable and 7-zip libraries are byte-identical to those in
          # butler-darwin-amd64.zip of the v15.32.0 release of
          # github.com/itchio/butler, for which GitHub records the zip's digest
          # (sha256:fe7607c6227cd735231e4a7376b8148666d84fba63b9e9e6a5e313c5da70466c).
          BUTLER_VERSION: "15.32.0"
          BUTLER_SHA256: a92947c9556c9bfb0cc9bdc3814f342b30e0ee7269efc418658894a916ca9584
        run: |
          dir="${RUNNER_TEMP}/butler"
          mkdir -p "${dir}"
          # --retry-all-errors: a reset connection is retried too (2026-11-16: "curl:
          # (56) Recv failure: Connection reset by peer" 0.85 s into the download).
          curl -fsSL --retry 3 --retry-all-errors -o "${dir}/butler.zip" "https://broth.itch.zone/butler/darwin-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  ${dir}/butler.zip" | shasum -a 256 -c -
          unzip -q -o "${dir}/butler.zip" -d "${dir}"
          chmod 0755 "${dir}/butler"
          "${dir}/butler" version
          echo "${dir}" >> "${GITHUB_PATH}"
          # push-when-ready DIR TARGET:CHANNEL VERSION pushes with butler. itch.io
          # refuses a new build on a channel while that channel's latest build is
          # still processing ("…: channel mac's latest build is still processing,
          # try again later"); processing a large build can take around 30 minutes
          # (https://itch.io/docs/butler/pushing.html). That answer is tried again
          # once a minute for up to 30 minutes; any other failure stops at once.
          # With --if-changed, butler pushes nothing when the files equal the
          # channel's latest processed build ("No changes and --if-changed used,
          # not pushing anything", butler 15.32.0); the step's output skipped=true
          # then says so, since no build of this version will appear.
          cat > "${dir}/push-when-ready" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          tries=31
          for attempt in $(seq 1 "${tries}"); do
            status=0
            butler push "$1" "$2" --userversion "$3" --if-changed 2>&1 | tee push.log || status=$?
            if [ "${status}" -eq 0 ]; then
              if grep -q "No changes and --if-changed used" push.log; then
                echo "skipped=true" >> "${GITHUB_OUTPUT}"
              fi
              exit 0
            fi
            if ! grep -q "latest build is still processing" push.log; then exit "${status}"; fi
            if [ "${attempt}" -eq "${tries}" ]; then
              echo "itch.io was still processing the channel's previous build after 30 minutes, so this build was not pushed."
              exit "${status}"
            fi
            echo "itch.io is still processing the channel's previous build; trying again in a minute (attempt ${attempt} of ${tries})."
            sleep 60
          done
          SH
          chmod 0755 "${dir}/push-when-ready"

      - name: Stage the Mac app and check its signature
        id: mac
        if: steps.builds.outcome == 'success'
        # What is pushed is this folder, exactly: the app as ditto unpacks it from
        # the release zip, checked with codesign here, notarized or not (owner,
        # 2026-11-15: the itch app is the route for the build that is not). A
        # signature that fails the check stops the Mac push. butler keeps symlinks
        # and permissions and only adds missing execute bits to executables
        # (https://itch.io/docs/itch/integrating/platforms/macos.html). The
        # changelog goes beside the app, outside its signature.
        env:
          CHANGELOG: ${{ steps.changelog.outputs.found }}
        run: |
          ditto -x -k release/mac.zip stage/mac
          apps=(stage/mac/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "::error::expected one .app in the Mac zip"; exit 1; }
          [ "$(find stage/mac -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 1 ] || { echo "::error::the Mac zip holds more than the app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          # The changelog goes into a real folder that has no CHANGELOG.txt yet,
          # never through a link (here and in the Linux and Windows steps).
          if [ "${CHANGELOG}" = true ]; then
            if [ -L stage/mac ] || [ ! -d stage/mac ] || [ -e stage/mac/CHANGELOG.txt ] || [ -L stage/mac/CHANGELOG.txt ]; then
              echo "::error::stage/mac is not a plain folder without a CHANGELOG.txt, so the Mac app is not pushed."
              exit 1
            fi
            cp "${RUNNER_TEMP}/changelog/CHANGELOG.txt" stage/mac/CHANGELOG.txt
          fi
          # A list of what is pushed, to compare with what itch.io serves later:
          # each file's path, SHA-256 and whether it is executable, and each link's
          # target. Other permission bits are left out, so that itch.io normalising
          # them is no difference.
          cat > "${RUNNER_TEMP}/manifest.py" <<'PY'
          import hashlib, os, stat, sys
          root = sys.argv[1]
          for top, dirs, files in os.walk(root):
              dirs.sort()
              for name in sorted(dirs) + sorted(files):
                  path = os.path.join(top, name)
                  info = os.lstat(path)
                  rel = os.path.relpath(path, root)
                  if stat.S_ISLNK(info.st_mode):
                      print("link", os.readlink(path), rel)
                  elif stat.S_ISDIR(info.st_mode):
                      print("dir ", rel)
                  else:
                      executable = "x" if info.st_mode & 0o111 else "-"
                      digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
                      print("file", executable, digest, rel)
          PY
          python3 -I "${RUNNER_TEMP}/manifest.py" stage/mac > mac-pushed.txt
          cat mac-pushed.txt

      - name: Push the Mac app to itch.io
        id: push_mac
        if: steps.mac.outcome == 'success'
        timeout-minutes: 40
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.check.outputs.version }}
        run: push-when-ready stage/mac "${ITCH_TARGET}:mac" "${VERSION}"

      # The linux channel does not depend on the mac one: these steps run even
      # when the Mac app's check or push failed.
      - name: Stage the Linux build
        id: linux
        if: ${{ !cancelled() && steps.butler.outcome == 'success' && steps.builds.outputs.linux == 'true' }}
        env:
          CHANGELOG: ${{ steps.changelog.outputs.found }}
        run: |
          mkdir -p stage/linux
          tar -xzf release/linux.tar.gz -C stage/linux
          folder=stage/linux/treasure-island-linux
          # Exactly what the build job packed: the folder with the executable and
          # its .pck alone, hidden files included, and no link anywhere.
          shopt -s nullglob dotglob
          top=(stage/linux/*)
          if [ "${top[*]}" != "${folder}" ] || [ -L "${folder}" ] || [ ! -d "${folder}" ] || [ -n "$(find stage/linux -type l)" ]; then
            printf -v shown '%q ' "${top[@]}"
            echo "::error::the Linux package should hold the folder treasure-island-linux alone, with no links in it; it holds ${shown}"
            exit 1
          fi
          files=("${folder}"/*)
          exes=("${folder}"/*.x86_64)
          [ "${#exes[@]}" -eq 1 ] && [ -f "${exes[0]}" ] && [ -x "${exes[0]}" ] || { echo "::error::expected one executable .x86_64 in the Linux package"; exit 1; }
          if [ "${#files[@]}" -ne 2 ] || [ ! -f "${exes[0]%.x86_64}.pck" ]; then
            printf -v shown '%q ' "${files[@]}"
            echo "::error::the Linux package's folder should hold its executable and its .pck alone; it holds ${shown}"
            exit 1
          fi
          if [ "${CHANGELOG}" = true ]; then
            if [ -e "${folder}/CHANGELOG.txt" ] || [ -L "${folder}/CHANGELOG.txt" ]; then
              echo "::error::the Linux package already holds a CHANGELOG.txt, so it is not pushed."
              exit 1
            fi
            cp "${RUNNER_TEMP}/changelog/CHANGELOG.txt" "${folder}/CHANGELOG.txt"
          fi
          ls -l "${folder}"

      - name: Push the Linux build to itch.io
        id: push_linux
        if: ${{ !cancelled() && steps.linux.outcome == 'success' }}
        timeout-minutes: 40
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.check.outputs.version }}
        run: push-when-ready stage/linux/treasure-island-linux "${ITCH_TARGET}:linux" "${VERSION}"

      # Nor does the windows channel depend on the others.
      - name: Stage the Windows build
        id: windows
        if: ${{ !cancelled() && steps.butler.outcome == 'success' && steps.builds.outputs.windows == 'true' }}
        env:
          CHANGELOG: ${{ steps.changelog.outputs.found }}
        run: |
          mkdir -p stage/windows
          ditto -x -k release/windows.zip stage/windows
          # Exactly what tools/build-mac.sh zipped: the folder with the .exe and its
          # .pck, and no link anywhere.
          if [ -L stage/windows/treasure-island-windows ] || [ -n "$(find stage/windows -type l)" ]; then
            echo "::error::the Windows zip should hold no links, so it is not pushed."
            exit 1
          fi
          shopt -s nullglob dotglob
          top=(stage/windows/*)
          files=(stage/windows/treasure-island-windows/*)
          if [ "${top[*]}" != stage/windows/treasure-island-windows ] || [ "${files[*]}" != "stage/windows/treasure-island-windows/treasure-island.exe stage/windows/treasure-island-windows/treasure-island.pck" ]; then
            printf -v shown '%q ' "${top[@]}" : "${files[@]}"
            echo "::error::the Windows zip should hold the folder treasure-island-windows with treasure-island.exe and treasure-island.pck alone; it holds ${shown}"
            exit 1
          fi
          if [ "${CHANGELOG}" = true ]; then
            # Checked above: a real folder, holding only the .exe and the .pck.
            if [ -e stage/windows/treasure-island-windows/CHANGELOG.txt ] || [ -L stage/windows/treasure-island-windows/CHANGELOG.txt ]; then
              echo "::error::the Windows zip already holds a CHANGELOG.txt, so it is not pushed."
              exit 1
            fi
            cp "${RUNNER_TEMP}/changelog/CHANGELOG.txt" stage/windows/treasure-island-windows/CHANGELOG.txt
          fi
          ls -l stage/windows/treasure-island-windows

      - name: Push the Windows build to itch.io
        id: push_windows
        if: ${{ !cancelled() && steps.windows.outcome == 'success' }}
        timeout-minutes: 40
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.check.outputs.version }}
        run: push-when-ready stage/windows/treasure-island-windows "${ITCH_TARGET}:windows" "${VERSION}"

      - name: Check the Mac app itch.io serves
        id: served
        if: ${{ !cancelled() && steps.push_mac.outcome == 'success' }}
        timeout-minutes: 55
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.check.outputs.version }}
          SKIPPED: ${{ steps.push_mac.outputs.skipped }}
        # itch.io serves a build only once it has processed it, which for a large
        # build can take around 30 minutes (https://itch.io/docs/butler/pushing.html);
        # until then it serves the channel's previous build, or, for a channel's
        # first build, answers "invalid channel" (seen on 2026-11-16, build 1929).
        # So this step asks butler status, once a minute for up to 45 minutes,
        # until the channel's latest processed build is the one pushed: its user
        # version is this release's version and its state "completed" (butler
        # 15.32.0's --json status gives both). Only then does butler fetch download
        # it, to pass codesign and match what was pushed, file for file. When the
        # time runs out the warning says what itch.io serves meanwhile. When butler
        # pushed nothing because the files were unchanged, no build of this version
        # will appear, so the step takes the channel's processed build, whatever
        # its version, as the one to check, and says if a build is pending. A
        # mismatch or a timeout is reported, not a failure: the push itself
        # succeeded. The output head names the version itch.io serves.
        run: |
          tries=45
          if [ "${SKIPPED}" = true ]; then tries=3; fi
          live=""
          seen=""
          pending=""
          for attempt in $(seq 1 "${tries}"); do
            status=0
            answer="$(butler --json status "${ITCH_TARGET}" 2>&1)" || status=$?
            channel="$(jq -R -c 'fromjson? | select(.type == "result") | .value.channels[]? | select(.name == "mac")' <<< "${answer}" | tail -n 1)"
            head="$(jq -r '.head // empty | "\(.userVersion) \(.state)"' <<< "${channel:-null}")"
            pending="$(jq -r '.pending // empty | "\(.userVersion) \(.state)"' <<< "${channel:-null}")"
            linux_head="$(jq -R -r 'fromjson? | select(.type == "result") | .value.channels[]? | select(.name == "linux") | .head.userVersion // empty' <<< "${answer}" | tail -n 1)"
            windows_head="$(jq -R -r 'fromjson? | select(.type == "result") | .value.channels[]? | select(.name == "windows") | .head.userVersion // empty' <<< "${answer}" | tail -n 1)"
            if [ "${status}" -eq 0 ] && [ "${head}" = "${VERSION} completed" ]; then live=yes; break; fi
            if [ "${status}" -eq 0 ] && [ "${SKIPPED}" = true ] && [ "${head##* }" = completed ]; then live=yes; break; fi
            if [ "${status}" -eq 0 ]; then
              seen="${head}"
              echo "Attempt ${attempt}: the mac channel's latest processed build is ${head:-none yet}${pending:+; pending: ${pending}}."
            else
              echo "Attempt ${attempt}: $(tail -n 1 <<< "${answer}")"
            fi
            if [ "${attempt}" -lt "${tries}" ]; then sleep 60; fi
          done
          state="The build's state shows on the game's Edit page under Uploads, or with butler status ${ITCH_TARGET}."
          echo "linux_head=${linux_head}" >> "${GITHUB_OUTPUT}"
          echo "windows_head=${windows_head}" >> "${GITHUB_OUTPUT}"
          if [ -z "${live}" ]; then
            if [ -n "${seen}" ]; then
              why="itch.io still serves another build, version ${seen% *}${pending:+, while version ${pending% *} is ${pending##* }}"
            elif [ "${status}" -eq 0 ]; then
              why="itch.io was still processing it (the channel has no processed build yet)"
            else
              case "${answer}" in
                *"invalid target"*) why="itch.io did not recognise ${ITCH_TARGET} (a renamed account or game page?)" ;;
                *) why="butler status kept failing (its last answer is above)" ;;
              esac
            fi
            if [ "${SKIPPED}" = true ]; then
              echo "::warning title=itch.io::butler pushed nothing for the Mac build (version ${VERSION}), as its files equal the mac channel's processed build, but that build could not be checked: ${why}. ${state}"
            else
              echo "::warning title=itch.io::The Mac build (version ${VERSION}) was pushed, but itch.io did not serve it within 45 minutes: ${why}. ${state} The app it serves was not checked."
            fi
            echo "check=not-done" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          served_version="${head% *}"
          echo "head=${served_version}" >> "${GITHUB_OUTPUT}"
          if [ "${SKIPPED}" = true ] && [ -n "${pending}" ]; then
            echo "::notice title=itch.io::The mac channel also has version ${pending% *} ${pending##* }; until it is done itch.io serves version ${served_version}, which the files of version ${VERSION} equal."
          fi
          fetched=""
          for attempt in 1 2 3; do
            rm -rf served
            status=0
            answer="$(butler fetch "${ITCH_TARGET}:mac" served 2>&1)" || status=$?
            if [ "${status}" -eq 0 ]; then fetched=yes; break; fi
            echo "Fetch attempt ${attempt}: $(tail -n 1 <<< "${answer}")"
            if [ "${attempt}" -lt 3 ]; then sleep 30; fi
          done
          if [ -z "${fetched}" ]; then
            echo "::warning title=itch.io::itch.io serves version ${served_version} of the Mac build, but butler fetch could not download it (its last answer is above), so the app it serves was not checked."
            echo "check=not-done" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          apps=(served/*.app)
          if [ "${#apps[@]}" -eq 1 ] && codesign --verify --deep --strict --verbose=2 "${apps[0]}"; then
            signature=ok
          else
            signature=failed
          fi
          python3 -I "${RUNNER_TEMP}/manifest.py" served > mac-served.txt
          if [ "${signature}" = ok ] && diff mac-pushed.txt mac-served.txt; then
            echo "check=same" >> "${GITHUB_OUTPUT}"
            echo "The Mac app itch.io serves as version ${served_version} is, file for file, the one of version ${VERSION}, and passes codesign --verify --deep --strict."
          else
            echo "check=different" >> "${GITHUB_OUTPUT}"
            if [ "${SKIPPED}" = true ]; then
              echo "::warning title=itch.io::butler found no changes and pushed nothing, yet the Mac app itch.io serves as version ${served_version} differs from version ${VERSION}'s (codesign: ${signature}; differences above). ${state}"
            else
              echo "::warning title=itch.io::The Mac app itch.io serves as version ${VERSION} differs from the one pushed (codesign: ${signature}; differences above), unless a newer push replaced it since. ${state}"
            fi
          fi

      - name: Report
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
          ENABLED: ${{ steps.check.outputs.enabled }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          BUILDS: ${{ steps.builds.outcome }}
          LINUX: ${{ steps.builds.outputs.linux }}
          WINDOWS: ${{ steps.builds.outputs.windows }}
          PUSH_MAC: ${{ steps.push_mac.outcome }}
          PUSH_LINUX: ${{ steps.push_linux.outcome }}
          PUSH_WINDOWS: ${{ steps.push_windows.outcome }}
          MAC_SKIPPED: ${{ steps.push_mac.outputs.skipped }}
          LINUX_SKIPPED: ${{ steps.push_linux.outputs.skipped }}
          WINDOWS_SKIPPED: ${{ steps.push_windows.outputs.skipped }}
          MAC_HEAD: ${{ steps.served.outputs.head }}
          LINUX_HEAD: ${{ steps.served.outputs.linux_head }}
          WINDOWS_HEAD: ${{ steps.served.outputs.windows_head }}
          SERVED: ${{ steps.served.outputs.check }}
          CHANGELOG: ${{ steps.changelog.outputs.found }}
        # Prints only the tag the first step accepted. A channel that butler left
        # alone (its files equal the channel's processed build) keeps showing that
        # build's version on itch.io; the report names both. The changelog goes
        # into the summary as a file's contents, never onto the log.
        run: |
          if [ "${CHECK}" != success ]; then
            echo "### itch.io: nothing pushed (the release tag was not accepted)" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          [ "${ENABLED}" = true ] || exit 0
          {
            echo "### itch.io: ${ITCH_TARGET}, version ${VERSION}, for ${TAG}"
            echo ""
            if [ "${MAC_SKIPPED}" = true ]; then
              echo "- mac channel: unchanged since version ${MAC_HEAD:-unknown} (version ${VERSION} has the same files, so butler pushed nothing)${SERVED:+; the app itch.io serves: ${SERVED}}"
            else
              echo "- mac channel: ${PUSH_MAC:-not pushed}${SERVED:+ (the app itch.io serves: ${SERVED})}"
            fi
            if [ "${LINUX}" = true ] && [ "${LINUX_SKIPPED}" = true ]; then
              echo "- linux channel: unchanged since version ${LINUX_HEAD:-unknown} (version ${VERSION} has the same files, so butler pushed nothing)"
            elif [ "${LINUX}" = true ]; then
              echo "- linux channel: ${PUSH_LINUX:-not pushed}"
            else
              echo "- linux channel: not pushed (no Linux build in this release)"
            fi
            if [ "${WINDOWS}" = true ] && [ "${WINDOWS_SKIPPED}" = true ]; then
              echo "- windows channel: unchanged since version ${WINDOWS_HEAD:-unknown} (version ${VERSION} has the same files, so butler pushed nothing)"
            elif [ "${WINDOWS}" = true ]; then
              echo "- windows channel: ${PUSH_WINDOWS:-not pushed}"
            else
              echo "- windows channel: not pushed (no Windows build in this release)"
            fi
            if [ "${CHANGELOG}" = true ]; then
              echo ""
              echo "Each channel's folder holds CHANGELOG.txt, build ${VERSION}'s changelog from CHANGELOG.md."
              echo ""
              echo "#### Devlog for build ${VERSION}, to post by hand"
              echo ""
              echo "itch.io has no API or butler command that posts a devlog. To show these changes on the game page, post them on the game's Devlog (Write a new post), titled \"Build ${VERSION}\":"
              echo ""
              echo "---"
              echo ""
              cat "${RUNNER_TEMP}/changelog/CHANGELOG.txt"
              echo ""
              echo "---"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          failed=no
          [ "${BUILDS}" = success ] || failed=yes
          [ "${PUSH_MAC}" = success ] || failed=yes
          [ "${LINUX}" != true ] || [ "${PUSH_LINUX}" = success ] || failed=yes
          [ "${WINDOWS}" != true ] || [ "${PUSH_WINDOWS}" = success ] || failed=yes
          if [ "${failed}" = yes ]; then
            echo "::error title=itch.io::Pushing to itch.io failed (see the steps above). The GitHub release is complete and unaffected. To try again, start this workflow by hand on main with itch_release_tag=${TAG}."
            exit 1
          fi

  virustotal:
    name: Scan on VirusTotal
    needs: [publish]
    # After a release on main; never on a dry run, another branch, a pull request
    # or a fork. Submits the release's own files to VirusTotal's public API. The
    # key is the secret VIRUSTOTAL_API_KEY of the environment itch (deployment
    # branch main only), seen only by the two VirusTotal steps; as in the itch job,
    # the first step lets the job go on only while that rule stands. This job may
    # not write: the job after it puts each file's SHA-256 and report link into the
    # release notes, without the key. Detections, timeouts, quota limits and
    # outages never fail the run or touch the published files (continue-on-error);
    # the job reports them.
    #
    # VirusTotal's terms, as they stood on 2026-11-15: the public API is for
    # non-commercial use, at most 4 requests a minute and 500 a day, in workflows
    # that contribute new files (https://docs.virustotal.com/reference/public-vs-premium-api);
    # uploaded files are shared with VirusTotal's partners and premium customers,
    # so only these already public release files are sent; results may not be
    # passed on to third parties or publicly attributed to a named engine vendor
    # (Google SecOps service terms, section 3, https://cloud.google.com/terms/secops/service-terms).
    # So the notes and this job's summary carry links to VirusTotal's own reports,
    # never verdicts or counts.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.publish.outputs.tag != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    environment: itch
    permissions:
      contents: read
      # Only to read the environment's deployment branch rule.
      actions: read
    concurrency:
      group: virustotal
      cancel-in-progress: false
    outputs:
      # One line per file, for the notes job: its name, SHA-256, whether it was
      # submitted (submitted, known, quota or failed) and whether its analysis
      # completed (completed, running or -).
      results: ${{ steps.results.outputs.results }}
    steps:
      - name: Check the API key and the environment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Only whether the secret is set, never its value.
          HAS_VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
        run: |
          if [ "${HAS_VIRUSTOTAL_API_KEY}" != true ]; then
            echo "::notice title=VirusTotal::No VIRUSTOTAL_API_KEY secret is set, so the release is not submitted to VirusTotal."
            echo "### VirusTotal: skipped (no VIRUSTOTAL_API_KEY secret)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # The environment's rule, from the API: custom branch rules, exactly one,
          # for the branch main.
          custom="$(gh api "repos/${GITHUB_REPOSITORY}/environments/itch" --jq '.deployment_branch_policy.custom_branch_policies // false')" || custom=unknown
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/itch/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | join(",")')" || rules=unknown
          if [ "${custom}" = unknown ] || { [ "${custom}" = true ] && [ "${rules}" = unknown ]; }; then
            echo "::warning title=VirusTotal::The deployment branch rule of the environment itch could not be read (GitHub's answer is above), so its key is not used and nothing goes to VirusTotal. The release is complete."
            echo "### VirusTotal: skipped (the environment's rule could not be read)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${custom}" != true ] || [ "${rules}" != branch:main ]; then
            echo "::warning title=VirusTotal::The environment itch does not admit the branch main alone (Settings -> Environments -> itch -> Deployment branches and tags), so its key is not used and nothing goes to VirusTotal. The release is complete."
            echo "### VirusTotal: skipped (the environment itch is not limited to main)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Download the release's files
        id: files
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          MAC_NAME: ${{ needs.publish.outputs.mac_name }}
          LINUX_NAME: ${{ needs.publish.outputs.linux_name }}
          WINDOWS_NAME: ${{ needs.publish.outputs.windows_name }}
          PUBLISHED_MAC_SHA256: ${{ needs.publish.outputs.mac_sha256 }}
          PUBLISHED_LINUX_SHA256: ${{ needs.publish.outputs.linux_sha256 }}
          PUBLISHED_WINDOWS_SHA256: ${{ needs.publish.outputs.windows_sha256 }}
        # Exactly the published files, by the names the publish job gave them, each
        # checked against the SHA-256 it computed before uploading it; nothing
        # else is ever uploaded. A release without the Windows build has no
        # Windows name.
        run: |
          mkdir release
          gh release download "${TAG}" --dir release --pattern "${MAC_NAME}" --pattern "${LINUX_NAME}" ${WINDOWS_NAME:+--pattern "${WINDOWS_NAME}"}
          for name in "${MAC_NAME}" "${LINUX_NAME}" ${WINDOWS_NAME:+"${WINDOWS_NAME}"}; do
            case "${name}" in
              "${MAC_NAME}") expected="${PUBLISHED_MAC_SHA256}" ;;
              "${LINUX_NAME}") expected="${PUBLISHED_LINUX_SHA256}" ;;
              *) expected="${PUBLISHED_WINDOWS_SHA256}" ;;
            esac
            actual="$(sha256sum "release/${name}" | cut -d' ' -f1)"
            if [ -z "${expected}" ] || [ "${actual}" != "${expected}" ]; then
              echo "::error::${name} is not the file the publish job uploaded (SHA-256 ${expected:-unknown})."
              exit 1
            fi
            echo "${name} ${actual}"
          done | tee files.txt

      - name: Submit the files to VirusTotal
        id: submit
        if: steps.files.outcome == 'success'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        # One request at a time, at most four a minute. The key goes to curl on
        # standard input (-H @-), never on its command line, and only ever over
        # https to virustotal.com or a host under it. A file VirusTotal already has
        # is not uploaded again. Results go to results.txt: name, SHA-256, state
        # (submitted, known, quota, refused or failed), analysis id.
        #
        # A file over 32 MB goes to the address GET /files/upload_url returns.
        # VirusTotal's reference for it (docs.virustotal.com/reference/files-upload-url,
        # updated 2026-09-24) shows http://www.virustotal.com/_ah/upload/..., and says
        # the upload has the format of POST /files, whose x-apikey header is required;
        # VirusTotal's own clients (vt-py, vt-go) send the key there too, so it goes
        # with the file. The address is accepted when it is https (or http, sent over
        # https), has no user name and no port, and its host is virustotal.com or a
        # host under it, matched whole label by label: every host under
        # virustotal.com is VirusTotal's own, the party the key belongs to, and the
        # check exists to keep the key from a third party named in a tampered
        # reply. curl then speaks https alone and follows no redirect. Any other
        # address is refused. Either way the address's scheme and host (never its
        # path or query, which carry a signed upload token) are printed.
        run: |
          api=https://www.virustotal.com/api/v3
          last=0
          # vt METHOD URL [curl arguments]: the reply goes to reply.json, the HTTP
          # status to ${code}; 000 means no answer at all.
          vt() {
            local wait=$(( last + 16 - $(date +%s) ))
            if [ "${wait}" -gt 0 ]; then sleep "${wait}"; fi
            last="$(date +%s)"
            code="$(printf 'x-apikey: %s\n' "${VIRUSTOTAL_API_KEY}" | curl -sS --max-time 900 -o reply.json -w '%{http_code}' -H @- -X "$1" "$2" "${@:3}")" || code=000
          }
          state_of() { # an HTTP status that is not a success
            if [ "$1" = 429 ]; then echo quota; else echo failed; fi
          }
          : > results.txt
          while read -r name sha; do
            vt GET "${api}/files/${sha}"
            if [ "${code}" = 200 ]; then
              jq -c '.data.attributes.last_analysis_stats' reply.json > "stats-${sha}.json"
              echo "${name} ${sha} known -" >> results.txt
              continue
            elif [ "${code}" != 404 ]; then
              echo "::warning title=VirusTotal::Looking up ${name} failed (HTTP ${code})."
              echo "${name} ${sha} $(state_of "${code}") -" >> results.txt
              continue
            fi
            vt GET "${api}/files/upload_url"
            url="$(jq -r '.data // empty' reply.json 2>/dev/null || true)"
            if [ "${code}" != 200 ] || [ -z "${url}" ]; then
              echo "::warning title=VirusTotal::Getting an upload address for ${name} failed (HTTP ${code})."
              echo "${name} ${sha} $(state_of "${code}") -" >> results.txt
              continue
            fi
            if [[ "${url}" =~ ^([A-Za-z][A-Za-z0-9+.-]*)://([A-Za-z0-9.-]+)(:[0-9]+)?(/|\?|$) ]]; then
              where="${BASH_REMATCH[1]}://${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
            else
              where="an address not of the form scheme://host/"
            fi
            echo "VirusTotal's upload address for ${name} is on ${where}."
            accepted=""
            if [[ "${url}" =~ ^(https?)://([A-Za-z0-9.-]+)(/.*)?$ ]]; then
              scheme="${BASH_REMATCH[1]}"
              host="${BASH_REMATCH[2],,}"
              if [[ "${host}" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)*virustotal\.com$ ]]; then
                accepted=yes
                if [ "${scheme}" = http ]; then url="https://${url#http://}"; fi
              fi
            fi
            if [ -z "${accepted}" ]; then
              echo "::warning title=VirusTotal::The upload address VirusTotal gave for ${name} is on ${where}, not https on virustotal.com or a host under it with no user name or port, so neither the file nor the key was sent there."
              echo "${name} ${sha} refused -" >> results.txt
              continue
            fi
            vt POST "${url}" --proto =https -F "file=@release/${name}"
            analysis="$(jq -r '.data.id // empty' reply.json 2>/dev/null || true)"
            if [ "${code}" != 200 ] || [ -z "${analysis}" ]; then
              echo "::warning title=VirusTotal::Uploading ${name} failed (HTTP ${code})."
              echo "${name} ${sha} $(state_of "${code}") -" >> results.txt
              continue
            fi
            echo "${name} ${sha} submitted ${analysis}" >> results.txt
          done < files.txt
          cat results.txt

      - name: Wait for VirusTotal's analyses
        id: wait
        if: steps.submit.outcome == 'success'
        timeout-minutes: 25
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        # Asks about each unfinished analysis about once a minute, for up to 20
        # minutes. An analysis still running then stays unfinished here; its
        # report on VirusTotal completes on its own.
        run: |
          api=https://www.virustotal.com/api/v3
          last=0
          vt() {
            local wait=$(( last + 16 - $(date +%s) ))
            if [ "${wait}" -gt 0 ]; then sleep "${wait}"; fi
            last="$(date +%s)"
            code="$(printf 'x-apikey: %s\n' "${VIRUSTOTAL_API_KEY}" | curl -sS --max-time 120 -o reply.json -w '%{http_code}' -H @- -X "$1" "$2" "${@:3}")" || code=000
          }
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            pending=0
            while read -r name sha state analysis; do
              [ "${state}" = submitted ] && [ ! -f "stats-${sha}.json" ] || continue
              vt GET "${api}/analyses/${analysis}"
              status="$(jq -r '.data.attributes.status // empty' reply.json 2>/dev/null || true)"
              if [ "${code}" = 200 ] && [ "${status}" = completed ]; then
                jq -c '.data.attributes.stats' reply.json > "stats-${sha}.json"
                echo "${name}: analysis completed"
              else
                pending=$((pending + 1))
                echo "${name}: ${status:-HTTP ${code}}"
              fi
            done < results.txt
            if [ "${pending}" -eq 0 ] || [ "$(date +%s)" -ge "${deadline}" ]; then break; fi
            sleep 30
          done

      - name: Report
        id: results
        if: always() && steps.files.outcome == 'success'
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          BUILD_NUMBER: ${{ needs.publish.outputs.build_number }}
        # Links only, as VirusTotal shows them; no verdicts or counts. A file that
        # any engine flags as malicious or suspicious gets a warning without
        # numbers, for a person to look at (game engines' export templates do get
        # false positives); it never fails the run. The same lines go to the notes
        # job as this job's output.
        run: |
          # Every downloaded file gets a line, even when the submit step stopped part
          # way: a file with no result counts as failed.
          touch results.txt
          while read -r name sha; do
            grep -m 1 -F "${name} ${sha} " results.txt || echo "${name} ${sha} failed -"
          done < files.txt > merged.txt
          : > lines.txt
          {
            echo "### VirusTotal for build ${BUILD_NUMBER} (${TAG})"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          while read -r name sha state _; do
            link="https://www.virustotal.com/gui/file/${sha}"
            analysis=-
            case "${state}" in
              submitted | known)
                if [ -f "stats-${sha}.json" ]; then analysis=completed; said="analysis completed"; else analysis=running; said="analysis still running"; fi ;;
              quota) said="not submitted: VirusTotal's daily request limit was reached" ;;
              refused) said="not submitted: the upload address was not accepted" ;;
              *) said="not submitted: VirusTotal could not be reached" ;;
            esac
            echo "- [${name}](${link}): ${said}" >> "${GITHUB_STEP_SUMMARY}"
            if [ "${analysis}" = completed ] && [ "$(jq -r '(.malicious // 0) + (.suspicious // 0)' "stats-${sha}.json")" -gt 0 ]; then
              echo "::warning title=VirusTotal::VirusTotal flags ${name} of build ${BUILD_NUMBER}; a person should look before anyone relies on it (game engine builds do get false positives): ${link}"
            fi
            echo "${name} ${sha} ${state} ${analysis}" >> lines.txt
          done < merged.txt
          {
            echo "results<<VIRUSTOTAL_RESULTS"
            cat lines.txt
            echo "VIRUSTOTAL_RESULTS"
          } >> "${GITHUB_OUTPUT}"
          cat lines.txt

  virustotal-notes:
    name: Add the VirusTotal links to the release notes
    needs: [publish, virustotal]
    # Writes what the VirusTotal job found into the release notes. It sees no
    # secret: only this job may write (the release notes), and it never gets the
    # key. Never on a dry run, another branch, a pull request or a fork.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.publish.outputs.tag != '' && needs.virustotal.outputs.results != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Add the VirusTotal section to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          MAC_NAME: ${{ needs.publish.outputs.mac_name }}
          LINUX_NAME: ${{ needs.publish.outputs.linux_name }}
          WINDOWS_NAME: ${{ needs.publish.outputs.windows_name }}
          RESULTS: ${{ needs.virustotal.outputs.results }}
        # Every file gets its SHA-256 and VirusTotal's report link by that hash,
        # with a fixed note on its state; no verdicts. A result line in any other
        # form changes nothing. Re-running replaces the section instead of adding
        # a second one.
        run: |
          # Each line: one of this release's three files by name, then its SHA-256
          # and states in a fixed form.
          pattern='^[0-9a-f]{64} (submitted|known|quota|refused|failed) (completed|running|-)$'
          while read -r line; do
            [ -n "${line}" ] || continue
            name="${line%% *}"
            if { [ "${name}" != "${MAC_NAME}" ] && [ "${name}" != "${LINUX_NAME}" ] && [ "${name}" != "${WINDOWS_NAME}" ]; } || ! [[ "${line#* }" =~ ${pattern} ]]; then
              echo "::error title=VirusTotal::A result from the VirusTotal job is not in the expected form, so the release notes of ${TAG} were not changed."
              exit 1
            fi
          done <<< "${RESULTS}"
          {
            echo "VirusTotal reports, by each file's SHA-256 (submitted after publishing):"
            while read -r name sha state analysis; do
              [ -n "${name}" ] || continue
              case "${state}:${analysis}" in
                *:completed) note="" ;;
                submitted:* | known:*) note=" (the analysis was still running when this was written; the report completes on its own)" ;;
                quota:*) note=" (not submitted: VirusTotal's daily request limit was reached; the link finds the file once anyone submits it)" ;;
                refused:*) note=" (not submitted: the upload address was not accepted; the link finds the file once anyone submits it)" ;;
                *) note=" (not submitted: VirusTotal could not be reached; the link finds the file once anyone submits it)" ;;
              esac
              echo "- ${name}: SHA-256 ${sha}, https://www.virustotal.com/gui/file/${sha}${note}"
            done <<< "${RESULTS}"
          } > section.md
          gh release view "${TAG}" --json body --jq .body > body.md
          # Drop an earlier VirusTotal section (the last paragraph of the notes).
          python3 -I - body.md <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read().rstrip("\n")
          marker = "\n\nVirusTotal reports, by each file's SHA-256"
          if marker in text:
              text = text[:text.index(marker)]
          open(path, "w").write(text + "\n\n")
          PY
          cat section.md >> body.md
          if ! gh release edit "${TAG}" --notes-file body.md > /dev/null; then
            echo "::error title=VirusTotal::The VirusTotal section could not be added to the release notes of ${TAG}. The release itself is complete and unaffected."
            exit 1
          fi
          cat section.md
