# Builds the Mac app on every push to main with tools/build-mac.sh (the same
# script as in the devcontainer), signs it with the owner's Developer ID and has
# Apple notarize it, launches it on an Apple Silicon Mac to check the island
# loads, then publishes it as a new GitHub Release of its own, marked latest, so
# this fixed link always gets the newest build:
#   https://github.com/pcomans/treasure-island/releases/latest/download/treasure-island-mac.zip
# Owner-approved 2026-11-03; signing and notarization owner-requested 2026-11-07.
# Run it by hand from the Actions tab (workflow_dispatch) to test it on a branch;
# only main publishes.
#
# Signing uses only Apple's own tools on the macOS runner (security, codesign,
# xcrun notarytool and stapler, ditto). The sign job runs in the GitHub
# Environment `mac-signing` (Settings -> Environments), which the owner creates
# with Required reviewers = the owner and Deployment branches = main only, so
# each signing run waits for the owner's approval and other branches never see
# the key. To test a feature branch, add it to the deployment branches for that
# run and remove it afterwards. Environment secrets in the `mac-signing`
# environment, each set with gh from a pipe rather than the clipboard:
#   MACOS_CERTIFICATE_P12_BASE64  the "Developer ID Application" certificate with
#                                 its private key, exported from Keychain Access as .p12:
#     base64 -i cert.p12 | gh secret set MACOS_CERTIFICATE_P12_BASE64 --env mac-signing -R pcomans/treasure-island
#   MACOS_CERTIFICATE_PASSWORD    the password chosen for that .p12 export (gh prompts):
#     gh secret set MACOS_CERTIFICATE_PASSWORD --env mac-signing -R pcomans/treasure-island
#   APPSTORE_API_KEY_ID           an App Store Connect team API key (Users and
#   APPSTORE_API_ISSUER_ID        Access -> Integrations -> Team Keys, Developer
#   APPSTORE_API_KEY_P8_BASE64    role): its Key ID, the Issuer ID shown above the
#                                 key list, and the downloaded AuthKey_<id>.p8:
#     gh secret set APPSTORE_API_KEY_ID --env mac-signing -R pcomans/treasure-island
#     gh secret set APPSTORE_API_ISSUER_ID --env mac-signing -R pcomans/treasure-island
#     base64 -i AuthKey_<id>.p8 | gh secret set APPSTORE_API_KEY_P8_BASE64 --env mac-signing -R pcomans/treasure-island
# and one variable, not a secret, so logs show it unmasked (environment or
# repository level; a secret of the same name still works as a fallback):
#   APPLE_TEAM_ID                 the 10-character Team ID (developer.apple.com ->
#                                 Account -> Membership details):
#     gh variable set APPLE_TEAM_ID --env mac-signing --body <TEAMID> -R pcomans/treasure-island
# With none of these set, the build stays ad-hoc signed and is not notarized (a
# warning says so) and still publishes. With any of them set, all six are
# required (a missing one fails the run, as with a misnamed certificate secret)
# and any signing or notarization failure fails the run. The publish job uses
# GITHUB_TOKEN.
name: Mac build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only everywhere; only the publish job may write (the release).
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Concurrency is per job, not per workflow: a newer push cancels an older run's
# build or launch check, but never a publish that is under way.
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # A group of its own: an older run's launch check, queued later, must not
    # cancel a newer run's build.
    concurrency:
      group: mac-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out without LFS (only evidence videos live there)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Install Weston and Mesa
        # The graphics packages of .devcontainer/post-create.sh. The static-world
        # bake needs a real renderer (the headless dummy one drops MultiMesh data),
        # and the runner has no GPU, so in the private Weston that tools/godot
        # starts, Godot renders on Mesa's software Vulkan (lavapipe; never xvfb).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq weston libgl1 libvulkan1 mesa-vulkan-drivers
          dpkg-query -W -f '${Package} ${Version}\n' weston mesa-vulkan-drivers libvulkan1
          # tools/godot frees a Godot exit hang by reading /proc/<pid>/syscall of a
          # sibling process, which Ubuntu's default ptrace_scope=1 forbids.
          sudo sysctl -q kernel.yama.ptrace_scope=0

      - name: Prepare /opt/godot
        id: godot
        run: |
          sudo mkdir -p /opt/godot
          sudo chown "$(id -u):$(id -g)" /opt/godot
          echo "version=$(sed -n 's/^VERSION=//p' .devcontainer/setup-godot.sh)" >> "${GITHUB_OUTPUT}"

      # The cache holds only the downloaded archives, never the installed Godot:
      # setup-godot.sh checks their pinned SHA-256 and extracts them on every run,
      # so a restored cache is verified again before its macOS template reaches a
      # signed release.
      - name: Restore the Godot downloads from the cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-downloads
          # setup-godot.sh pins the version and both SHA-256 hashes, so its hash keys the cache.
          key: godot-downloads-${{ steps.godot.outputs.version }}-${{ hashFiles('.devcontainer/setup-godot.sh') }}

      - name: Install Godot and its export templates (archives are SHA-256 checked on every run)
        env:
          GODOT_DOWNLOAD_CACHE: ${{ runner.temp }}/godot-downloads
        run: .devcontainer/setup-godot.sh

      - name: Save the Godot downloads to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-downloads
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Free the disk the Godot downloads used
        run: rm -rf "${RUNNER_TEMP:?}/godot-downloads"

      - name: Build the Mac app (tools/build-mac.sh)
        timeout-minutes: 45
        env:
          # tools/godot puts its private Weston socket here.
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        # Its Linux launch check runs headless here: rendering the island on the
        # CPU takes minutes. The Apple Silicon job then launches the Mac app itself.
        run: tools/build-mac.sh --headless-launch

      - name: Upload the Mac app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: build/mac/treasure-island-mac-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Disk use
        if: always()
        run: df -h / && du -sh .git . /opt/godot || true

  sign:
    name: Sign and notarize
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    # The signing secrets live only in this environment (see the header): it
    # needs the owner's approval and admits only main.
    environment: mac-signing
    concurrency:
      group: mac-sign-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      # "true" only once Apple accepted the app and its ticket is stapled.
      notarized: ${{ steps.notarize.outputs.notarized || 'false' }}
    steps:
      - name: Check out the entitlements file only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: tools/mac-entitlements.plist
          sparse-checkout-cone-mode: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Check for the signing secrets
        id: mode
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        # Reports only which are set, never the secrets' values. APPLE_TEAM_ID is
        # a variable (a secret of that name is the fallback).
        run: |
          missing=""
          present=""
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_P8_BASE64; do
            if [ -n "${!name}" ]; then present="${present} ${name}"; else missing="${missing} ${name}"; fi
          done
          if [ -z "${present}" ]; then
            echo "::warning::No signing secrets or APPLE_TEAM_ID variable are set, so this build stays ad-hoc signed and is NOT notarized. Add the secrets listed at the top of mac-build.yml to sign and notarize it."
            echo "sign=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]; then
            echo "::error::Some of the signing settings are set (${present# }) but MACOS_CERTIFICATE_P12_BASE64 is not. The certificate secret is probably misnamed; check its exact name. Refusing to publish an unsigned build while signing is half configured."
            exit 1
          fi
          if [ -n "${missing}" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 is set, so the build must be signed and notarized, but these secrets or variables are missing:${missing}"
            exit 1
          fi
          if ! [[ "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID (${APPLE_TEAM_ID}) is not a 10-character Team ID (capital letters and digits)."
            exit 1
          fi
          echo "sign=true" >> "${GITHUB_OUTPUT}"

      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
          path: in

      - name: Pass the ad-hoc build through unchanged (no signing secrets)
        if: steps.mode.outputs.sign != 'true'
        run: |
          mkdir out
          cp in/treasure-island-mac-*.zip out/
          ls -l out

      - name: Sign with the Developer ID (hardened runtime)
        if: steps.mode.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CERTIFICATE_FILE: ${{ runner.temp }}/developer-id.p12
        # A throwaway keychain holds the certificate for this step only; the last
        # step deletes it however the job ends. The Godot export has one Mach-O
        # executable (MoltenVK is linked in statically) and no nested code today;
        # nested libraries or frameworks, as a GDExtension would add, are signed
        # first, deepest first, instead of with codesign --deep, which Apple
        # advises against for signing. Entitlements: tools/mac-entitlements.plist.
        run: |
          zips=(in/treasure-island-mac-*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected one zip from the build job, found ${#zips[@]}"; exit 1; }
          ditto -x -k "${zips[0]}" work
          apps=(work/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "::error::expected one .app in ${zips[0]}"; exit 1; }
          app="${apps[0]}"
          echo "${app}" > app-path.txt

          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${keychain_password}" "${KEYCHAIN}"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | tr -d ' \r\n' | base64 --decode > "${CERTIFICATE_FILE}"
          security import "${CERTIFICATE_FILE}" -k "${KEYCHAIN}" -f pkcs12 -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign >/dev/null
          rm -f "${CERTIFICATE_FILE}"
          # Lets codesign use the key without a permission dialog.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${KEYCHAIN}" >/dev/null
          # codesign finds the intermediate certificates through the search list.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAIN}" "${existing[@]}"

          identities="$(security find-identity -v -p codesigning "${KEYCHAIN}" | grep "Developer ID Application: .*(${APPLE_TEAM_ID})" || true)"
          if [ "$(grep -c . <<< "${identities}")" -ne 1 ]; then
            echo "::error::Expected exactly one valid \"Developer ID Application\" identity for APPLE_TEAM_ID in the certificate; found $(grep -c . <<< "${identities}"). Check that the .p12 holds that certificate with its private key, and that macOS can reach its issuer: a missing \"Developer ID Certification Authority (G2)\" intermediate certificate also leaves the identity invalid."
            security find-identity -v -p codesigning "${KEYCHAIN}" | tail -1
            exit 1
          fi
          identity="$(awk '{print $2}' <<< "${identities}")"

          # Stray extended attributes make codesign fail ("detritus not allowed").
          xattr -cr "${app}"
          sign() { codesign --force --timestamp --options runtime --keychain "${KEYCHAIN}" --sign "${identity}" "$@"; }
          nested=()
          while IFS= read -r -d '' path; do
            nested+=("${path}")
          done < <(find "${app}/Contents" -depth \
            \( -name '*.framework' -o -name '*.dylib' -o -name '*.so' -o -name '*.bundle' -o -name '*.app' -o -name '*.xpc' \) -print0)
          for path in "${nested[@]}"; do
            echo "Signing nested ${path#"${app}/"}"
            sign "${path}"
          done
          sign --entitlements tools/mac-entitlements.plist "${app}"

          codesign --verify --deep --strict --verbose=2 "${app}"
          details="$(codesign -dvv "${app}" 2>&1)"
          grep -E '^(Identifier|Format|Authority|TeamIdentifier|Timestamp|Runtime Version)=' <<< "${details}"
          grep -q "^TeamIdentifier=${APPLE_TEAM_ID}$" <<< "${details}" || { echo "::error::the signature does not carry APPLE_TEAM_ID"; exit 1; }
          grep -q '^Timestamp=' <<< "${details}" || { echo "::error::the signature has no secure timestamp"; exit 1; }
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]*\(.*runtime' <<< "${details}" || { echo "::error::the signature lacks the hardened runtime"; exit 1; }
          echo "Entitlements:"
          codesign -d --entitlements - --xml "${app}" 2>/dev/null || true; echo
          security delete-keychain "${KEYCHAIN}"

      - name: Notarize, staple and zip
        id: notarize
        if: steps.mode.outputs.sign == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          API_KEY_FILE: ${{ runner.temp }}/notary-api-key.p8
        run: |
          app="$(cat app-path.txt)"
          zips=(in/treasure-island-mac-*.zip)
          name="$(basename "${zips[0]}")"
          printf '%s' "${APPSTORE_API_KEY_P8_BASE64}" | tr -d ' \r\n' | base64 --decode > "${API_KEY_FILE}"
          auth=(--key "${API_KEY_FILE}" --key-id "${APPSTORE_API_KEY_ID}" --issuer "${APPSTORE_API_ISSUER_ID}")

          ditto -c -k --keepParent "${app}" notarize.zip
          status=0
          xcrun notarytool submit notarize.zip "${auth[@]}" --wait --timeout 45m --output-format json > notary.json || status=$?
          cat notary.json; echo
          id="$(plutil -extract id raw -o - notary.json 2>/dev/null || true)"
          result="$(plutil -extract status raw -o - notary.json 2>/dev/null || true)"
          if [ "${result}" != "Accepted" ]; then
            if [ -n "${id}" ]; then
              echo "Notary log for ${id}:"
              xcrun notarytool log "${id}" "${auth[@]}" || true
            fi
            echo "::error::Notarization did not succeed (notarytool exited ${status}, status \"${result:-none}\")."
            exit 1
          fi
          rm -f "${API_KEY_FILE}"

          # The ticket can take a moment to reach Apple's ticket service after
          # acceptance, so try stapling a few times.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "${app}"; then break; fi
            [ "${attempt}" -lt 5 ] || { echo "::error::stapling the notarization ticket failed"; exit 1; }
            sleep 20
          done
          xcrun stapler validate "${app}"

          mkdir out
          ditto -c -k --keepParent "${app}" "out/${name}"
          ls -l out
          echo "notarized=true" >> "${GITHUB_OUTPUT}"

      - name: Upload the release app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-release
          path: out/treasure-island-mac-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Delete the keychain and key files
        if: always()
        env:
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CERTIFICATE_FILE: ${{ runner.temp }}/developer-id.p12
          API_KEY_FILE: ${{ runner.temp }}/notary-api-key.p8
        run: |
          if [ -e "${KEYCHAIN}" ]; then security delete-keychain "${KEYCHAIN}" || rm -f "${KEYCHAIN}"; fi
          rm -f "${CERTIFICATE_FILE}" "${API_KEY_FILE}"

  verify:
    name: Load on Apple Silicon
    needs: sign
    runs-on: macos-26
    timeout-minutes: 20
    concurrency:
      group: mac-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-release

      - name: Launch it headless on arm64 and check the island loads
        # The same rule as the Linux launch check in tools/build-mac.sh: the game
        # loads the island, quits with 0 and prints no engine errors. A notarized
        # build must also pass Gatekeeper and carry its stapled ticket.
        env:
          NOTARIZED: ${{ needs.sign.outputs.notarized }}
        run: |
          echo "$(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)"
          df -h .
          zip="$(ls treasure-island-mac-*.zip)"
          ditto -x -k "${zip}" app
          app="$(ls -d app/*.app)"
          exe="${app}/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app}/Contents/Info.plist")"
          echo "${exe}: $(lipo -archs "${exe}")"
          codesign --verify --deep --strict --verbose=2 "${app}"
          if [ "${NOTARIZED}" = "true" ]; then
            spctl --assess --type execute -vv "${app}" || { echo "FAIL: Gatekeeper rejects the notarized app" >&2; exit 1; }
            xcrun stapler validate "${app}" || { echo "FAIL: the notarization ticket is not stapled" >&2; exit 1; }
          else
            echo "Ad-hoc signed, not notarized: skipping the Gatekeeper and ticket checks."
          fi
          log=launch.log
          arch -arm64 "${exe}" --headless -- --quit-on-ready >"${log}" 2>&1 &
          pid=$!
          # Stop it after 300 s, as tools/build-mac.sh's timeout does.
          ( for _ in $(seq 300); do sleep 1; kill -0 "${pid}" || exit 0; done; kill "${pid}" ) 2>/dev/null &
          watchdog=$!
          status=0
          wait "${pid}" || status=$?
          wait "${watchdog}" || true
          cat "${log}"
          errors="$(grep -E '^ERROR|SCRIPT ERROR' "${log}" | grep -v 'Parameter "ss" is null' || true)"
          if [ "${status}" -ne 0 ] || ! grep -q '^WORLD_READY' "${log}" || ! grep -q '^PLAY_READY' "${log}" || [ -n "${errors}" ]; then
            echo "FAIL: the Mac app (arm64, headless) exited ${status} without loading the island cleanly" >&2
            exit 1
          fi
          echo "PASS: ${zip} loads the island on $(uname -m)"

  publish:
    name: Publish
    needs: [build, sign, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Never cancelled mid-publish. A newer publish waits for it, and replaces an
    # older one that is still waiting.
    concurrency:
      group: mac-publish
      cancel-in-progress: false
    steps:
      - name: Download the Mac app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-release

      - name: Publish this build as a new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTARIZED: ${{ needs.sign.outputs.notarized }}
        # Each build gets a tag and release of its own, and nothing here replaces a
        # published build. gh uploads to a draft and then publishes it, so the fixed
        # link never reaches a release without its zip. If the reply to that publish
        # is lost, gh deletes the release it just published and the tag stays, so a
        # tag with no release stops the step for a person to look at.
        #
        # Only the head of main publishes. An older build must not take the fixed
        # link from a newer one. GitHub also refuses (HTTP 404 or 403) a release whose
        # commit has .github/workflows files that differ from main's, unless the token
        # may change workflows, and GITHUB_TOKEN never may. A commit that edits a
        # workflow is fine while it is the head of main, because then it matches main.
        # See https://docs.github.com/en/rest/releases/releases#create-a-release
        run: |
          name=treasure-island-mac.zip
          api="repos/${GITHUB_REPOSITORY}"
          site="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          # The commit's date, not today's: a re-run on a later day must find the same
          # tag, and stop.
          committed="$(gh api "${api}/commits/${GITHUB_SHA}" --jq .commit.committer.date)"
          day="${committed%%T*}"
          short="${GITHUB_SHA:0:7}"
          tag="mac-${day}-${short}"
          if gh api "${api}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            if gh api "${api}/releases/tags/${tag}" --silent 2>/dev/null; then
              echo "::error::Tag ${tag} already exists, with its release. Stopping: a re-run never replaces a published build, and nothing was changed."
            else
              echo "::error::Tag ${tag} exists, but no published release was found for it. An earlier publish may have lost its reply, which makes gh delete the release it had just published. Stopping with nothing changed: to publish this commit, delete the tag by hand and re-run."
            fi
            exit 1
          fi
          head="$(gh api "${api}/commits/main" --jq .sha)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::SKIP: ${GITHUB_SHA} is no longer the head of main (${head}); the newer run publishes if it passes."
            exit 0
          fi
          mv treasure-island-mac-*.zip "${name}"
          if [ "${NOTARIZED}" = "true" ]; then
            signing="Signed and notarized (Developer ID)."
          else
            signing="Ad-hoc signed, not notarized: macOS blocks the first launch after a browser download."
          fi
          notes="Built from commit ${GITHUB_SHA} (committed ${committed}) by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} on $(date -u +%Y-%m-%dT%H:%MZ).

          ${signing}

          The newest build is always at ${site}/latest/download/${name}
          For the first launch, see Build for the Mac in the README."
          gh release create "${tag}" "${name}" --target "${GITHUB_SHA}" --latest --title "Mac build ${day} (${short})" --notes "${notes}" || {
            echo "::error::Publishing ${tag} failed, so the previous build normally stays at the fixed link. If gh printed HTTP 404 or 403, the likely cause is that main changed .github/workflows during this publish: GitHub then refuses GITHUB_TOKEN for this commit, and the newer run publishes if it passes."
            exit 1
          }
          # The fixed link must now lead to this build. Allow a moment for the redirect.
          for _ in $(seq 12); do
            if [ "$(curl -sI -o /dev/null -w '%{redirect_url}' "${site}/latest/download/${name}")" = "${site}/download/${tag}/${name}" ]; then
              echo "Published ${site}/tag/${tag}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${tag} is published, but the fixed link does not lead to it."
          exit 1
