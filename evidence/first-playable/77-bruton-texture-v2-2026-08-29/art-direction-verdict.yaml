schema_version: codex.building-texture-art-review/1
review:
  date: '2026-08-29'
  reviewer: '/root/hawkins_texture_v2_review'
  independent_of_generation: true
  stage: candidate_source_and_proof_only
  exact_receiver_integrated: false
  reference:
    path: '/private/tmp/IMG_7170-reference.png'
    dimensions: [5712, 4284]
    sha256: '6b6a0f95902bd48c57c4f69b6bd7b97346c672d71c1b300d394170f6447db5cd'
contract:
  asset_kind: architectural_pattern_tile
  region: hawkins_main_left_six_story_upper_plane
  cell: one_complete_paired_window_bay_by_one_upper_residential_story
  canonical_motifs: [W-P]
  allowed_border_fields: [P-F, S-H]
  edge_fragments_allowed: false
  reject_if:
    - partial_or_resized_architectural_motif
    - non_homogeneous_border_field
    - invented_jamb_frame_column_panel_or_rail
    - visible_macro_grid_band_or_clone_echo
    - numeric_edge_screen_failure
batch_verdict:
  status: fail_no_candidates_pass_all_application_stage_hard_gates_correction_budget_exhausted
