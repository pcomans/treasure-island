  ranked_candidates: []
  selected_candidate: null
  selected_for_receiver_trial: null
  exact_godot_receiver: unreviewed
  whole_object_resemblance: unreviewed
  integrated_overall_acceptance: unreviewed
  production_method_change:
    status: proposed_not_implemented
    before: 'One generated square albedo encodes fluted cladding plus paired window and repeats as the facade cell.'
    after: 'One deterministic homogeneous fluted material tile plus one separately authored complete W-P/S-H facade module or atlas element placed explicitly per bay and story.'
    approval_required_before_implementation: true
