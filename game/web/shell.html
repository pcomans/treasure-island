<!DOCTYPE html>
<!-- Project-owned shell adapted from Godot 4.7.2 full-size.html; engine runtime unchanged. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- The home screen (owner, 2026-11-16): Add to Home Screen opens the game on
		     its own, full screen. tools/build-web.sh writes the manifest and its icons
		     beside the page, named after the commit like the game's files, and puts the
		     manifest's name in this link (an export without that script links none
		     that exists). The exporter's head include, below the styles, adds the
		     favicon and the iPhone's 180 x 180 apple-touch-icon. On an iPhone the
		     status bar lies over the page (black-translucent), whose layout keeps to
		     the safe area (env(safe-area-inset-*), --safe-* below). -->
		<link rel="manifest" href="$TI_WEB_MANIFEST">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Treasure Island">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

/* After the download: the game's treasure chest, centred, the notice under it
   where the download's was. */
#status-splash.chest {
	position: static;
	width: 25vmin;
	height: 25vmin;
	object-fit: contain;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: calc(10% + var(--safe-bottom));
	width: 50%;
	margin: 0 auto;
}

/* The loading line, in one place from the download to play: just above the
   download's progress bar, clear of the boot splash and the chest, and like the
   bar inside the safe area (a phone's home indicator and notch). A second line
   (after a line break) is a note on the step. */
#status-notice {
	background-color: #242424;
	border-radius: 0.5rem;
	border: 1px solid #777;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	white-space: pre-line;
	z-index: 1;
	position: absolute;
	left: var(--safe-left);
	right: var(--safe-right);
	bottom: calc(10% + 1.5rem + var(--safe-bottom));
	width: max-content;
	max-width: calc(100% - 2rem - var(--safe-left) - var(--safe-right));
	margin: 0 auto;
	box-sizing: border-box;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

// Web Audio and the first gesture (owner, 2026-11-15: on an iPhone or iPad no
// sound until the pause menu). A browser lets the engine's AudioContext start
// only in a user gesture, and Safari on iOS only in a tap's touchend (never a
// touchstart, nor the end of a slide), a click or a key; Godot resumes it only
// from its own events on the canvas. The loading screen covers the canvas until
// play is ready, so a tap on it resumed nothing, and play on a touch screen
// started with the stick, whose slides never count. Play now waits for the
// start prompt's tap or click (game/scripts/main.gd), and every such event
// anywhere on the page resumes the engine's audio while it is not running:
// suspended, or iOS's interrupted (after a call, the lock or the background).
// window.__tiAudio tells the game whether its audio runs
// (game/scripts/audio/sound.gd).
(function () {
	const Base = window.AudioContext || window.webkitAudioContext;
	if (!Base) return;
	const contexts = [];
	const audio = window.__tiAudio = {
		// Whether every context still open runs (a closed one counts for nothing).
		running: () => {
			const open = contexts.filter((context) => context.state !== 'closed');
			return open.length > 0 && open.every((context) => context.state === 'running');
		},
		onchange: null,
	};
	class TrackedAudioContext extends Base {
		constructor(...args) {
			super(...args);
			contexts.push(this);
			this.addEventListener('statechange', () => {
				if (typeof audio.onchange === 'function') audio.onchange(this.state);
			});
		}
	}
	window.AudioContext = TrackedAudioContext;
	if (window.webkitAudioContext) window.webkitAudioContext = TrackedAudioContext;
	const resume = () => {
		for (const context of contexts) {
			if (context.state !== 'running' && context.state !== 'closed') context.resume().catch(() => {});
		}
	};
	for (const type of ['touchend', 'pointerup', 'click', 'keydown', 'mousedown']) {
		document.addEventListener(type, resume, {capture: true, passive: true});
	}
}());

// The start prompt's notes on a touch screen (owner, 2026-11-16), which the game
// asks for as play is ready and shows under its Tap to play button
// (game/scripts/main.gd's _show_start_notes, hud.gd's set_start_notes).
// window.__tiStartNotes.read() gives them as JSON:
//   home_screen: how to play full screen, Share › Add to Home Screen. Only in
//     Safari on an iPhone or iPad, the one browser there whose Share menu surely
//     has it: not opened from the home screen already, not in another browser or
//     an app's own browser (each names itself, or leaves out Safari's Version/ and
//     Safari/), not in a frame, and not once dismissed (its ×,
//     dismissHomeScreen(), kept in localStorage; without storage it comes back
//     next visit). Safari opened inside an app (SFSafariViewController) says the
//     same as Safari and gets it too.
//   silent_mode: that the sound needs the silent mode off: on any iPhone or iPad,
//     in Safari or from the home screen, as every browser there plays Web Audio in
//     a session that the silent mode mutes, and no page can read the switch.
//   full_screen: whether the prompt's tap also puts the page full screen
//     (enterFullScreen(), which the game calls inside that tap): a phone or tablet
//     (its main pointer a finger) whose browser can, Android's; an iPhone can't, an
//     iPad gets the hint instead, and a desktop, touch screen or not (its main
//     pointer a mouse or trackpad), changes nothing.
// An iPad asks for desktop sites by default and then says Macintosh, but has touch.
(function () {
	const agent = navigator.userAgent;
	const matches = (query) => typeof window.matchMedia === 'function' && window.matchMedia(query).matches;
	const ios = /\b(iPhone|iPod|iPad)\b/.test(agent) || (/\bMacintosh\b/.test(agent) && navigator.maxTouchPoints > 1);
	const homeScreen = navigator.standalone === true || matches('(display-mode: standalone)') || matches('(display-mode: fullscreen)');
	const safari = /\bVersion\/[\d.]+.*\bSafari\//.test(agent)
		&& !/\b(CriOS|FxiOS|EdgiOS|OPiOS|OPT|GSA|DuckDuckGo|Ddg|YaBrowser|FBAN|FBAV|FBIOS|Instagram|Line|Twitter|MicroMessenger|Snapchat|Pinterest|LinkedInApp|musical_ly|BytedanceWebview|KAKAOTALK|NAVER|Whale)\b/.test(agent);
	const topLevel = window.top === window.self;
	const root = document.documentElement;
	const requestFullScreen = root.requestFullscreen || root.webkitRequestFullscreen;
	const isFullScreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
	const fullScreenOffered = !ios && !homeScreen && typeof requestFullScreen === 'function'
		&& Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled) && matches('(pointer: coarse)');
	const dismissedKey = 'grand-treasure-island.home-screen-hint-dismissed';
	let dismissed = false;
	try {
		dismissed = window.localStorage.getItem(dismissedKey) === '1';
	} catch (e) {
		// No storage (a blocked or private page): the hint shows each visit.
	}
	window.__tiStartNotes = {
		read: () => JSON.stringify({
			home_screen: ios && safari && topLevel && !homeScreen && !dismissed,
			silent_mode: ios,
			full_screen: fullScreenOffered && !isFullScreen(),
		}),
		dismissHomeScreen: () => {
			dismissed = true;
			try {
				window.localStorage.setItem(dismissedKey, '1');
			} catch (e) {
				// Dismissed for this visit only.
			}
		},
		enterFullScreen: () => {
			if (!fullScreenOffered || isFullScreen()) return false;
			try {
				const request = requestFullScreen.call(root, {navigationUI: 'hide'});
				if (request && typeof request.catch === 'function') request.catch(() => {});
				return true;
			} catch (e) {
				return false;
			}
		},
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let phase = 'download';
	let downloadComplete = false;
	let downloadShown = false;
	const mark = (name) => performance.mark('TI_BOOT:' + name);
	// The start of the game's loading-step lines (LOADING_STEP_PRINT, game/scripts/main.gd).
	const STEP_PRINT = 'LOADING_STEP ';
	const MB = 1e6;

	function showNotice(text) {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = 'block';
		statusNotice.textContent = text;
	}

	// The loading screen's line: the step under way, put up as it starts. The page
	// names the download and the engine's start; the game names its own steps
	// (LOADING_STEPS, game/scripts/main.gd), printing each before its work starts and
	// then letting a frame end, so the browser paints it in time.
	function showStep(text) {
		showNotice(text);
		mark('step:' + text);
	}

	// While the game downloads (the engine and the game's data): the bytes so far, of
	// the total the exporter wrote down, over the progress bar. The count keeps to one
	// line (no-break spaces), so a narrow phone breaks the line after "game:"; like
	// the game's lines (keep_last_words_together, game/scripts/main.gd), the others
	// keep their last two words together.
	function showDownload(current, total) {
		statusNotice.style.display = 'block';
		statusNotice.textContent = total > 0
			? 'Downloading the game: ' + Math.round(current / MB) + '\u00a0of\u00a0' + Math.round(total / MB) + '\u00a0MB'
			: 'Downloading the\u00a0game…';
		if (!downloadShown) {
			downloadShown = true;
			mark('step:Downloading the game');
		}
	}

	// Godot's boot splash shows while the game downloads; then the game's own
	// treasure chest (the favicon the exporter writes from the project icon).
	function showChest() {
		const icon = document.getElementById('-gd-engine-icon');
		const splash = document.getElementById('status-splash');
		if (icon && icon.href) {
			splash.src = icon.href;
			splash.className = 'chest';
		}
	}

	// The download is complete: the engine starts (its WebAssembly made ready, its
	// setup and its load of the game's main scene, up to the game's first line).
	function preparing() {
		if (phase !== 'download') return;
		if (!downloadComplete) {
			downloadComplete = true;
			mark('download_complete');
		}
		phase = 'preparing';
		showStep('Starting the\u00a0engine…');
		showChest();
		mark('status_changed');
	}

	function displayFailureNotice(err) {
		phase = 'error';
		console.error(err);
		showNotice(err instanceof Error ? err.message : String(err));
		mark('failed');
	}

	const engine = new Engine({
		...GODOT_CONFIG,
		onProgress(current, total) {
			if (phase !== 'download') return;
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				showDownload(current, total);
				if (current >= total) preparing();
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
				showDownload(0, 0);
			}
		},
		onPrint(...args) {
			console.log(...args);
			const line = args.join(' ');
			// The game's loading steps, until play.
			if (line.startsWith(STEP_PRINT) && phase === 'preparing') showStep(line.slice(STEP_PRINT.length));
			// Existing game-owned markers, delivered through the public Engine API.
			if (line === 'WORLD_READY') mark('game_preparing');
			if (line === 'PLAY_READY' && phase !== 'error') {
				phase = 'ready';
				mark('play_ready');
				// The synchronous game callback finishes its Resume/menu setup first.
				requestAnimationFrame(() => {
					if (phase === 'ready') {
						statusOverlay.style.visibility = 'hidden';
						mark('overlay_hidden');
					}
				});
			}
		},
		onPrintError(...args) {
			console.error(...args);
			if (args.join(' ').includes('WORLD_FAILED:')) displayFailureNotice(args.join(' '));
		},
		onExit(code) {
			if (phase !== 'ready') displayFailureNotice('Game stopped before startup completed (' + code + ').');
		},
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'block';
		const pack = GODOT_CONFIG.mainPack || GODOT_CONFIG.executable + '.pck';
		mark('engine_init_begin');
		// Same parallel init/download as startGame, but defer callMain until the
		// DOM status has had a rendering opportunity. Engine.load alone resolves
		// at response headers and is NOT proof of a completed WASM download.
		Promise.all([
			engine.init(GODOT_CONFIG.executable).then(() => mark('engine_init_end')),
			engine.preloadFile(pack, pack).then(() => mark('pack_loaded')),
		]).then(async () => {
			preparing();
			// rAF callbacks precede paint. Yield through a subsequent frame before
			// synchronous game startup; actual screencast frames verify the result.
			// This is a paint opportunity, not a timer or physical-display promise.
			await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
			mark('status_paint_opportunity');
			if (phase === 'error') return;
			mark('game_start_begin');
			await engine.start({args: ['--main-pack', pack, ...(GODOT_CONFIG.args || [])]});
			mark('game_start_resolved');
			// Engine startup is not game readiness: only PLAY_READY hides the DOM.
		}).catch(displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
