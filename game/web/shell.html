<!DOCTYPE html>
<!-- Project-owned shell adapted from Godot 4.7.2 full-size.html; engine runtime unchanged. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #242424;
	border-radius: 0.5rem;
	border: 1px solid #777;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let phase = 'download';
	let downloadComplete = false;
	const mark = (name) => performance.mark('TI_BOOT:' + name);

	function showNotice(text) {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = 'block';
		statusNotice.textContent = text;
	}

	function preparing() {
		if (phase !== 'download') return;
		if (!downloadComplete) {
			downloadComplete = true;
			mark('download_complete');
		}
		phase = 'preparing';
		showNotice('Preparing graphics…');
		mark('status_changed');
	}

	function displayFailureNotice(err) {
		phase = 'error';
		console.error(err);
		showNotice(err instanceof Error ? err.message : String(err));
		mark('failed');
	}

	const engine = new Engine({
		...GODOT_CONFIG,
		onProgress(current, total) {
			if (phase !== 'download') return;
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				if (current >= total) preparing();
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
		onPrint(...args) {
			console.log(...args);
			// Existing game-owned markers, delivered through the public Engine API.
			if (args.join(' ') === 'WORLD_READY') mark('game_preparing');
			if (args.join(' ') === 'PLAY_READY' && phase !== 'error') {
				phase = 'ready';
				mark('play_ready');
				// The synchronous game callback finishes its Resume/menu setup first.
				requestAnimationFrame(() => {
					if (phase === 'ready') {
						statusOverlay.style.visibility = 'hidden';
						mark('overlay_hidden');
					}
				});
			}
		},
		onPrintError(...args) {
			console.error(...args);
			if (args.join(' ').includes('WORLD_FAILED:')) displayFailureNotice(args.join(' '));
		},
		onExit(code) {
			if (phase !== 'ready') displayFailureNotice('Game stopped before startup completed (' + code + ').');
		},
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'block';
		const pack = GODOT_CONFIG.mainPack || GODOT_CONFIG.executable + '.pck';
		mark('engine_init_begin');
		// Same parallel init/download as startGame, but defer callMain until the
		// DOM status has had a rendering opportunity. Engine.load alone resolves
		// at response headers and is NOT proof of a completed WASM download.
		Promise.all([
			engine.init(GODOT_CONFIG.executable).then(() => mark('engine_init_end')),
			engine.preloadFile(pack, pack).then(() => mark('pack_loaded')),
		]).then(async () => {
			preparing();
			// rAF callbacks precede paint. Yield through a subsequent frame before
			// synchronous game startup; actual screencast frames verify the result.
			// This is a paint opportunity, not a timer or physical-display promise.
			await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
			mark('status_paint_opportunity');
			if (phase === 'error') return;
			mark('game_start_begin');
			await engine.start({args: ['--main-pack', pack, ...(GODOT_CONFIG.args || [])]});
			mark('game_start_resolved');
			// Engine startup is not game readiness: only PLAY_READY hides the DOM.
		}).catch(displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
