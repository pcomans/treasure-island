<!DOCTYPE html>
<!-- Project-owned shell adapted from Godot 4.7.2 full-size.html; engine runtime unchanged. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

/* After the download: the game's treasure chest, centred, the notice under it
   where the download's was. */
#status-splash.chest {
	position: static;
	width: 25vmin;
	height: 25vmin;
	object-fit: contain;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

/* The loading line, in one place from the download to play: just above the
   download's progress bar, clear of the boot splash and the chest. A second line
   (after a line break) is a note on the step. */
#status-notice {
	background-color: #242424;
	border-radius: 0.5rem;
	border: 1px solid #777;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	white-space: pre-line;
	z-index: 1;
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(10% + 1.5rem);
	width: max-content;
	max-width: calc(100% - 2rem);
	margin: 0 auto;
	box-sizing: border-box;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
// This device's copy of a build's two large files, the engine's WebAssembly and the
// game's data pack (owner, 2026-11-16: "cache the downloads on the local disk, keyed
// by ... the current build number"). They are kept in the site's private file system
// (OPFS), in a folder named after the build's files (treasure-island-<commit>, which
// names one build), so the next launch of the same build reads them from the device
// instead of downloading them again; storing a build removes every other build's
// folder. The page itself still comes from the network every time (no service
// worker), so a new release or a rollback names other files and takes effect on the
// next load as before.
//
// Not the Cache API: WebKit's Cache.put holds a whole response in the page's memory
// before storing it (DOMCache::put), a second copy of the 160 MB pack on an iPhone
// already near its memory limit; a file's writable stream takes each chunk as it comes.
// Writing needs FileSystemFileHandle.createWritable (Chrome 86, Firefox 111, Safari 26)
// and Web Locks. Without them, in a private window, with storage full, or when
// anything here throws, the files simply come from the network as before.
//
// A stored file counts only when its marker, written after the whole file was written,
// closed and its size checked, names the size the page expects (GODOT_CONFIG.fileSizes)
// and the file has that size; a download that ends early or fails is never marked, and
// a stored file that reads short is downloaded again. Only the tab holding the lock
// writes or removes anything, so two tabs never write one file.
//
//   tiBuildFiles(build, env) -> {wasm(name, size, onFrom), pack(name, size, progress), finish()}
//   env: {storage, locks, canWrite, fetch, mark, warn} (navigator.storage and .locks, ...)
// tools/check_web_build_files.mjs runs this with stand-ins for the browser's.
function tiBuildFiles(build, env) {
	const FOLDER = 'grand-treasure-island-builds';
	const LOCK = 'grand-treasure-island-build-files';
	// Downloads, as the engine's own: 4 attempts, a second apart.
	const ATTEMPTS = 4;
	// Bytes waiting for the disk: the WebAssembly's chunks as it streams through (past
	// QUEUE_LIMIT its download waits, and a disk that makes no room for STALL_MS loses
	// the store, never the download), and the pack's buffer, in views of it, once it is
	// in. What waits goes to the disk in writes of up to WRITE_MAX: the engine's start
	// keeps the page busy for seconds after the download, with time for few writes, and
	// chunks still waiting then are held in memory at its peak.
	const QUEUE_LIMIT = 4 * 1024 * 1024;
	const WRITE_MAX = 8 * 1024 * 1024;
	const STALL_MS = 15000;
	// Each file's latest store (a retried download stores again, after the last one ends).
	const stores = new Map();
	let unlock = () => {};

	// This build's folder, and whether this tab writes: it holds the lock until finish().
	const cache = (async () => {
		if (!env.canWrite || !env.locks || !env.storage || !env.storage.getDirectory) return null;
		const root = await env.storage.getDirectory();
		const top = await root.getDirectoryHandle(FOLDER, {create: true});
		const dir = await top.getDirectoryHandle(build, {create: true});
		const owner = await new Promise((resolve) => {
			env.locks.request(LOCK, {ifAvailable: true}, (lock) => {
				resolve(Boolean(lock));
				return lock ? new Promise((release) => { unlock = release; }) : null;
			}).catch(() => resolve(false));
		});
		return {top, dir, owner};
	})().catch((err) => {
		env.warn('No build cache on this device:', err);
		return null;
	});

	// NAME's stored copy, a File of SIZE bytes, or null.
	async function storedFile(name, size) {
		const c = await cache;
		if (!c) return null;
		try {
			const marker = await (await c.dir.getFileHandle(name + '.complete')).getFile();
			if (await marker.text() !== String(size)) return null;
			const file = await (await c.dir.getFileHandle(name)).getFile();
			return file.size === size ? file : null;
		} catch (err) {
			return null;
		}
	}

	// Stores NAME (SIZE bytes) from its download, or returns null when this tab doesn't
	// write: write(chunk) queues each chunk as it arrives, room() resolves once the disk
	// has caught up, end(complete) closes the file, checks its size and then writes its
	// marker. Anything else removes the file and its marker.
	async function startStore(kind, name, size) {
		const c = await cache;
		if (!c || !c.owner) return null;
		const queue = [];
		let queued = 0;
		let state = 'open';
		let poke = () => {};
		let waiting = [];
		const makeRoom = () => {
			const resolvers = waiting;
			waiting = [];
			for (const resolve of resolvers) resolve();
		};
		const stop = (next) => {
			if (state !== 'open') return;
			state = next;
			if (next === 'failed') {
				queue.length = 0;
				queued = 0;
				makeRoom();
			}
			poke();
		};
		const previous = stores.get(name);
		const written = (async () => {
			if (previous) await previous;
			await c.dir.removeEntry(name + '.complete').catch(() => {});
			const handle = await c.dir.getFileHandle(name, {create: true});
			const writable = await handle.createWritable();
			let bytes = 0;
			try {
				for (;;) {
					if (state === 'failed') throw new Error('the download failed');
					if (queue.length > 0) {
						// The pack's pieces are adjacent views of its buffer, written as one view;
						// other chunks (the WebAssembly's, from the network) are copied into one.
						const parts = [queue.shift()];
						let length = parts[0].byteLength;
						while (queue.length > 0 && length + queue[0].byteLength <= WRITE_MAX) {
							length += queue[0].byteLength;
							parts.push(queue.shift());
						}
						const first = parts[0];
						const adjacent = parts.every((part, i) => i === 0 || (part.buffer === first.buffer
							&& part.byteOffset === parts[i - 1].byteOffset + parts[i - 1].byteLength));
						let chunk = first;
						if (parts.length > 1 && adjacent) {
							chunk = new Uint8Array(first.buffer, first.byteOffset, length);
						} else if (parts.length > 1) {
							chunk = new Uint8Array(length);
							let at = 0;
							for (const part of parts) {
								chunk.set(part, at);
								at += part.byteLength;
							}
						}
						await writable.write(chunk);
						bytes += chunk.byteLength;
						queued -= chunk.byteLength;
						if (queued < QUEUE_LIMIT) makeRoom();
					} else if (state === 'complete') {
						break;
					} else {
						await new Promise((resolve) => { poke = resolve; });
					}
				}
				if (bytes !== size) throw new Error(bytes + ' of ' + size + ' bytes');
				await writable.close();
			} catch (err) {
				await writable.abort().catch(() => {});
				throw err;
			}
			if ((await handle.getFile()).size !== size) throw new Error('the stored file has another size');
			const marker = await (await c.dir.getFileHandle(name + '.complete', {create: true})).createWritable();
			await marker.write(String(size));
			await marker.close();
		})();
		const stored = written.then(() => {
			env.mark('cache:' + kind + ':stored');
			return true;
		}, async (err) => {
			state = 'failed';
			queue.length = 0;
			queued = 0;
			makeRoom();
			await c.dir.removeEntry(name + '.complete').catch(() => {});
			await c.dir.removeEntry(name).catch(() => {});
			env.mark('cache:' + kind + ':not_stored');
			env.warn('Not stored on this device:', name, err);
			return false;
		});
		stores.set(name, stored);
		return {
			write(chunk) {
				if (state !== 'open') return;
				queue.push(chunk);
				queued += chunk.byteLength;
				poke();
			},
			room() {
				if (state !== 'open' || queued < QUEUE_LIMIT) return Promise.resolve();
				return new Promise((resolve) => {
					const timer = setTimeout(() => {
						stop('failed');
						resolve();
					}, STALL_MS);
					waiting.push(() => {
						clearTimeout(timer);
						resolve();
					});
				});
			},
			end(complete) {
				stop(complete ? 'complete' : 'failed');
			},
		};
	}

	// Reads STREAM, which must hold exactly SIZE bytes, into one new ArrayBuffer and
	// returns it, calling onBytes(bytes so far) as it goes. A byte stream (a download or
	// a stored file, in Chrome) is read with a BYOB reader straight into the buffer, so
	// no chunk is made: chunks copied in would be garbage the size of the pack that the
	// page frees only seconds later, through the engine's start. A BYOB read moves the
	// buffer to a new ArrayBuffer object each time; the last one holds the data. Other
	// streams' chunks are copied in.
	async function readInto(stream, size, onBytes) {
		let buffer = new ArrayBuffer(size);
		let offset = 0;
		let byob = null;
		try {
			byob = stream.getReader({mode: 'byob'});
		} catch (err) {
			byob = null;
		}
		const reader = byob || stream.getReader();
		try {
			for (;;) {
				let result;
				if (byob) {
					// Past SIZE, one more byte means the stream holds more than SIZE.
					result = await byob.read(offset < size ? new Uint8Array(buffer, offset, size - offset) : new Uint8Array(1));
					if (offset < size && result.value) buffer = result.value.buffer;
				} else {
					result = await reader.read();
				}
				if (result.done) break;
				const length = result.value.byteLength;
				if (offset + length > size) throw new Error('more than the expected ' + size + ' bytes');
				if (!byob) new Uint8Array(buffer, offset, length).set(result.value);
				offset += length;
				onBytes(offset);
			}
		} catch (err) {
			reader.cancel().catch(() => {});
			throw err;
		}
		if (offset !== size) throw new Error(offset + ' of ' + size + ' bytes');
		return buffer;
	}

	// The engine's WebAssembly, as the response its loader streams it from
	// (globalThis.__tiLoaderFetch, tools/build-web.sh): this device's copy, or the
	// download, stored as it streams through. onFrom('device' or 'network').
	async function wasm(name, size, onFrom) {
		const file = await storedFile(name, size);
		if (file) {
			onFrom('device');
			env.mark('cache:wasm:device');
			return new Response(file, {headers: {'Content-Type': 'application/wasm'}});
		}
		onFrom('network');
		const response = await env.fetch(name);
		if (!response.ok || !response.body) return response;
		const store = await startStore('wasm', name, size);
		if (!store) return response;
		const reader = response.body.getReader();
		let bytes = 0;
		return new Response(new ReadableStream({
			async pull(controller) {
				try {
					const {done, value} = await reader.read();
					if (done) {
						store.end(bytes === size);
						controller.close();
						return;
					}
					bytes += value.byteLength;
					store.write(value);
					controller.enqueue(value);
					await store.room();
				} catch (err) {
					store.end(false);
					controller.error(err);
				}
			},
			cancel(reason) {
				store.end(false);
				return reader.cancel(reason);
			},
		}), {headers: {'Content-Type': 'application/wasm'}});
	}

	// The pack, in one buffer of its size: the only copy the page makes, which the
	// engine's file system then takes as it is (tools/build-web.sh). Read from this
	// device, or downloaded and then stored from that buffer, in views of it (a BYOB
	// read moves the buffer, so the store can't hold views while the download runs).
	// progress(bytes, 'device' or 'network').
	async function pack(name, size, progress) {
		const file = await storedFile(name, size);
		if (file) {
			try {
				progress(0, 'device');
				const buffer = await readInto(file.stream(), size, (bytes) => progress(bytes, 'device'));
				env.mark('cache:pack:device');
				return buffer;
			} catch (err) {
				env.warn('The stored game data did not read; downloading it:', err);
			}
		}
		for (let attempt = 1; ; attempt += 1) {
			try {
				progress(0, 'network');
				const response = await env.fetch(name);
				if (!response.ok || !response.body) throw new Error('HTTP ' + response.status);
				const buffer = await readInto(response.body, size, (bytes) => progress(bytes, 'network'));
				// Written while the engine starts; finish() waits for it.
				const store = await startStore('pack', name, size);
				if (store) {
					for (let at = 0; at < size; at += WRITE_MAX) store.write(new Uint8Array(buffer, at, Math.min(WRITE_MAX, size - at)));
					store.end(true);
				}
				return buffer;
			} catch (err) {
				if (attempt >= ATTEMPTS) throw new Error('Failed loading file \'' + name + '\': ' + (err instanceof Error ? err.message : err));
				await new Promise((resolve) => setTimeout(resolve, 1000));
			}
		}
	}

	// Once the page has both files: waits for this tab's stores and, if each file's last
	// one succeeded, removes every other build's folder; then lets the lock go.
	async function finish() {
		const c = await cache;
		try {
			const results = await Promise.all(stores.values());
			if (c && c.owner && results.every(Boolean)) {
				const others = [];
				for await (const name of c.top.keys()) {
					if (name !== build) others.push(name);
				}
				for (const name of others) await c.top.removeEntry(name, {recursive: true}).catch(() => {});
				if (others.length > 0) env.mark('cache:removed_other_builds');
			}
		} catch (err) {
			env.warn('Build cache clean-up failed:', err);
		} finally {
			unlock();
		}
	}

	return {wasm, pack, finish};
}
		</script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

// Web Audio and the first gesture (owner, 2026-11-15: on an iPhone or iPad no
// sound until the pause menu). A browser lets the engine's AudioContext start
// only in a user gesture, and Safari on iOS only in a tap's touchend (never a
// touchstart, nor the end of a slide), a click or a key; Godot resumes it only
// from its own events on the canvas. The loading screen covers the canvas until
// play is ready, so a tap on it resumed nothing, and play on a touch screen
// started with the stick, whose slides never count. Play now waits for the
// start prompt's tap or click (game/scripts/main.gd), and every such event
// anywhere on the page resumes the engine's audio while it is not running:
// suspended, or iOS's interrupted (after a call, the lock or the background).
// window.__tiAudio tells the game whether its audio runs
// (game/scripts/audio/sound.gd).
(function () {
	const Base = window.AudioContext || window.webkitAudioContext;
	if (!Base) return;
	const contexts = [];
	const audio = window.__tiAudio = {
		// Whether every context still open runs (a closed one counts for nothing).
		running: () => {
			const open = contexts.filter((context) => context.state !== 'closed');
			return open.length > 0 && open.every((context) => context.state === 'running');
		},
		onchange: null,
	};
	class TrackedAudioContext extends Base {
		constructor(...args) {
			super(...args);
			contexts.push(this);
			this.addEventListener('statechange', () => {
				if (typeof audio.onchange === 'function') audio.onchange(this.state);
			});
		}
	}
	window.AudioContext = TrackedAudioContext;
	if (window.webkitAudioContext) window.webkitAudioContext = TrackedAudioContext;
	const resume = () => {
		for (const context of contexts) {
			if (context.state !== 'running' && context.state !== 'closed') context.resume().catch(() => {});
		}
	};
	for (const type of ['touchend', 'pointerup', 'click', 'keydown', 'mousedown']) {
		document.addEventListener(type, resume, {capture: true, passive: true});
	}
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let phase = 'download';
	let downloadComplete = false;
	let loadingShown = '';
	const mark = (name) => performance.mark('TI_BOOT:' + name);
	// The start of the game's loading-step lines (LOADING_STEP_PRINT, game/scripts/main.gd).
	const STEP_PRINT = 'LOADING_STEP ';
	// How long the engine's start waits for this device's copy to be written (below).
	const STORE_WAIT_MS = 3000;
	// The two large files so far: what the engine's own loader fetches (its WebAssembly,
	// and the pack too when the page can't load it itself) and the pack. from: 'device'
	// (this build's stored copy, tiBuildFiles), 'network', or null until known.
	const loading = {
		engine: {loaded: 0, total: 0, from: null},
		pack: {loaded: 0, total: 0, from: null},
	};

	function showNotice(text) {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = 'block';
		statusNotice.textContent = text;
	}

	// The loading screen's line: the step under way, put up as it starts. The page
	// names the download and the engine's start; the game names its own steps
	// (LOADING_STEPS, game/scripts/main.gd), printing each before its work starts and
	// then letting a frame end, so the browser paints it in time.
	function showStep(text) {
		showNotice(text);
		mark('step:' + text);
	}

	// While the engine and the game's data come in: "Downloading the game" while any of
	// it comes over the network, "Loading the game from this device" when all of it is
	// this build's stored copy (tiBuildFiles), with how far along it is in percent of
	// the files' size, over the progress bar. No megabytes: the server compresses the
	// files, so less than their size travels, and how much less isn't known until the
	// download ends. Like the game's lines (keep_last_words_together,
	// game/scripts/main.gd), the last two words keep together.
	function showLoading() {
		if (phase !== 'download') return;
		const parts = Object.values(loading).filter(Boolean);
		if (parts.some((part) => part.from === null)) return;
		const known = parts.every((part) => part.total > 0);
		const total = parts.reduce((sum, part) => sum + part.total, 0);
		const loaded = parts.reduce((sum, part) => sum + Math.min(part.loaded, part.total), 0);
		const step = parts.some((part) => part.from === 'network') ? 'Downloading the game' : 'Loading the game from this device';
		const text = step.replace(/ (\S+)$/, '\u00a0$1');
		statusNotice.style.display = 'block';
		if (known) {
			statusProgress.value = loaded;
			statusProgress.max = total;
			statusNotice.textContent = text + ': ' + Math.floor((100 * loaded) / total) + '%';
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
			statusNotice.textContent = text + '…';
		}
		if (loadingShown !== step) {
			loadingShown = step;
			mark('step:' + step);
		}
		if (known && loaded >= total) preparing();
	}

	// Godot's boot splash shows while the game downloads; then the game's own
	// treasure chest (the favicon the exporter writes from the project icon).
	function showChest() {
		const icon = document.getElementById('-gd-engine-icon');
		const splash = document.getElementById('status-splash');
		if (icon && icon.href) {
			splash.src = icon.href;
			splash.className = 'chest';
		}
	}

	// The download is complete: the engine starts (its WebAssembly made ready, its
	// setup and its load of the game's main scene, up to the game's first line).
	function preparing() {
		if (phase !== 'download') return;
		if (!downloadComplete) {
			downloadComplete = true;
			mark('download_complete');
		}
		phase = 'preparing';
		showStep('Starting the\u00a0engine…');
		showChest();
		mark('status_changed');
	}

	function displayFailureNotice(err) {
		phase = 'error';
		console.error(err);
		showNotice(err instanceof Error ? err.message : String(err));
		mark('failed');
	}

	const engine = new Engine({
		...GODOT_CONFIG,
		// What the engine's own loader fetches: its WebAssembly, through the page's build
		// cache (globalThis.__tiLoaderFetch below), and the pack when the page can't load
		// the pack itself.
		onProgress(current, total) {
			loading.engine.loaded = current;
			loading.engine.total = total;
			showLoading();
		},
		onPrint(...args) {
			console.log(...args);
			const line = args.join(' ');
			// The game's loading steps, until play.
			if (line.startsWith(STEP_PRINT) && phase === 'preparing') showStep(line.slice(STEP_PRINT.length));
			// Existing game-owned markers, delivered through the public Engine API.
			if (line === 'WORLD_READY') mark('game_preparing');
			if (line === 'PLAY_READY' && phase !== 'error') {
				phase = 'ready';
				mark('play_ready');
				// The synchronous game callback finishes its Resume/menu setup first.
				requestAnimationFrame(() => {
					if (phase === 'ready') {
						statusOverlay.style.visibility = 'hidden';
						mark('overlay_hidden');
					}
				});
			}
		},
		onPrintError(...args) {
			console.error(...args);
			if (args.join(' ').includes('WORLD_FAILED:')) displayFailureNotice(args.join(' '));
		},
		onExit(code) {
			if (phase !== 'ready') displayFailureNotice('Game stopped before startup completed (' + code + ').');
		},
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'block';
		const executable = GODOT_CONFIG.executable;
		const pack = GODOT_CONFIG.mainPack || executable + '.pck';
		const wasm = executable + '.wasm';
		// The sizes the exporter wrote down; a stored copy must have its file's size.
		const sizeOf = (file) => {
			const size = (GODOT_CONFIG.fileSizes || {})[file];
			return Number.isSafeInteger(size) && size > 0 ? size : 0;
		};
		mark('engine_init_begin');
		// This build's two large files, from this device or the network (tiBuildFiles).
		const files = tiBuildFiles(executable, {
			storage: navigator.storage,
			locks: navigator.locks,
			canWrite: typeof FileSystemFileHandle === 'function' && 'createWritable' in FileSystemFileHandle.prototype,
			fetch: (file) => fetch(file),
			mark,
			warn: (...args) => console.warn(...args),
		});
		// The engine's loader asks this for its WebAssembly (tools/build-web.sh).
		if (sizeOf(wasm) > 0) {
			globalThis.__tiLoaderFetch = (file) => (file !== wasm ? fetch(file) : files.wasm(wasm, sizeOf(wasm), (from) => {
				loading.engine.from = from;
				showLoading();
			}));
		} else {
			loading.engine.from = 'network';
		}
		// The page loads the pack itself, into the one buffer the engine's file system
		// then keeps; without its size, the engine's loader downloads it as before.
		let packLoaded;
		if (sizeOf(pack) > 0) {
			packLoaded = files.pack(pack, sizeOf(pack), (bytes, from) => {
				loading.pack.loaded = bytes;
				loading.pack.total = sizeOf(pack);
				loading.pack.from = from;
				showLoading();
			}).then((buffer) => engine.preloadFile(buffer, pack));
		} else {
			loading.pack = null;
			packLoaded = engine.preloadFile(pack, pack);
		}
		// Same parallel init/download as startGame, but defer callMain until the
		// DOM status has had a rendering opportunity. Engine.load alone resolves
		// at response headers and is NOT proof of a completed WASM download.
		Promise.all([
			engine.init(executable).then(() => mark('engine_init_end')),
			packLoaded.then(() => mark('pack_loaded')),
		]).then(async () => {
			preparing();
			// What came over the network goes on to this device's copy before the engine
			// starts: its start keeps the page too busy to write until play, and a tab
			// closed (or a phone out of memory) during the load would lose the copy. A
			// slow disk gets STORE_WAIT_MS, then finishes during the start.
			await Promise.race([files.finish(), new Promise((resolve) => setTimeout(resolve, STORE_WAIT_MS))]);
			// rAF callbacks precede paint. Yield through a subsequent frame before
			// synchronous game startup; actual screencast frames verify the result.
			// This is a paint opportunity, not a timer or physical-display promise.
			await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
			mark('status_paint_opportunity');
			if (phase === 'error') return;
			mark('game_start_begin');
			await engine.start({args: ['--main-pack', pack, ...(GODOT_CONFIG.args || [])]});
			mark('game_start_resolved');
			// Engine startup is not game readiness: only PLAY_READY hides the DOM.
		}).catch((err) => {
			files.finish();
			displayFailureNotice(err);
		});
	}
}());
		</script>
	</body>
</html>
