<!DOCTYPE html>
<!-- Project-owned shell adapted from Godot 4.7.2 full-size.html; engine runtime unchanged. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- The home screen (owner, 2026-11-16): Add to Home Screen opens the game on
		     its own, full screen. tools/build-web.sh writes the manifest and its icons
		     beside the page, named after the commit like the game's files, and puts the
		     manifest's name in this link (an export without that script links none
		     that exists). The exporter's head include, below the styles, adds the
		     favicon and the iPhone's 180 x 180 apple-touch-icon. On an iPhone the
		     status bar lies over the page (black-translucent), whose layout keeps to
		     the safe area (env(safe-area-inset-*), --safe-* below). -->
		<link rel="manifest" href="$TI_WEB_MANIFEST">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Treasure Island">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

/* After the download: the game's treasure chest, centred, the notice under it
   where the download's was. */
#status-splash.chest {
	position: static;
	width: 25vmin;
	height: 25vmin;
	object-fit: contain;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: calc(10% + var(--safe-bottom));
	width: 50%;
	margin: 0 auto;
}

/* The loading line, in one place from the download to play: just above the
   download's progress bar, clear of the boot splash and the chest, and like the
   bar inside the safe area (a phone's home indicator and notch). A second line
   (after a line break) is a note on the step. */
#status-notice {
	background-color: #242424;
	border-radius: 0.5rem;
	border: 1px solid #777;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	white-space: pre-line;
	z-index: 1;
	position: absolute;
	left: var(--safe-left);
	right: var(--safe-right);
	bottom: calc(10% + 1.5rem + var(--safe-bottom));
	width: max-content;
	max-width: calc(100% - 2rem - var(--safe-left) - var(--safe-right));
	margin: 0 auto;
	box-sizing: border-box;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<!-- The crash and performance reports' settings (tiReporting below), which
		     tools/build-web.sh writes here from tools/config/crash-reports.json: the DSN,
		     the release, the SDK file beside the page with its integrity hash and the
		     share of loads traced. An export without that script keeps {}: no DSN, so the
		     page loads no SDK and sends nothing. -->
		<script type="application/json" id="ti-reporting">{}</script>

		<script src="$GODOT_URL"></script>
		<script>
// This device's copy of a build's game data pack (owner, 2026-11-16: "cache the
// downloads on the local disk, keyed by ... the current build number"). It is kept in
// the site's private file system (OPFS), in a folder named after the build's files
// (treasure-island-<commit>, which names one build), so the next launch of the same
// build reads it from the device instead of downloading about 134 MB again; storing a
// build removes every other build's folder. The page itself still comes from the
// network every time (no service worker), so a new release or a rollback names other
// files and takes effect on the next load as before. The engine's WebAssembly (about
// 9.5 MB compressed) is left to the browser's HTTP cache, which keeps a file that size.
//
// Not the Cache API: WebKit's Cache.put holds a whole response in the page's memory
// before storing it (DOMCache::put), a second copy of the 160 MB pack on an iPhone
// already near its memory limit; a file's writable stream takes each piece as it comes.
// Storing needs FileSystemFileHandle.createWritable (Chrome 86, Firefox 111, Safari 26)
// and Web Locks, and is off on an iPhone or iPad for now (tiStoreOnThisDevice). Without
// them, in a private window, with storage full, or when a storage call fails or doesn't
// answer within SETUP_MS, the pack comes from the network as before.
//
// The pack goes into one buffer of its size, the only copy the page makes: the
// engine's file system keeps that buffer (tools/build-web.sh), a failed or cut download
// and a stored copy that reads short are read again into it, and the store writes
// views of it. A byte stream (Chrome's downloads and stored files) is read with a BYOB
// reader through one small reused buffer, so no chunk is made: chunks copied in would
// be garbage the size of the pack that the page frees only seconds later, through the
// engine's start.
//
// A stored pack counts only when its marker, written after the whole file was written,
// closed and its size checked, names the size the page expects (GODOT_CONFIG.fileSizes)
// and the file has that size; a download that ends early, fails or holds more is never
// marked. Only the tab holding the lock writes or removes anything, so two tabs never
// write one file. While this tab stores the pack it downloads it without a second copy
// in the browser's HTTP cache, unless that cache already has one.
//
//   tiBuildFiles(build, env) -> {pack(name, size, progress), saving(), saved(), finish()}
//     env: {store, storage, locks, canWrite, fetch, mark, warn} (whether to keep a copy
//     on this device at all, navigator.storage and .locks, whether
//     FileSystemFileHandle.createWritable exists, ...)
//   tiLoadingLine(loading) -> the loading screen's line while the files come in
//   tiAfterDownload(files, onStep) -> its step once they are in
//   tiStoreOnThisDevice(search, appleTouch), tiAppleTouchDevice(agent, maxTouchPoints)
// tools/check_web_build_files.mjs runs these with stand-ins for the browser's.
function tiBuildFiles(build, env) {
	const FOLDER = 'grand-treasure-island-builds';
	const LOCK = 'grand-treasure-island-build-files';
	// Downloads, as the engine's own: 4 attempts, a second apart.
	const ATTEMPTS = 4;
	// A storage call that hasn't answered in this long counts as no storage, so the
	// load never waits on one.
	const SETUP_MS = 2000;
	// A stored copy's read fails once no piece has come for this long of the time the
	// page was free to take one (env.stallMs, for tests, shortens it).
	const STALL_MS = env.stallMs || 10000;
	// The BYOB reader's buffer, and the store's largest write.
	const SCRATCH = 1024 * 1024;
	const WRITE_MAX = 8 * 1024 * 1024;
	let store = null;
	let fromDevice = false;
	let setupOver = false;
	let unlock = () => {};
	const within = (promise, fallback) => Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(fallback), SETUP_MS))]);

	// This build's folder, and whether this tab writes: it holds the lock until finish().
	const cache = within((async () => {
		if (!env.store || !env.canWrite || !env.locks || !env.storage || !env.storage.getDirectory) return null;
		const root = await env.storage.getDirectory();
		const top = await root.getDirectoryHandle(FOLDER, {create: true});
		const dir = await top.getDirectoryHandle(build, {create: true});
		const owner = await new Promise((resolve) => {
			env.locks.request(LOCK, {ifAvailable: true}, (lock) => {
				// A lock granted after SETUP_MS goes straight back.
				resolve(Boolean(lock) && !setupOver);
				return lock && !setupOver ? new Promise((release) => { unlock = release; }) : null;
			}).catch(() => resolve(false));
		});
		return {top, dir, owner};
	})().catch((err) => {
		env.warn('No build cache on this device:', err);
		return null;
	}), null).then((c) => {
		setupOver = true;
		if (!c) env.mark(env.store ? 'cache:none' : 'cache:off');
		return c;
	});

	// The stored pack NAME, a File of SIZE bytes, or null.
	function storedFile(name, size) {
		return within((async () => {
			const c = await cache;
			if (!c) return null;
			try {
				const marker = await (await c.dir.getFileHandle(name + '.complete')).getFile();
				if (await marker.text() !== String(size)) return null;
				const file = await (await c.dir.getFileHandle(name)).getFile();
				return file.size === size ? file : null;
			} catch (err) {
				return null;
			}
		})(), null);
	}

	// Starts this tab's store of NAME (SIZE bytes), after the one before it ends, or
	// returns null when this tab doesn't write: write(view) queues each piece of the
	// pack's buffer as it arrives, and end(complete) closes the file, checks its size
	// and only then writes its marker. Anything else removes the file and its marker.
	// Its entry says when the writing is over (over, writing: as soon as it succeeds or
	// fails, before any clean-up) and when the store is done (done: true when stored).
	async function startStore(name, size) {
		const c = await cache;
		if (!c || !c.owner) return null;
		const previous = store;
		const queue = [];
		let state = 'open';
		let poke = () => {};
		const stop = (next) => {
			if (state !== 'open') return;
			state = next;
			if (next === 'failed') queue.length = 0;
			poke();
		};
		const entry = {writing: true};
		let ended = () => {};
		entry.over = new Promise((resolve) => {
			ended = () => {
				entry.writing = false;
				resolve();
			};
		});
		const written = (async () => {
			if (previous) await previous.done;
			await c.dir.removeEntry(name + '.complete').catch(() => {});
			const handle = await c.dir.getFileHandle(name, {create: true});
			const writable = await handle.createWritable();
			let bytes = 0;
			try {
				for (;;) {
					if (state === 'failed') throw new Error('the download failed');
					if (queue.length > 0) {
						// Adjacent pieces go to the disk together, up to WRITE_MAX: the engine's
						// start keeps the page busy for seconds, with time for few writes.
						let view = queue.shift();
						while (queue.length > 0 && queue[0].buffer === view.buffer
							&& queue[0].byteOffset === view.byteOffset + view.byteLength
							&& view.byteLength + queue[0].byteLength <= WRITE_MAX) {
							view = new Uint8Array(view.buffer, view.byteOffset, view.byteLength + queue.shift().byteLength);
						}
						await writable.write(view);
						bytes += view.byteLength;
					} else if (state === 'complete') {
						break;
					} else {
						await new Promise((resolve) => { poke = resolve; });
					}
				}
				if (bytes !== size) throw new Error(bytes + ' of ' + size + ' bytes');
				await writable.close();
			} catch (err) {
				ended();
				await writable.abort().catch(() => {});
				throw err;
			}
			if ((await handle.getFile()).size !== size) throw new Error('the stored file has another size');
			const marker = await (await c.dir.getFileHandle(name + '.complete', {create: true})).createWritable();
			await marker.write(String(size));
			await marker.close();
		})();
		entry.done = written.then(() => {
			ended();
			env.mark('cache:pack:stored');
			return true;
		}, async (err) => {
			ended();
			state = 'failed';
			queue.length = 0;
			await c.dir.removeEntry(name + '.complete').catch(() => {});
			await c.dir.removeEntry(name).catch(() => {});
			env.mark('cache:pack:not_stored');
			env.warn('The game was not stored on this device:', name, err);
			return false;
		});
		store = entry;
		return {
			write(view) {
				if (state !== 'open') return;
				queue.push(view);
				poke();
			},
			end(complete) {
				stop(complete ? 'complete' : 'failed');
			},
		};
	}

	// Reads STREAM, which must hold exactly BUFFER's length, into BUFFER, calling
	// onBytes(bytes so far, the piece's length) after each piece. A byte stream is read
	// with a BYOB reader through one small buffer that each read hands back; other
	// streams' chunks are copied in. With STALL, a read fails once no piece has come for
	// STALL ms of the time the page was free to take one: a watchdog ticks every tenth of
	// it, and a tick that comes late (the page was busy, as during the engine's setup on a
	// slow phone) counts only its own tenth and can't fail the read, so a busy page never
	// gives up on data that is on its way; only an on-time tick, after a whole tick of
	// free time with no piece, does.
	async function readInto(stream, buffer, onBytes, stall) {
		let byob = null;
		try {
			byob = stream.getReader({mode: 'byob'});
		} catch (err) {
			byob = null;
		}
		const reader = byob || stream.getReader();
		let scratch = byob ? new ArrayBuffer(SCRATCH) : null;
		let offset = 0;
		let pieces = 0;
		let fail = null;
		const stalled = new Promise((resolve, reject) => { fail = reject; });
		stalled.catch(() => {});
		let watchdog = null;
		if (stall) {
			const tick = stall / 10;
			let quiet = 0;
			let seen = 0;
			let last = Date.now();
			watchdog = setInterval(() => {
				const now = Date.now();
				const late = now - last > 2 * tick;
				last = now;
				if (pieces !== seen) {
					seen = pieces;
					quiet = 0;
					return;
				}
				quiet += tick;
				if (!late && quiet >= stall) fail(new Error('no data for ' + stall + ' ms'));
			}, tick);
		}
		try {
			for (;;) {
				const read = byob ? byob.read(new Uint8Array(scratch)) : reader.read();
				const {done, value} = await (watchdog ? Promise.race([read, stalled]) : read);
				pieces += 1;
				if (byob && value) scratch = value.buffer;
				if (done) break;
				if (offset + value.byteLength > buffer.byteLength) throw new Error('more than the expected ' + buffer.byteLength + ' bytes');
				buffer.set(value, offset);
				offset += value.byteLength;
				onBytes(offset, value.byteLength);
			}
		} catch (err) {
			reader.cancel().catch(() => {});
			throw err;
		} finally {
			clearInterval(watchdog);
		}
		if (offset !== buffer.byteLength) throw new Error(offset + ' of ' + buffer.byteLength + ' bytes');
	}

	// The download. While this tab stores the pack: the browser's HTTP cache copy when
	// it has one ('only-if-cached' should never go to the network), else the network
	// without a second copy in that cache ('no-store'); if the store then fails, the
	// next launch downloads again where the HTTP cache might have kept the pack. WebKit
	// answers 'only-if-cached' with the whole download from the network: that answer is
	// the download, read and stored as one. Otherwise a plain fetch, as before.
	async function download(name, storing, attempt) {
		if (!storing) return env.fetch(name);
		if (attempt === 1) {
			try {
				const cached = await env.fetch(name, {cache: 'only-if-cached', mode: 'same-origin'});
				if (cached.ok && cached.body) return cached;
			} catch (err) {
				// Not in the HTTP cache.
			}
		}
		return env.fetch(name, {cache: 'no-store'});
	}

	// The pack, in one buffer of its size (above): from this device's copy, or
	// downloaded and stored as it comes. progress(bytes, 'device' or 'network').
	async function pack(name, size, progress) {
		const buffer = new Uint8Array(size);
		const file = await storedFile(name, size);
		if (file) {
			try {
				progress(0, 'device');
				await readInto(file.stream(), buffer, (bytes) => progress(bytes, 'device'), STALL_MS);
				fromDevice = true;
				env.mark('cache:pack:device');
				return buffer.buffer;
			} catch (err) {
				env.warn('The stored game did not read; downloading it:', err);
			}
		}
		const c = await cache;
		const storing = Boolean(c && c.owner);
		for (let attempt = 1; ; attempt += 1) {
			let writer = null;
			try {
				progress(0, 'network');
				const response = await download(name, storing, attempt);
				if (!response.ok || !response.body) throw new Error('HTTP ' + response.status);
				writer = storing ? await startStore(name, size) : null;
				await readInto(response.body, buffer, (bytes, length) => {
					progress(bytes, 'network');
					if (writer) writer.write(buffer.subarray(bytes - length, bytes));
				});
				if (writer) writer.end(true);
				return buffer.buffer;
			} catch (err) {
				if (writer) writer.end(false);
				if (attempt >= ATTEMPTS) throw new Error('Failed loading file \'' + name + '\': ' + (err instanceof Error ? err.message : err));
				await new Promise((resolve) => setTimeout(resolve, 1000));
			}
		}
	}

	// Whether this tab is still writing this device's copy, and when that is over
	// (written, or failed: the line moves on before any clean-up).
	const saving = () => Boolean(store && store.writing);
	const saved = () => (store ? store.over : Promise.resolve());

	// Once the page has the pack: waits for this tab's store and, when this build's pack
	// is stored (that store succeeded, or it came from the device), removes every other
	// build's folder; then lets the lock go.
	async function finish() {
		const c = await cache;
		try {
			const stored = store ? await store.done : fromDevice;
			if (c && c.owner && stored) {
				const others = [];
				for await (const name of c.top.keys()) {
					if (name !== build) others.push(name);
				}
				for (const name of others) await c.top.removeEntry(name, {recursive: true}).catch(() => {});
				if (others.length > 0) env.mark('cache:removed_other_builds');
			}
		} catch (err) {
			env.warn('Build cache clean-up failed:', err);
		} finally {
			unlock();
		}
	}

	return {pack, saving, saved, finish};
}

// The loading screen's step once every byte is in: onStep('saving') while this tab
// still writes this device's copy of the pack, then onStep('starting') as soon as the
// copy is written, though the engine may still be getting ready; else
// onStep('starting') at once.
function tiAfterDownload(files, onStep) {
	if (!files || !files.saving()) {
		onStep('starting');
		return;
	}
	onStep('saving');
	files.saved().then(() => onStep('starting'));
}

// Whether this page keeps a copy of the pack on the device: everywhere it can, but not
// on an iPhone or iPad until that is measured on one. In WebKit on Linux, storing as the
// download came in raised the browser's network process from about 250 to about
// 700 MiB for a second or two, and iOS limits that process on its own (KNOWN_ISSUES).
// ?store=1 or ?store=0 in the page's address turns it on or off, on any browser, for a
// test on a device.
const STORE_ON_IPHONE_AND_IPAD = false;
function tiStoreOnThisDevice(search, appleTouch) {
	const forced = new URLSearchParams(search).get('store');
	if (forced === '1') return true;
	if (forced === '0') return false;
	return STORE_ON_IPHONE_AND_IPAD || !appleTouch;
}

// An iPhone, iPod or iPad: an iPad asks for desktop sites by default and then says
// Macintosh, but has touch. The start prompt's iPhone and iPad notes use it too.
function tiAppleTouchDevice(agent, maxTouchPoints) {
	return /\b(iPhone|iPod|iPad)\b/.test(agent) || (/\bMacintosh\b/.test(agent) && maxTouchPoints > 1);
}

// The loading screen's line while the engine and the game's data come in, from
// loading = {started, engine: {loaded, total}, pack: {loaded, total, from} or null}:
// started once either reports, the engine's own downloads (its WebAssembly, and the
// pack too when the page can't load it itself, pack null), and the page's pack, from
// 'device', 'network' or null while not yet known. "Loading the game from this device"
// when the pack comes from this device's copy, "Downloading the game" when it comes
// over the network (or through the engine's loader), and "Loading the game" while that
// isn't known yet: the line never stays blank once anything reports, and never says
// it downloads what comes from the device. With how far along it is in percent of the
// files' size once the source and every size are known. No megabytes: the server
// compresses the files, so less than their size travels, and how much less isn't known
// until the download ends. Null before anything reports.
function tiLoadingLine(loading) {
	if (!loading.started) return null;
	const parts = [loading.engine, loading.pack].filter(Boolean);
	const from = loading.pack ? loading.pack.from : 'network';
	const step = from === 'device' ? 'Loading the game from this device' : from === 'network' ? 'Downloading the game' : 'Loading the game';
	// Like the game's lines (keep_last_words_together, game/scripts/main.gd), the last
	// two words keep together.
	const words = step.replace(/ (\S+)$/, '\u00a0$1');
	const known = from !== null && parts.every((part) => part.total > 0);
	const total = parts.reduce((sum, part) => sum + part.total, 0);
	const loaded = parts.reduce((sum, part) => sum + Math.min(part.loaded, part.total), 0);
	return {
		step, known, loaded, total,
		done: known && loaded >= total,
		text: known ? words + ': ' + Math.floor((100 * loaded) / total) + '%' : words + '…',
	};
}

// The anonymous statistics (owner, 2026-11-17: "Ask once on first launch"; what the owner
// wants to learn: how many people play, on what systems, when it crashes, how it performs,
// where on the island they spend their time and how long they play). The game asks once,
// on the start prompt (GameStats.CONSENT_QUESTION, "Yes, send" or "No thanks"), and until
// the player says yes nothing is loaded for them, nothing is kept in this browser for them
// and nothing is sent. The answer is kept here (CONSENT: 'yes' or 'no'; nothing kept is
// not asked yet, never yes) and in the game's settings, which mirror each other since the
// page can't read the engine's settings before the engine starts; 'no' on either side wins
// (game/scripts/reports/crash_reports.gd). Sentry's browser SDK sends them: a pinned
// bundle that tools/build-web.sh puts beside the page (game/web/vendor/sentry), loaded
// only once the start prompt is reached (or the load failed), and only while all of these
// hold:
//   - the build names a DSN (tools/config/crash-reports.json). Without one the page loads
//     no SDK and sends nothing, and after a yes keeps its records all the same;
//   - this browser's storage works (localStorage, which the answer needs; without it the
//     game asks nothing);
//   - the answer kept here is yes, read again before anything is kept or sent, so a no
//     given in another tab stops this one too.
// An error made after the yes waits in this page until the SDK is up, never more than
// MAX_EVENTS of them; one made before the yes is dropped at once. A no (the question's "No
// thanks", Options' switch turned off, or the third visit started without an answer)
// stops everything at once: the SDK closed, the transport refusing, and every key of ours
// but the answer deleted (the anonymous id, the visits' records, the reports waiting). A
// later yes starts afresh, with a new anonymous id.
//
// What is sent after a yes (each message scrubbed by tiScrubEvent and tiScrubEnvelope):
//   - errors: an error or unhandled rejection in the page (the engine's own aborts are
//     these; Godot's printed errors are not sent), a lost WebGL context, a failed load
//     (the file and its HTTP status), the engine exiting with an error, and the end of an
//     earlier visit that stopped unexpectedly in front (below): at most MAX_EVENTS per page
//     load, each error once;
//   - a session start per page load from the yes on (Sentry's release health, not billed);
//   - transactions (performance data, not errors, on Sentry's span quota), all sampled at
//     the build's traces_sample_rate: on a visit that began with the yes given earlier, the
//     load ("game load", once, when play starts: the page load and each loading step as
//     spans, with the funnel's times); on the visit the player says yes nothing from before
//     the answer, so in its place "game start" once play starts after it (that step's time
//     alone); the timed stats ("game stats", from GameStats: one after a minute of play,
//     then one every five minutes, at most MAX_STATS); and the earlier visits that ended
//     before play started ("game visit", how far each got, at most MAX_VISITS).
// Every message carries the build (its release), the device class, the browser's and the
// OS's names with their major versions, the game's snapshot (GameStats.snapshot: map cell,
// movement, bands of height, speed and frame rate, graphics settings, coarse GPU, screen
// class, input) where the game has sent one, and the anonymous id as its user id
// (GameStats' rule, owner 2026-11-17: ANONYMOUS_ID_BYTES random bytes, made the first time
// a message is sent and kept in this browser's storage for the site until the answer
// becomes no or the site's data is cleared; nothing about the device or the player goes
// into it), so Sentry counts players and returning players. Nothing per frame or per
// input, no breadcrumbs, logs or replays, no headers added to any request; no address (a
// URL becomes its file's name), no user name in a local path, no request, cookies, IP
// address or user agent.
//
// The funnel (GameStats.FUNNEL_STEPS): from the yes on, this page load's record keeps when
// it reached each step (ms from the navigation's start): all of them on a visit that began
// with the yes, the steps after it on the visit the player says yes. A visit that ends
// before play starts sends nothing then; if this browser comes back and plays, that later
// visit sends one "game visit" for it. A first visit that ends before the answer is never
// counted.
//
// The end of a visit: from the yes on, this page load keeps a record (SESSION + its id) of
// its build, phase ('loading' until play-ready, then 'play'), steps, the game's last
// snapshot, whether it is visible and focused, and when it started and was last seen:
// written at the yes (or as the page loads, after an earlier yes), every HEARTBEAT_MS while
// visible, on every change of visibility or focus and at each step, and marked clean on
// pagehide (unmarked on a pageshow from the back/forward cache). A record left unclean
// ended without pagehide: a crash, an out-of-memory kill, the browser or the device
// stopping it. A page killed for memory runs no script at all (WebKit: "If WebContent
// process dies (e.g. due to jetsam / crash) or MobileSafari itself is killed, then the fact
// pagehide event not firing is by design", https://bugs.webkit.org/show_bug.cgi?id=199854),
// so this is how one is seen. A tab that still runs holds a Web Lock named after its
// record, so another tab's live record is never taken for a dead one. The next load
// reports one such end, the newest, if that page was last seen in front (visible and
// focused); one last seen hidden or unfocused was in the background, where browsers evict
// pages routinely (iOS above all), and is not reported. The reports wait in storage
// (UNCLEAN, VISITS) until they can be sent.
//
//   tiReporting(config, env) -> {start(), seen(), ended(), resumed(), phase(name),
//       step(name, ms), error(value, kind), contextLost(), loadFailed(text),
//       engineExit(code), read(), setConsent(answer), playStarted(), snapshot(json),
//       stats(json), linkAreas(json), linkAt(x, y), status()}
//     config: the build's settings (the ti-reporting block): {dsn, release, sdk,
//       integrity, traces_sample_rate}, or {}.
//     env: {storage (localStorage, or null), locks (navigator.locks, or null), now() (ms
//       since 1970), sinceStart() (ms since the navigation's start), randomBytes(n), id() (a
//       random id for this page load's record, never sent),
//       visible(), focused(), tags ({device, os, browser}: tiDeviceTags), store (whether
//       this device keeps the pack), environment ('production' or 'local': tiEnvironment),
//       timeOrigin, marks() (the page's TI_BOOT marks, {name: ms}), page() ({ttfb, fcp} in
//       ms, or nulls), wasmBytes() (the engine's memory), loadSdk(src, integrity) -> a
//       promise of the SDK, every(ms, fn) (a repeating timer)}
//   tiDeviceTags(agent, maxTouchPoints), tiEnvironment(hostname), tiLoadSpans(marks,
//   playStarted), tiScrubText(text), tiScrubEvent(event), tiScrubEnvelope(envelope, allow)
// tools/check_web_reporting.mjs runs these with stand-ins for the browser's and the SDK's,
// and checks that the names below match GameStats'.
function tiReporting(config, env) {
	const PREFIX = 'grand-treasure-island.';
	const CONSENT = PREFIX + 'crash-reports';
	const ANONYMOUS_ID = PREFIX + 'anonymous-id';
	const SESSION = PREFIX + 'session.';
	const UNCLEAN = PREFIX + 'unclean';
	const VISITS = PREFIX + 'visits';
	// GameStats' names (game/scripts/reports/game_stats.gd): the funnel's steps, the
	// snapshot's fields (the last three numbers, the rest bands and names) and the
	// anonymous id's size.
	const FUNNEL_STEPS = ['page_opened', 'download_finished', 'start_prompt', 'play_started', 'playing_1min'];
	const SNAPSHOT_FIELDS = ['area', 'movement', 'height_m', 'speed_m_s', 'fps', 'session_min', 'resolution', 'shadows', 'frame_rate_limit', 'gpu', 'screen', 'input', 'video_mb', 'texture_mb', 'buffer_mb'];
	const SNAPSHOT_NUMBERS = ['video_mb', 'texture_mb', 'buffer_mb', 'wasm_mb'];
	const MOVEMENTS = ['on_foot', 'jetpack', 'in_car'];
	const ANONYMOUS_ID_BYTES = 16;
	const MAX_EVENTS = 5;
	const MAX_STATS = 48;
	const MAX_VISITS = 3;
	const HEARTBEAT_MS = 10000;
	// Without Web Locks to ask, an unclean record seen this recently may be another tab's.
	const LIVE_MS = 60000;
	// Seconds into the visit, and from its last sign of life to the next load: as tags.
	const LENGTHS = [[30, '<30s'], [120, '30s-2m'], [300, '2m-5m'], [900, '5m-15m'], [3600, '15m-1h'], [Infinity, '>1h']];
	const GAPS = [[30, '<30s'], [300, '30s-5m'], [3600, '5m-1h'], [86400, '1h-1d'], [Infinity, '>1d']];
	const bucket = (seconds, edges) => edges.find(([edge]) => seconds < edge)[1];
	const finite = (value) => (typeof value === 'number' && Number.isFinite(value) ? value : null);
	const release = String(config.release || '');
	const build = (release.match(/@(\d+)\+/) || [])[1] || 'unknown';
	const dsn = typeof config.dsn === 'string' ? config.dsn : '';
	const tracesRate = finite(config.traces_sample_rate) !== null && config.traces_sample_rate >= 0 && config.traces_sample_rate <= 1 ? config.traces_sample_rate : 0;

	// localStorage, each call guarded: storage that throws (blocked site data) or is missing
	// reads as nothing, and then nothing is asked, kept or sent. Whether it works is read,
	// not written: nothing is written before a yes.
	const get = (key) => { try { return env.storage.getItem(key); } catch (err) { return null; } };
	const put = (key, value) => { try { env.storage.setItem(key, value); return true; } catch (err) { return false; } };
	const drop = (key) => { try { env.storage.removeItem(key); } catch (err) { /* nothing kept */ } };
	const parse = (text) => { try { return JSON.parse(text); } catch (err) { return null; } };
	const storage = (() => {
		try {
			env.storage.getItem(PREFIX + 'crash-reports');
			return true;
		} catch (err) {
			return false;
		}
	})();
	// The answer kept here: 'yes', 'no', or null (not asked yet, or no storage).
	const consent = () => {
		const kept = storage ? get(CONSENT) : null;
		return kept === 'yes' || kept === 'no' ? kept : null;
	};
	const agreed = () => consent() === 'yes';
	// Whether the yes was given before this page loaded: then the whole visit counts (its
	// load, its funnel from the page's opening); after a yes given in this visit, only what
	// follows it.
	let fromLoad = agreed();

	let pagePhase = 'loading';
	// Whether play has started (the start prompt's tap or click).
	let playing = false;
	// The SDK: 'none', 'loading', 'ready', 'failed' or 'closed' (switched off).
	let sdkState = 'none';
	let sdk = null;
	// The game's last snapshot (cleaned), and what this visit has sent or let wait: errors
	// made (the cap counts them), those waiting for the SDK, the errors already reported
	// (each once), the load's transaction, the stats.
	let snapshot = null;
	let made = 0;
	const waiting = [];
	const seenErrors = new Set();
	let loadSent = false;
	let statsSent = 0;
	// Where a tap or click opens the privacy page now (linkAreas): its address and the
	// areas, [left, top, width, height] as shares of the page.
	let links = {url: '', areas: []};
	// What the transport let out this visit (capped again there).
	const sent = {event: 0, transaction: 0};

	// This page load's record, kept (save) only while the answer is yes; since: 'load' when
	// the yes came before this page loaded, 'answer' when it came in this visit (its steps
	// then start at the answer).
	const recordKey = SESSION + env.id();
	const record = {v: 1, release, build, since: 'load', phase: 'loading', steps: fromLoad ? {page_opened: 0} : {}, snapshot: null, visible: env.visible(), focused: env.focused(), store: Boolean(env.store), startedAt: env.now(), lastSeenAt: env.now(), clean: false};
	const save = (fields) => {
		Object.assign(record, fields, {lastSeenAt: env.now()});
		if (agreed()) put(recordKey, JSON.stringify(record));
	};
	// The record's Web Lock, held from the yes on until the page dies or a no (lock).
	let locked = false;
	let unlock = () => {};

	// Why nothing may be sent now, or '' when it may.
	const blocked = () => {
		if (!dsn) return 'no DSN';
		if (!storage) return 'no storage';
		const answer = consent();
		if (answer !== 'yes') return answer === 'no' ? 'answered no' : 'not asked yet';
		return '';
	};
	// Whether an error report may go out in this visit (else it is dropped at once).
	const mayLater = () => Boolean(dsn) && agreed();
	const phaseTag = () => (pagePhase === 'play' ? 'play' : pagePhase === 'error' ? 'load failed' : 'loading');

	// The tags every message carries: the build, the device class, OS and browser, whether
	// the pack is kept on this device, and the snapshot's bands and names.
	function baseTags(from) {
		const tags = {build, device: env.tags.device, os: env.tags.os, browser: env.tags.browser, store: env.store ? 'yes' : 'no'};
		for (const field of SNAPSHOT_FIELDS) {
			if (from && typeof from[field] === 'string') tags[field] = from[field];
		}
		return tags;
	}

	// A snapshot from the game, cleaned: only its known fields, short texts and numbers,
	// with the engine's memory the page sees itself.
	function cleanSnapshot(value) {
		if (!value || typeof value !== 'object') return null;
		const out = {};
		for (const field of SNAPSHOT_FIELDS) {
			const item = value[field];
			if (SNAPSHOT_NUMBERS.includes(field) ? finite(item) !== null : typeof item === 'string' && item.length <= 60) out[field] = item;
		}
		return out;
	}

	// The anonymous id (GameStats.anonymous_id's rule): the one kept, else new random bytes,
	// kept. Asked for only as a message goes out, so none is made before a yes.
	function anonymousId() {
		const kept = get(ANONYMOUS_ID);
		if (typeof kept === 'string' && new RegExp('^[0-9a-f]{' + 2 * ANONYMOUS_ID_BYTES + '}$').test(kept)) return kept;
		const id = Array.from(env.randomBytes(ANONYMOUS_ID_BYTES), (byte) => byte.toString(16).padStart(2, '0')).join('');
		put(ANONYMOUS_ID, id);
		return id;
	}

	// The records of earlier page loads: a live tab's stays; any other goes, the newest that
	// ended unexpectedly in front becomes the report waiting in UNCLEAN, and those that
	// ended before play started wait in VISITS (the newest MAX_VISITS).
	async function previousVisits() {
		if (!storage) return;
		let held = null;
		try {
			held = env.locks ? new Set(((await env.locks.query()).held || []).map((lock) => lock.name)) : null;
		} catch (err) {
			held = null;
		}
		const keys = [];
		try {
			for (let i = 0; i < env.storage.length; i += 1) keys.push(env.storage.key(i));
		} catch (err) {
			return;
		}
		let newest = null;
		const visits = (parse(get(VISITS)) || []).filter((visit) => visit && typeof visit === 'object');
		for (const key of keys) {
			if (typeof key !== 'string' || !key.startsWith(SESSION) || key === recordKey) continue;
			const earlier = parse(get(key));
			if (earlier && typeof earlier === 'object' && !earlier.clean && (held ? held.has(key) : env.now() - earlier.lastSeenAt < LIVE_MS)) continue;
			drop(key);
			if (!earlier || typeof earlier !== 'object') continue;
			const steps = earlier.steps && typeof earlier.steps === 'object' ? earlier.steps : {};
			// A visit's record that began at the answer has no steps from before it, so how
			// far that visit got is not known: it goes as no visit.
			if (steps.play_started === undefined && earlier.since !== 'answer') {
				visits.push({release: String(earlier.release || ''), build: String(earlier.build || 'unknown'), ended: earlier.clean ? 'cleanly' : 'unexpectedly', at: earlier.lastSeenAt,
					reached: FUNNEL_STEPS.filter((name) => finite(steps[name]) !== null).pop() || 'page_opened', steps});
			}
			if (!earlier.clean && earlier.visible && earlier.focused && (!newest || earlier.lastSeenAt > newest.lastSeenAt)) newest = earlier;
		}
		visits.sort((a, b) => (b.at || 0) - (a.at || 0));
		if (visits.length > 0) put(VISITS, JSON.stringify(visits.slice(0, MAX_VISITS)));
		if (newest) {
			put(UNCLEAN, JSON.stringify({release: String(newest.release || ''), snapshot: cleanSnapshot(newest.snapshot), tags: {
				kind: 'unclean_exit',
				previous_build: String(newest.build || 'unknown'),
				phase: newest.phase === 'play' ? 'play' : 'loading',
				store: newest.store ? 'yes' : 'no',
				session_length: bucket(Math.max(0, newest.lastSeenAt - newest.startedAt) / 1000, LENGTHS),
				returned_after: bucket(Math.max(0, env.now() - newest.lastSeenAt) / 1000, GAPS),
			}}));
		}
		flush();
	}

	// Loads the SDK once the start prompt is reached (or the load failed), when sending
	// is allowed; after a switch off and on again, starts it afresh.
	function maybeStart() {
		if (blocked() || (pagePhase !== 'play' && pagePhase !== 'error')) return;
		if (sdkState === 'closed') {
			init();
			return;
		}
		if (sdkState !== 'none' || !config.sdk) return;
		sdkState = 'loading';
		env.loadSdk(config.sdk, config.integrity).then((loaded) => {
			sdk = loaded;
			init();
		}, () => {
			sdkState = 'failed';
		});
	}

	function init() {
		if (!sdk || blocked()) {
			sdkState = sdk ? 'closed' : sdkState;
			return;
		}
		const Sentry = sdk;
		Sentry.init({
			dsn,
			release,
			environment: env.environment,
			// Errors, sessions and the page's own transactions only: nothing traced on its own
			// (no page load, navigation, request, input or frame instrumentation), so no
			// header is added to any request.
			defaultIntegrations: false,
			integrations: [
				Sentry.eventFiltersIntegration(),
				Sentry.linkedErrorsIntegration(),
				Sentry.dedupeIntegration(),
				Sentry.browserSessionIntegration(),
			],
			tracesSampleRate: tracesRate,
			tracePropagationTargets: [],
			// Sentry 11 collects all of these unless told not to (sendDefaultPii is gone).
			dataCollection: {
				userInfo: false, cookies: false, httpHeaders: false, httpBodies: [], urlQueryParams: false,
				graphQL: {document: false, variables: false}, genAI: {inputs: false, outputs: false},
				mcp: {inputs: false, outputs: false}, databaseQueryData: false, queues: false,
				stackFrameVariables: false, frameContextLines: 0,
			},
			attachStacktrace: false,
			sendClientReports: false,
			maxBreadcrumbs: 0,
			beforeBreadcrumb: () => null,
			beforeSend: (event) => tiScrubEvent(event),
			beforeSendTransaction: (event) => tiScrubEvent(event),
			transport: (options) => {
				const network = Sentry.makeFetchTransport(options);
				return {
					send(envelope) {
						const out = blocked() ? null : tiScrubEnvelope(envelope, (type) => {
							if (sent[type] >= (type === 'transaction' ? 1 + MAX_STATS + MAX_VISITS : MAX_EVENTS)) return false;
							sent[type] += 1;
							return true;
						});
						return out ? network.send(out) : Promise.resolve({});
					},
					flush: (timeout) => network.flush(timeout),
				};
			},
			initialScope: {user: {id: anonymousId()}, tags: baseTags(snapshot)},
		});
		sdkState = 'ready';
		flush();
	}

	// A transaction of the page's own, as GROUP's tags and game context say: its root span
	// NAME (OP) from START to END (seconds since 1970), its children [name, op, start, end]
	// and its measurements [name, value, unit].
	function transaction(name, op, start, end, tags, game, children, measurements) {
		const Sentry = sdk;
		Sentry.setUser({id: anonymousId()});
		Sentry.withScope((scope) => {
			scope.setTags(tags);
			if (game) scope.setContext('game', game);
			const root = Sentry.startInactiveSpan({name, op, startTime: start, forceTransaction: true});
			for (const [childName, childOp, from, to] of children) {
				Sentry.startInactiveSpan({name: childName, op: childOp, startTime: from, parentSpan: root}).end(to);
			}
			for (const [measurement, value, unit] of measurements) {
				if (finite(value) !== null) Sentry.setMeasurement(measurement, value, unit, root);
			}
			root.end(end);
		});
	}

	// Once, when play starts: on a visit that began with the yes, the load's transaction
	// (from the navigation's start to the start prompt's tap, a span for each loading step,
	// and the funnel's times); on the visit the player says yes, nothing from before the
	// answer, so only "game start", with play's start if it came after the yes.
	function sendLoad() {
		if (loadSent || !playing || tracesRate === 0) return;
		loadSent = true;
		if (!fromLoad) {
			const playAt = finite(record.steps.play_started);
			const now = env.now() / 1000;
			if (playAt !== null) transaction('game start', 'ti.start', now, now, {...baseTags(snapshot), kind: 'start'}, null, [], [['funnel.play_started', playAt, 'millisecond']]);
			return;
		}
		const marks = env.marks();
		const at = (ms) => (env.timeOrigin + ms) / 1000;
		const started = finite(record.steps.play_started) !== null ? record.steps.play_started : env.sinceStart();
		const page = env.page();
		const tags = {...baseTags(snapshot), kind: 'load', pack_source: marks['TI_BOOT:cache:pack:device'] !== undefined ? 'device' : 'network'};
		transaction('game load', 'ti.load', at(0), at(started), tags, null,
			tiLoadSpans(marks, started).map((span) => [span.name, 'ti.load.step', at(span.start), at(span.end)]),
			FUNNEL_STEPS.filter((name) => name !== 'page_opened' && finite(record.steps[name]) !== null).map((name) => ['funnel.' + name, record.steps[name], 'millisecond'])
				.concat([['ti.engine_start', marks['TI_BOOT:game_start_begin'], 'millisecond'], ['ti.play_ready', marks['TI_BOOT:play_ready'], 'millisecond'],
					['page.ttfb', page.ttfb, 'millisecond'], ['page.fcp', page.fcp, 'millisecond']]));
	}

	// The timed stats GameStats sent (GameStats.take_stats), as a transaction over the
	// window's play time: a span per named map cell and per way of moving, each as long as
	// the seconds spent there (a histogram: all start with the window), the frame rates
	// and memory as measurements, the snapshot as tags.
	function sendStats(stats) {
		if (statsSent >= MAX_STATS || tracesRate === 0) return;
		const windowS = finite(stats.window_s);
		const state = cleanSnapshot(stats.snapshot);
		if (windowS === null || windowS <= 0 || !state) return;
		statsSent += 1;
		if (stats.first === true) step('playing_1min', env.sinceStart());
		const end = env.now() / 1000;
		const start = end - windowS;
		const children = [];
		for (const [cell, seconds] of Object.entries(stats.areas_s || {})) {
			if ((/^-?\d+,-?\d+$/.test(cell) || cell === 'other') && finite(seconds) !== null && seconds > 0) children.push(['area ' + cell, 'ti.area', start, start + seconds]);
		}
		for (const movement of MOVEMENTS) {
			const seconds = finite((stats.movement_s || {})[movement]);
			if (seconds !== null && seconds > 0) children.push([movement, 'ti.movement', start, start + seconds]);
		}
		const changes = (Array.isArray(stats.graphics_changes) ? stats.graphics_changes : []).slice(0, 10)
			.filter((change) => change && ['resolution', 'shadows', 'frame_rate_limit'].includes(change.setting))
			.map((change) => ({setting: change.setting, from: String(change.from).slice(0, 20), to: String(change.to).slice(0, 20)}));
		const memory = {...state, wasm_mb: wasmMegabytes()};
		transaction('game stats', 'ti.stats', start, end, {...baseTags(state), kind: 'stats', stats: stats.first === true ? 'first' : 'later', graphics_changed: changes.length > 0 ? 'yes' : 'no'},
			{graphics_changes: changes}, children,
			[['play_min', finite(stats.play_min), 'minute'], ['window_s', windowS, 'second'], ['fps.median', finite(stats.fps_median), 'none'],
				['fps.p05', finite(stats.fps_p05), 'none'], ['fps.worst', finite(stats.fps_worst), 'none']]
				.concat(SNAPSHOT_NUMBERS.map((field) => ['memory.' + field, finite(memory[field]), 'megabyte'])));
	}

	// An earlier visit that ended before play started, as a transaction of its build: how
	// far it got and the funnel's times it reached.
	function sendVisit(visit) {
		const now = env.now() / 1000;
		const steps = visit.steps && typeof visit.steps === 'object' ? visit.steps : {};
		transaction('game visit', 'ti.visit', now, now, {...baseTags(null), kind: 'visit', previous_build: String(visit.build || 'unknown'),
			reached: FUNNEL_STEPS.includes(visit.reached) ? visit.reached : 'page_opened', ended: visit.ended === 'cleanly' ? 'cleanly' : 'unexpectedly'},
		{release: String(visit.release || '')}, [],
		FUNNEL_STEPS.filter((name) => name !== 'page_opened' && finite(steps[name]) !== null).map((name) => ['funnel.' + name, steps[name], 'millisecond']));
	}

	const wasmMegabytes = () => {
		const bytes = finite(env.wasmBytes());
		return bytes === null ? null : Math.round(bytes / 1048576);
	};

	// Sends what waits, when it may: the earlier visit's unexpected end and the earlier
	// visits, then this visit's errors and its load.
	function flush() {
		if (sdkState !== 'ready' || blocked()) {
			maybeStart();
			return;
		}
		const end = parse(get(UNCLEAN));
		drop(UNCLEAN);
		if (end && end.tags && made < MAX_EVENTS) {
			made += 1;
			sdk.setUser({id: anonymousId()});
			sdk.captureEvent({message: 'previous session ended unexpectedly', level: 'fatal', release: end.release || release,
				tags: {...baseTags(end.snapshot), ...end.tags}, contexts: end.snapshot ? {game: end.snapshot} : undefined});
		}
		const visits = parse(get(VISITS));
		drop(VISITS);
		if (Array.isArray(visits) && tracesRate > 0) visits.slice(0, MAX_VISITS).forEach(sendVisit);
		while (waiting.length > 0) waiting.shift()(sdk);
		sendLoad();
	}

	// One error report: made now (with the phase and snapshot as they are now), sent once it
	// may be.
	function report(capture) {
		if (made >= MAX_EVENTS || !mayLater()) return;
		made += 1;
		const tags = {...baseTags(snapshot), phase: phaseTag()};
		const game = snapshot ? {...snapshot, wasm_mb: wasmMegabytes()} : null;
		waiting.push((Sentry) => {
			Sentry.setUser({id: anonymousId()});
			capture(Sentry, tags, game ? {game} : undefined);
		});
		flush();
	}

//     browser or an app's own browser (each names itself, or leaves out Safari's
//     Version/ and Safari/), and not in a frame. Safari opened inside an app
//     (SFSafariViewController) says the same as Safari and gets it too.
//   silent_mode: that the sound needs the silent mode off: on any iPhone or iPad,
//     in Safari or from the home screen, as every browser there plays Web Audio in
//     a session that the silent mode mutes, and no page can read the switch.
//   full_screen: whether the prompt's tap also puts the page full screen
//     (enterFullScreen(), which the game calls inside that tap): a phone or tablet
//     (its main pointer a finger) whose browser can, Android's; an iPhone can't, an
//     iPad gets the hint instead, and a desktop, touch screen or not (its main
//     pointer a mouse or trackpad), changes nothing.
// An iPad asks for desktop sites by default and then says Macintosh, but has touch.
(function () {
	const agent = navigator.userAgent;
	const matches = (query) => typeof window.matchMedia === 'function' && window.matchMedia(query).matches;
	const ios = tiAppleTouchDevice(agent, navigator.maxTouchPoints);
	const homeScreen = navigator.standalone === true || matches('(display-mode: standalone)') || matches('(display-mode: fullscreen)');
	const safari = /\bVersion\/[\d.]+.*\bSafari\//.test(agent)
		&& !/\b(CriOS|FxiOS|EdgiOS|OPiOS|OPT|GSA|DuckDuckGo|Ddg|YaBrowser|FBAN|FBAV|FBIOS|Instagram|Line|Twitter|MicroMessenger|Snapchat|Pinterest|LinkedInApp|musical_ly|BytedanceWebview|KAKAOTALK|NAVER|Whale)\b/.test(agent);
	const topLevel = window.top === window.self;
	const root = document.documentElement;
	const requestFullScreen = root.requestFullscreen || root.webkitRequestFullscreen;
	const isFullScreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
	const fullScreenOffered = !ios && !homeScreen && typeof requestFullScreen === 'function'
		&& Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled) && matches('(pointer: coarse)');
	window.__tiStartNotes = {
		read: () => JSON.stringify({
			home_screen: ios && safari && topLevel && !homeScreen,
			silent_mode: ios,
			full_screen: fullScreenOffered && !isFullScreen(),
		}),
		enterFullScreen: () => {
			if (!fullScreenOffered || isFullScreen()) return false;
			try {
				const request = requestFullScreen.call(root, {navigationUI: 'hide'});
				if (request && typeof request.catch === 'function') request.catch(() => {});
				return true;
			} catch (e) {
				return false;
			}
		},
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let phase = 'download';
	let downloadComplete = false;
	let loadingShown = '';
	const mark = (name) => performance.mark('TI_BOOT:' + name);
	// The start of the game's loading-step lines (LOADING_STEP_PRINT, game/scripts/main.gd).
	const STEP_PRINT = 'LOADING_STEP ';
	// How long the engine's start waits for this device's copy to be written (below).
	const STORE_WAIT_MS = 3000;
	// The large files so far (tiLoadingLine): what the engine's own loader fetches and
	// the page's pack, with where the pack comes from.
	const loading = {started: false, engine: {loaded: 0, total: 0}, pack: {loaded: 0, total: 0, from: null}};
	// This build's pack, from this device or the network (tiBuildFiles), once loading starts.
	let files = null;

	function showNotice(text) {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = 'block';
		statusNotice.textContent = text;
	}

	// The loading screen's line: the step under way, put up as it starts. The page
	// names the download and the engine's start; the game names its own steps
	// (LOADING_STEPS, game/scripts/main.gd), printing each before its work starts and
	// then letting a frame end, so the browser paints it in time.
	function showStep(text) {
		showNotice(text);
		mark('step:' + text);
	}

	// While the engine and the game's data come in, the line tiLoadingLine gives, over
	// the progress bar.
	function showLoading() {
		if (phase !== 'download') return;
		const line = tiLoadingLine(loading);
		if (!line) return;
		statusNotice.style.display = 'block';
		if (line.known) {
			statusProgress.value = line.loaded;
			statusProgress.max = line.total;
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
		}
		statusNotice.textContent = line.text;
		if (loadingShown !== line.step) {
			loadingShown = line.step;
			mark('step:' + line.step);
		}
		if (line.done) downloaded();
	}

	// Godot's boot splash shows while the game downloads; then the game's own
	// treasure chest (the favicon the exporter writes from the project icon).
	function showChest() {
		const icon = document.getElementById('-gd-engine-icon');
		const splash = document.getElementById('status-splash');
		if (icon && icon.href) {
			splash.src = icon.href;
			splash.className = 'chest';
		}
	}

	// Every byte is in. While this tab still writes this device's copy of the pack, the
	// line says so (the engine's start waits for it, below), until the copy is written;
	// then the engine starts (tiAfterDownload).
	function downloaded() {
		if (!downloadComplete) {
			downloadComplete = true;
			mark('download_complete');
			tiReports.step('download_finished', performance.now());
		}
		if (phase !== 'download') return;
		tiAfterDownload(files, (step) => {
			if (step === 'saving' && phase === 'download') {
				phase = 'saving';
				showStep('Saving the game on this\u00a0device…');
				showChest();
			} else if (step === 'starting') {
				preparing();
			}
		});
	}

	// The engine starts (its WebAssembly made ready, its setup and its load of the
	// game's main scene, up to the game's first line).
	function preparing() {
		if (phase !== 'download' && phase !== 'saving') return;
		if (!downloadComplete) {
			downloadComplete = true;
			mark('download_complete');
			tiReports.step('download_finished', performance.now());
		}
		phase = 'preparing';
		showStep('Starting the\u00a0engine…');
		showChest();
		mark('status_changed');
	}

	function displayFailureNotice(err) {
		phase = 'error';
		console.error(err);
		showNotice(err instanceof Error ? err.message : String(err));
		mark('failed');
		tiReports.loadFailed(err instanceof Error ? err.message : String(err));
	}

	const engine = new Engine({
		...GODOT_CONFIG,
		// What the engine's own loader fetches: its WebAssembly, and the pack when the page
		// can't load the pack itself.
		onProgress(current, total) {
			loading.started = true;
			loading.engine.loaded = current;
			loading.engine.total = total;
			showLoading();
		},
		onPrint(...args) {
			console.log(...args);
			const line = args.join(' ');
			// The game's loading steps, until play.
			if (line.startsWith(STEP_PRINT) && phase === 'preparing') showStep(line.slice(STEP_PRINT.length));
			// Existing game-owned markers, delivered through the public Engine API.
			if (line === 'WORLD_READY') mark('game_preparing');
			if (line === 'PLAY_READY' && phase !== 'error') {
				phase = 'ready';
				mark('play_ready');
				// The start prompt is up: the statistics' SDK may load now (tiReporting).
				tiReports.phase('play');
				// The synchronous game callback finishes its Resume/menu setup first.
				requestAnimationFrame(() => {
					if (phase === 'ready') {
						statusOverlay.style.visibility = 'hidden';
						mark('overlay_hidden');
						tiReports.step('start_prompt', performance.now());
					}
				});
			}
		},
		onPrintError(...args) {
			console.error(...args);
			if (args.join(' ').includes('WORLD_FAILED:')) displayFailureNotice(args.join(' '));
		},
		onExit(code) {
			if (phase !== 'ready') displayFailureNotice('Game stopped before startup completed (' + code + ').');
			else tiReports.engineExit(code);
		},
	});
	// The statistics read the engine's memory from it (tiReporting's wasmBytes).
	tiReports.useEngine(engine);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'block';
		const executable = GODOT_CONFIG.executable;
		const pack = GODOT_CONFIG.mainPack || executable + '.pck';
		// The pack's size, as the exporter wrote it down; a stored copy must have it.
		const packSize = (() => {
			const size = (GODOT_CONFIG.fileSizes || {})[pack];
			return Number.isSafeInteger(size) && size > 0 ? size : 0;
		})();
		mark('engine_init_begin');
		files = tiBuildFiles(executable, {
			store: tiStoreOnThisDevice(window.location.search, tiAppleTouchDevice(navigator.userAgent, navigator.maxTouchPoints)),
			storage: navigator.storage,
			locks: navigator.locks,
			canWrite: typeof FileSystemFileHandle === 'function' && 'createWritable' in FileSystemFileHandle.prototype,
			fetch: (file, init) => fetch(file, init),
			mark,
			warn: (...args) => console.warn(...args),
		});
		// The page loads the pack itself, into the one buffer the engine's file system
		// then keeps; without its size, the engine's loader downloads it as before.
		let packLoaded;
		if (packSize > 0) {
			packLoaded = files.pack(pack, packSize, (bytes, from) => {
				loading.started = true;
				loading.pack.loaded = bytes;
				loading.pack.total = packSize;
				loading.pack.from = from;
				showLoading();
			}).then((buffer) => engine.preloadFile(buffer, pack));
		} else {
			loading.pack = null;
			packLoaded = engine.preloadFile(pack, pack);
		}
		// Same parallel init/download as startGame, but defer callMain until the
		// DOM status has had a rendering opportunity. Engine.load alone resolves
		// at response headers and is NOT proof of a completed WASM download.
		Promise.all([
			engine.init(executable).then(() => mark('engine_init_end')),
			packLoaded.then(() => mark('pack_loaded')),
		]).then(async () => {
			downloaded();
			// This device's copy of the pack, if this tab writes one, is finished before the
			// engine starts: its start keeps the page too busy to write until play, and a tab
			// closed (or a phone out of memory) during the load would lose the copy. A slow
			// disk gets STORE_WAIT_MS, then finishes during the start.
			await Promise.race([files.finish(), new Promise((resolve) => setTimeout(resolve, STORE_WAIT_MS))]);
			preparing();
			// rAF callbacks precede paint. Yield through a subsequent frame before
			// synchronous game startup; actual screencast frames verify the result.
			// This is a paint opportunity, not a timer or physical-display promise.
			await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
			mark('status_paint_opportunity');
			if (phase === 'error') return;
			mark('game_start_begin');
			await engine.start({args: ['--main-pack', pack, ...(GODOT_CONFIG.args || [])]});
			mark('game_start_resolved');
			// Engine startup is not game readiness: only PLAY_READY hides the DOM.
		}).catch((err) => {
			files.finish();
			displayFailureNotice(err);
		});
	}
}());
		</script>
	</body>
</html>
