<!DOCTYPE html>
<!-- Project-owned shell adapted from Godot 4.7.2 full-size.html; engine runtime unchanged. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- The home screen (owner, 2026-11-16): Add to Home Screen opens the game on
		     its own, full screen. tools/build-web.sh writes the manifest and its icons
		     beside the page, named after the commit like the game's files, and puts the
		     manifest's name in this link (an export without that script links none
		     that exists). The exporter's head include, below the styles, adds the
		     favicon and the iPhone's 180 x 180 apple-touch-icon. On an iPhone the
		     status bar lies over the page (black-translucent), whose layout keeps to
		     the safe area (env(safe-area-inset-*), --safe-* below). -->
		<link rel="manifest" href="$TI_WEB_MANIFEST">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Treasure Island">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

/* After the download: the game's treasure chest, centred, the notice under it
   where the download's was. */
#status-splash.chest {
	position: static;
	width: 25vmin;
	height: 25vmin;
	object-fit: contain;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: calc(10% + var(--safe-bottom));
	width: 50%;
	margin: 0 auto;
}

/* The loading line, in one place from the download to play: just above the
   download's progress bar, clear of the boot splash and the chest, and like the
   bar inside the safe area (a phone's home indicator and notch). A second line
   (after a line break) is a note on the step. */
#status-notice {
	background-color: #242424;
	border-radius: 0.5rem;
	border: 1px solid #777;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	white-space: pre-line;
	z-index: 1;
	position: absolute;
	left: var(--safe-left);
	right: var(--safe-right);
	bottom: calc(10% + 1.5rem + var(--safe-bottom));
	width: max-content;
	max-width: calc(100% - 2rem - var(--safe-left) - var(--safe-right));
	margin: 0 auto;
	box-sizing: border-box;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>

		<script>
// The drive trace's page side (game/scripts/debug/drive_trace.gd, owner 2026-11-17:
// "script a drive around the island and instrument it so we can identify why" the web
// build hitches). Only with ?trace=drive in the page's address; otherwise the function
// here returns at once, nothing in this script runs and it defines no name. It sends nothing
// anywhere: the records stay in the page and in this site's localStorage on the device,
// and leave it only through the results' Copy, Select and Download, by hand.
//
// With the trace it records every animation frame's time, and in each frame the WebGL
// work that can stall it (shader compiles and links, texture and buffer uploads, read
// backs and waits, timed around the context's own calls), the page's long tasks and
// long animation frames where the browser reports them, the JavaScript heap where the
// browser has one, the WebAssembly memory and its growth, sound sources started, the
// page hidden or frozen and the WebGL context lost. The game's trace sends its own
// records (where each frame's time went inside the engine, markers, the player's place)
// once a second. tiTraceFrames joins them frame by frame, tiTraceAnalyze names what
// each long frame's time went to, and tiTraceText writes the results; the page shows
// them at the end and keeps a running copy on the device (localStorage) so a reload
// after a crash can show what was gathered and the last thing seen before it.
//
// The causes, by what could take them off the frame: 'main thread' (engine work on the
// browser's main thread that a threaded web export could run elsewhere: the physics
// step, in 4.7.2 only with physics on its own thread), 'engine' (the game's scripts and
// the engine's own steps, which stay on the main thread either way), 'gpu' (WebGL work:
// shader compiles, uploads, waits and drawing), 'browser' (time outside the engine:
// garbage collection, the compositor, other tasks).

// All of it inside one function that returns at once without ?trace=drive: the page then
// has none of the trace's names (the frame record, the analysis, the text, the runtime).
// The analysis is left at column 0 inside it. With the trace, window.__tiTraceLib holds
// it for the tools that read a kept log (tools/check_web_trace.mjs).
(function () {
if (new URLSearchParams(window.location.search).get('trace') !== 'drive') return;

// The frame record tiTraceFrames makes, a number list in this order.
const TI_TRACE_FRAME = ['t', 'ms', 'x', 'z', 'speed', 'step', 'leg', 'flags', 'phys_n', 'pre', 'phys_engine', 'phys_vehicles',
	'phys_scripts', 'proc_engine', 'proc_vehicles', 'proc_scripts', 'draw', 'compile', 'compile_n', 'upload', 'upload_kb', 'sync',
	'outside', 'dc', 'prim_k', 'nadd', 'nrem', 'sources', 'lap'];
// The causes a long frame's time is named by, each with its class (above).
const TI_TRACE_CAUSES = {
	pre: ['engine before physics (input, the first tick\'s car physics)', 'engine'],
	phys_engine: ['physics step (engine)', 'main thread'],
	phys_vehicles: ['vehicle scripts (physics)', 'engine'],
	phys_scripts: ['other scripts (physics)', 'engine'],
	proc_engine: ['engine idle step (scene changes, deferred calls)', 'engine'],
	proc_vehicles: ['vehicle scripts (idle)', 'engine'],
	proc_scripts: ['other scripts (idle)', 'engine'],
	draw: ['drawing (WebGL draw calls)', 'gpu'],
	compile: ['shader compile', 'gpu'],
	upload: ['texture/buffer upload', 'gpu'],
	sync: ['GPU wait or read back', 'gpu'],
	outside: ['outside the engine (browser: GC, compositor, other tasks)', 'browser'],
};

// Joins the page's animation frames (raf: their times, ms) with the game's frame records
// (rows: number lists named by fields, t in ms since the game's trace began, which on
// this page's clock is origin + t) and the WebGL counters (gl: [frame index, then what
// was gathered up to that frame's start: programs linked, compile and link ms, uploads,
// upload KiB, upload ms, waits, wait ms, sound sources started]). Each game frame runs between two page
// frames: page frame k's time is raf[k+1] - raf[k], its WebGL work the counters at k + 1.
// Returns the frames as TI_TRACE_FRAME lists, game frames only.
function tiTraceFrames(raf, rows, fields, origin, gl) {
	const f = {};
	fields.forEach((name, index) => { f[name] = index; });
	const glAt = new Map();
	for (const g of gl) glAt.set(g[0], g);
	const out = [];
	let k = 0;
	for (const r of rows) {
		const start = origin + r[f.t];
		while (k + 1 < raf.length && raf[k + 1] <= start) k += 1;
		if (k + 1 >= raf.length || raf[k] > start) continue;
		const ms = raf[k + 1] - raf[k];
		const g = glAt.get(k + 1) || [k + 1, 0, 0, 0, 0, 0, 0, 0, 0];
		const compile = g[2];
		const upload = g[5];
		const sync = g[7];
		const busy = r[f.phys_ms] + r[f.proc_ms] + r[f.draw_ms];
		const pre = Math.max(0, start - raf[k]);
		// WebGL work is taken from drawing first (where it mostly runs), then the idle step.
		let gpu = compile + upload + sync;
		let draw = r[f.draw_ms];
		const fromDraw = Math.min(draw, gpu);
		draw -= fromDraw;
		gpu -= fromDraw;
		let procEngine = Math.max(0, r[f.proc_ms] - r[f.sproc_ms]);
		const fromProc = Math.min(procEngine, gpu);
		procEngine -= fromProc;
		gpu -= fromProc;
		let physEngine = Math.max(0, r[f.phys_ms] - r[f.sphys_ms]);
		physEngine -= Math.min(physEngine, gpu);
		out.push([start, ms, r[f.x], r[f.z], r[f.speed], r[f.step], r[f.leg], r[f.flags], r[f.phys_n], pre,
			physEngine, r[f.vphys_ms], Math.max(0, r[f.sphys_ms] - r[f.vphys_ms]), procEngine, r[f.vproc_ms],
			Math.max(0, r[f.sproc_ms] - r[f.vproc_ms]), draw, compile, g[1], upload, g[4], sync,
			Math.max(0, ms - pre - busy), r[f.dc], r[f.prim_k], r[f.nadd], r[f.nrem], g[8], f.lap === undefined ? 1 : r[f.lap]]);
	}
	return out;
}

// What each long frame's time went to, and the run's figures. frames: tiTraceFrames'
// lists; events: [t, kind, text] on the page's clock; programs: [t, ms, name] of the
// shaders linked; opts: {steps (names), from and to (the step indices the drive covers)}.
// A frame is long at 33 ms or more and very long at 100 ms or more; its excess is its
// time over the run's median frame. Its cause is the part of TI_TRACE_CAUSES that grew
// most over its own median in the drive ('outside' counting only what is over the
// median frame), and its excess is shared between the parts by how much each grew.
function tiTraceAnalyze(frames, events, programs, opts) {
	const F = {};
	TI_TRACE_FRAME.forEach((name, index) => { F[name] = index; });
	const paused = 2;
	const live = frames.filter((fr) => !(fr[F.flags] & paused) && fr[F.step] >= opts.from && fr[F.step] <= opts.to);
	const result = {frames: live.length, causes: {}, classes: {}, worst: [], histogram: [], programs: {}, lost_ms: 0, long: 0, very_long: 0};
	if (live.length === 0) return result;
	const times = live.map((fr) => fr[F.ms]).sort((a, b) => a - b);
	const pct = (p) => times[Math.min(times.length - 1, Math.floor(p * times.length))];
	const base = pct(0.5);
	result.median_ms = base;
	result.p95_ms = pct(0.95);
	result.p99_ms = pct(0.99);
	result.max_ms = times[times.length - 1];
	result.seconds = (live[live.length - 1][F.t] - live[0][F.t] + live[live.length - 1][F.ms]) / 1000;
	const edges = [0, 20, 33, 50, 100, 250, 500, 1000, Infinity];
	result.histogram = edges.slice(0, -1).map((low, i) => ({from: low, to: edges[i + 1], frames: times.filter((t) => t >= low && t < edges[i + 1]).length}));
	const parts = Object.keys(TI_TRACE_CAUSES);
	const typical = {};
	for (const part of parts) {
		const values = live.map((fr) => fr[F[part]]).sort((a, b) => a - b);
		typical[part] = part === 'outside' ? 0 : values[Math.floor(values.length / 2)];
	}
	result.typical = typical;
	const long = [];
	for (const fr of live) {
		if (fr[F.ms] < 33) continue;
		const excess = Math.max(0, fr[F.ms] - base);
		const share = {};
		for (const part of parts) share[part] = fr[F[part]];
		share.outside = Math.max(0, fr[F.outside] - Math.max(0, base - (fr[F.ms] - fr[F.outside])));
		const grew = {};
		for (const part of parts) grew[part] = Math.max(0, share[part] - typical[part]);
		let cause = 'outside';
		for (const part of parts) if (grew[part] > grew[cause]) cause = part;
		result.long += 1;
		if (fr[F.ms] >= 100) result.very_long += 1;
		result.lost_ms += excess;
		const c = result.causes[cause] || (result.causes[cause] = {frames: 0, very_long: 0, lost_ms: 0, label: TI_TRACE_CAUSES[cause][0], class: TI_TRACE_CAUSES[cause][1]});
		c.frames += 1;
		if (fr[F.ms] >= 100) c.very_long += 1;
		c.lost_ms += excess;
		// The lost time shared between the parts by how much each grew.
		const over = parts.map((part) => grew[part]);
		const sum = over.reduce((a, b) => a + b, 0) || 1;
		parts.forEach((part, i) => {
			const cls = TI_TRACE_CAUSES[part][1];
			result.classes[cls] = (result.classes[cls] || 0) + excess * over[i] / sum;
		});
		long.push({fr, cause, share, excess});
	}
	long.sort((a, b) => b.fr[F.ms] - a.fr[F.ms]);
	const t0 = live[0][F.t];
	for (const item of long.slice(0, 30)) {
		const fr = item.fr;
		const near = events.filter((e) => e[0] >= fr[F.t] - 50 && e[0] <= fr[F.t] + fr[F.ms] + 20 && e[1] !== 'step').map((e) => e[1] + ' ' + e[2]);
		const linked = programs.filter((p) => p[0] >= fr[F.t] - 5 && p[0] <= fr[F.t] + fr[F.ms] + 5);
		result.worst.push({
			at_s: (fr[F.t] - t0) / 1000, ms: fr[F.ms], x: fr[F.x], z: fr[F.z], speed: fr[F.speed],
			step: opts.steps[fr[F.step]] || String(fr[F.step]), leg: fr[F.leg], cause: item.cause,
			parts: Object.fromEntries(parts.filter((p) => item.share[p] >= 1).map((p) => [p, Math.round(item.share[p] * 10) / 10])),
			physics_ticks: fr[F.phys_n], draw_calls: fr[F.dc], nodes: [fr[F.nadd], fr[F.nrem]], compiles: fr[F.compile_n],
			programs: linked.map((p) => p[2] + ' ' + Math.round(p[1]) + ' ms'), markers: near.slice(0, 8),
		});
	}
	const tEnd = live[live.length - 1][F.t] + 1000;
	for (const p of programs) {
		if (p[0] < t0 || p[0] > tEnd) continue;
		const e = result.programs[p[2]] || (result.programs[p[2]] = {count: 0, ms: 0});
		e.count += 1;
		e.ms += p[1];
	}
	result.long_per_min = result.long / (result.seconds / 60);
	result.very_long_per_min = result.very_long / (result.seconds / 60);
	// Spikes: frames far over the drive's median (at least twice it and 50 ms over it),
	// which compare across devices whatever their median, and the drive's laps apart
	// (a second lap passes places already drawn once).
	result.spike_at_ms = Math.max(2 * base, base + 50);
	result.spikes = 0;
	result.spike_lost_ms = 0;
	result.spike_causes = {};
	result.laps = {};
	for (const fr of live) {
		const lap = result.laps[fr[F.lap]] || (result.laps[fr[F.lap]] = {frames: 0, ms: 0, spikes: 0, spike_lost_ms: 0, compiles: 0});
		lap.frames += 1;
		lap.ms += fr[F.ms];
		lap.compiles += fr[F.compile_n];
	}
	for (const item of long) {
		if (item.fr[F.ms] < result.spike_at_ms) continue;
		result.spikes += 1;
		result.spike_lost_ms += item.excess;
		const c = result.spike_causes[item.cause] || (result.spike_causes[item.cause] = {frames: 0, lost_ms: 0});
		c.frames += 1;
		c.lost_ms += item.excess;
		const lap = result.laps[item.fr[F.lap]];
		lap.spikes += 1;
		lap.spike_lost_ms += item.excess;
	}
	result.spikes_per_min = result.spikes / (result.seconds / 60);
	result.points = long.map((item) => [item.fr[F.x], item.fr[F.z], Math.round(item.fr[F.ms]), item.cause]);
	return result;
}

// The results as lines of text a person can read on a phone: env (what ran) and the
// analysis (tiTraceAnalyze).
function tiTraceText(env, a) {
	const r1 = (v) => Math.round(v * 10) / 10;
	const lines = [];
	lines.push('Grand Treasure Island drive trace');
	for (const [k, v] of Object.entries(env)) lines.push(k + ': ' + (typeof v === 'object' ? JSON.stringify(v) : v));
	lines.push('');
	if (!a.frames) {
		lines.push('No frames of the drive recorded.');
		return lines.join('\n');
	}
	lines.push(`Drive: ${r1(a.seconds)} s, ${a.frames} frames; frame time median ${r1(a.median_ms)} ms, 95% ${r1(a.p95_ms)}, 99% ${r1(a.p99_ms)}, worst ${r1(a.max_ms)}`);
	lines.push(`Long frames (33 ms or more): ${a.long} (${r1(a.long_per_min)} a minute); 100 ms or more: ${a.very_long} (${r1(a.very_long_per_min)} a minute)`);
	lines.push(`Time lost in long frames (over the median): ${r1(a.lost_ms / 1000)} s`);
	lines.push(`Spikes (${Math.round(a.spike_at_ms)} ms or more: twice the median and 50 ms over it): ${a.spikes} (${r1(a.spikes_per_min)} a minute), ${r1(a.spike_lost_ms / 1000)} s over the median; by cause: ` + Object.entries(a.spike_causes).sort((x, y) => y[1].lost_ms - x[1].lost_ms).map(([k, c]) => `${TI_TRACE_CAUSES[k][0]} ${c.frames} (${r1(c.lost_ms / 1000)} s)`).join(', '));
	if (Object.keys(a.laps).length > 1) {
		for (const [n, lap] of Object.entries(a.laps)) lines.push(`  Lap ${n}: ${lap.frames} frames, mean ${r1(lap.ms / lap.frames)} ms, ${lap.spikes} spikes (${r1(lap.spike_lost_ms / 1000)} s), ${lap.compiles} shader programs compiled`);
	}
	lines.push('Frame times: ' + a.histogram.map((h) => `${h.from}-${h.to === Infinity ? '' : h.to} ms: ${h.frames}`).join(', '));
	lines.push('');
	lines.push('Causes of long frames (by lost time):');
	for (const [, c] of Object.entries(a.causes).sort((x, y) => y[1].lost_ms - x[1].lost_ms)) {
		lines.push(`  ${c.label} [${c.class}]: ${c.frames} frames (${c.very_long} of 100 ms+), ${r1(c.lost_ms / 1000)} s lost`);
	}
	lines.push('Lost time by class: ' + Object.entries(a.classes).sort((x, y) => y[1] - x[1]).map(([k, v]) => `${k} ${r1(v / 1000)} s`).join(', '));
	const programs = Object.entries(a.programs).sort((x, y) => y[1].ms - x[1].ms);
	if (programs.length) {
		lines.push('');
		lines.push(`Shaders compiled during the drive: ${programs.reduce((s, p) => s + p[1].count, 0)}, ${r1(programs.reduce((s, p) => s + p[1].ms, 0) / 1000)} s:`);
		for (const [name, p] of programs.slice(0, 15)) lines.push(`  ${p.count}x ${r1(p.ms)} ms ${name}`);
	}
	lines.push('');
	lines.push('Worst frames (time into the drive, ms, where, step, cause; parts in ms; markers):');
	for (const w of a.worst) {
		lines.push(`  ${r1(w.at_s)} s ${Math.round(w.ms)} ms at (${Math.round(w.x)}, ${Math.round(w.z)}) ${w.speed > 0 ? r1(w.speed) + ' m/s ' : ''}${w.step}${w.leg >= 0 ? ' leg ' + w.leg : ''}: ${TI_TRACE_CAUSES[w.cause][0]}`);
		lines.push('    parts ' + JSON.stringify(w.parts) + ` ticks ${w.physics_ticks} draws ${w.draw_calls} nodes +${w.nodes[0]}/-${w.nodes[1]}`);
		if (w.programs.length) lines.push('    shaders: ' + w.programs.slice(0, 4).join('; ') + (w.programs.length > 4 ? `; +${w.programs.length - 4}` : ''));
		for (const m of w.markers) lines.push('    ' + m.slice(0, 160));
	}
	return lines.join('\n');
}

(function () {
	if (new URLSearchParams(window.location.search).get('trace') !== 'drive') return;
	const KEY = 'ti-trace:';
	const now = () => performance.now();
	const round = (v) => Math.round(v * 100) / 100;
	const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
	const save = (key, value) => { try { if (store) store.setItem(KEY + key, JSON.stringify(value)); } catch (e) { /* full or off */ } };
	const load = (key) => { try { return store ? JSON.parse(store.getItem(KEY + key) || 'null') : null; } catch (e) { return null; } };
	const log = {
		version: 1, id: new Date().toISOString(), header: null, end: null,
		page: {
			ua: navigator.userAgent, path: location.pathname + location.search, dpr: window.devicePixelRatio,
			screen: [screen.width, screen.height], inner: [innerWidth, innerHeight], secure: window.isSecureContext,
			cores: navigator.hardwareConcurrency || null, memory_gb: navigator.deviceMemory || null,
			standalone: navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches),
		},
		raf: [], gl: [], programs: [], rows: [], events: [], tasks: [], memory: [],
	};
	const event = (kind, text) => { log.events.push([round(now()), kind, String(text)]); };

	// What a previous page left unfinished (a crash or a kill), kept for the results.
	const previous = load('meta');
	if (previous && previous.status === 'running') {
		save('previous', {meta: previous, heartbeat: load('heartbeat'), long: load('long'), seconds: load('seconds')});
	}
	save('meta', {id: log.id, status: 'waiting', path: log.page.path});
	save('heartbeat', null);
	save('long', []);
	save('seconds', []);

	// WebGL: the calls that can stall a frame, timed; the rest left alone.
	let counters = [0, 0, 0, 0, 0, 0, 0, 0];
	const sources = new WeakMap();
	const attached = new WeakMap();
	const shaderMs = new WeakMap();
	// A shader stage's details from its source: which of Godot's GLES3 shaders it is
	// (scene, sky, canvas, particles or another), every define it is built with (the
	// specialization and variant defines Godot puts first, then the material's own), and
	// every identifier of the material's own code (Godot prefixes them m_).
	const details = (src) => {
		const head = src.slice(0, 12000);
		return {
			kind: /SceneDataBlock/.test(src) ? 'scene' : /\bFrameData\b/.test(src) ? 'particles' : /DirectionalLights/.test(src) ? 'sky' : /canvas_/i.test(head) ? 'canvas' : 'other',
			defines: [...head.matchAll(/^#define ([A-Za-z0-9_]+)\s*$/gm)].map((m) => m[1]),
			ids: [...new Set([...src.matchAll(/\bm_([A-Za-z0-9_]+)/g)].map((m) => m[1]))],

// This device's copy of a build's game data pack (owner, 2026-11-16: "cache the
// downloads on the local disk, keyed by ... the current build number"). It is kept in
// the site's private file system (OPFS), in a folder named after the build's files
// (treasure-island-<commit>, which names one build), so the next launch of the same
// build reads it from the device instead of downloading about 134 MB again; storing a
// build removes every other build's folder. The page itself still comes from the
// network every time (no service worker), so a new release or a rollback names other
// files and takes effect on the next load as before. The engine's WebAssembly (about
// 9.5 MB compressed) is left to the browser's HTTP cache, which keeps a file that size.
//
// Not the Cache API: WebKit's Cache.put holds a whole response in the page's memory
// before storing it (DOMCache::put), a second copy of the 160 MB pack on an iPhone
// already near its memory limit; a file's writable stream takes each piece as it comes.
// Storing needs FileSystemFileHandle.createWritable (Chrome 86, Firefox 111, Safari 26)
// and Web Locks, and is off on an iPhone or iPad for now (tiStoreOnThisDevice). Without
// them, in a private window, with storage full, or when a storage call fails or doesn't
// answer within SETUP_MS, the pack comes from the network as before.
//
// The pack goes into one buffer of its size, the only copy the page makes: the
// engine's file system keeps that buffer (tools/build-web.sh) until play is ready, when
// the page frees what the game no longer reads (tiPackRelease), a failed or cut download
// and a stored copy that reads short are read again into it, and the store writes
// views of it. A byte stream (Chrome's downloads and stored files) is read with a BYOB
// reader through one small reused buffer, so no chunk is made: chunks copied in would
// be garbage the size of the pack that the page frees only seconds later, through the
// engine's start.
//
// A stored pack counts only when its marker, written after the whole file was written,
// closed and its size checked, names the size the page expects (GODOT_CONFIG.fileSizes)
// and the file has that size; a download that ends early, fails or holds more is never
// marked. Only the tab holding the lock writes or removes anything, so two tabs never
// write one file. While this tab stores the pack it downloads it without a second copy
// in the browser's HTTP cache, unless that cache already has one.
//
//   tiBuildFiles(build, env) -> {pack(name, size, progress), saving(), saved(), finish()}
//     env: {store, storage, locks, canWrite, fetch, mark, warn} (whether to keep a copy
//     on this device at all, navigator.storage and .locks, whether
//     FileSystemFileHandle.createWritable exists, ...)
//   tiLoadingLine(loading) -> the loading screen's line while the files come in
//   tiAfterDownload(files, onStep) -> its step once they are in
//   tiStoreOnThisDevice(search, appleTouch), tiAppleTouchDevice(agent, maxTouchPoints)
// tools/check_web_build_files.mjs runs these with stand-ins for the browser's.
function tiBuildFiles(build, env) {
	const FOLDER = 'grand-treasure-island-builds';
	const LOCK = 'grand-treasure-island-build-files';
	// Downloads, as the engine's own: 4 attempts, a second apart.
	const ATTEMPTS = 4;
	// A storage call that hasn't answered in this long counts as no storage, so the
	// load never waits on one.
	const SETUP_MS = 2000;
	// A stored copy's read fails once no piece has come for this long of the time the
	// page was free to take one (env.stallMs, for tests, shortens it).
	const STALL_MS = env.stallMs || 10000;
	// The BYOB reader's buffer, and the store's largest write.
	const SCRATCH = 1024 * 1024;
	const WRITE_MAX = 8 * 1024 * 1024;
	let store = null;
	let fromDevice = false;
	let setupOver = false;
	let unlock = () => {};
	const within = (promise, fallback) => Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(fallback), SETUP_MS))]);

	// This build's folder, and whether this tab writes: it holds the lock until finish().
	const cache = within((async () => {
		if (!env.store || !env.canWrite || !env.locks || !env.storage || !env.storage.getDirectory) return null;
		const root = await env.storage.getDirectory();
		const top = await root.getDirectoryHandle(FOLDER, {create: true});
		const dir = await top.getDirectoryHandle(build, {create: true});
		const owner = await new Promise((resolve) => {
			env.locks.request(LOCK, {ifAvailable: true}, (lock) => {
				// A lock granted after SETUP_MS goes straight back.
				resolve(Boolean(lock) && !setupOver);
				return lock && !setupOver ? new Promise((release) => { unlock = release; }) : null;
			}).catch(() => resolve(false));
		});
		return {top, dir, owner};
	})().catch((err) => {
		env.warn('No build cache on this device:', err);
		return null;
	}), null).then((c) => {
		setupOver = true;
		if (!c) env.mark(env.store ? 'cache:none' : 'cache:off');
		return c;
	});

	// The stored pack NAME, a File of SIZE bytes, or null.
	function storedFile(name, size) {
		return within((async () => {
			const c = await cache;
			if (!c) return null;
			try {
				const marker = await (await c.dir.getFileHandle(name + '.complete')).getFile();
				if (await marker.text() !== String(size)) return null;
				const file = await (await c.dir.getFileHandle(name)).getFile();
				return file.size === size ? file : null;
			} catch (err) {
				return null;
			}
		})(), null);
	}

	// Starts this tab's store of NAME (SIZE bytes), after the one before it ends, or
	// returns null when this tab doesn't write: write(view) queues each piece of the
	// pack's buffer as it arrives, and end(complete) closes the file, checks its size
	// and only then writes its marker. Anything else removes the file and its marker.
	// Its entry says when the writing is over (over, writing: as soon as it succeeds or
	// fails, before any clean-up) and when the store is done (done: true when stored).
	async function startStore(name, size) {
		const c = await cache;
		if (!c || !c.owner) return null;
		const previous = store;
		const queue = [];
		let state = 'open';
		let poke = () => {};
		const stop = (next) => {
			if (state !== 'open') return;
			state = next;
			if (next === 'failed') queue.length = 0;
			poke();
		};
		const entry = {writing: true};
		let ended = () => {};
		entry.over = new Promise((resolve) => {
			ended = () => {
				entry.writing = false;
				resolve();
			};
		});
		const written = (async () => {
			if (previous) await previous.done;
			await c.dir.removeEntry(name + '.complete').catch(() => {});
			const handle = await c.dir.getFileHandle(name, {create: true});
			const writable = await handle.createWritable();
			let bytes = 0;
			try {
				for (;;) {
					if (state === 'failed') throw new Error('the download failed');
					if (queue.length > 0) {
						// Adjacent pieces go to the disk together, up to WRITE_MAX: the engine's
						// start keeps the page busy for seconds, with time for few writes.
						let view = queue.shift();
						while (queue.length > 0 && queue[0].buffer === view.buffer
							&& queue[0].byteOffset === view.byteOffset + view.byteLength
							&& view.byteLength + queue[0].byteLength <= WRITE_MAX) {
							view = new Uint8Array(view.buffer, view.byteOffset, view.byteLength + queue.shift().byteLength);
						}
						await writable.write(view);
						bytes += view.byteLength;
					} else if (state === 'complete') {
						break;
					} else {
						await new Promise((resolve) => { poke = resolve; });
					}
				}
				if (bytes !== size) throw new Error(bytes + ' of ' + size + ' bytes');
				await writable.close();
			} catch (err) {
				ended();
				await writable.abort().catch(() => {});
				throw err;
			}
			if ((await handle.getFile()).size !== size) throw new Error('the stored file has another size');
			const marker = await (await c.dir.getFileHandle(name + '.complete', {create: true})).createWritable();
			await marker.write(String(size));
			await marker.close();
		})();
		entry.done = written.then(() => {
			ended();
			env.mark('cache:pack:stored');
			return true;
		}, async (err) => {
			ended();
			state = 'failed';
			queue.length = 0;
			await c.dir.removeEntry(name + '.complete').catch(() => {});
			await c.dir.removeEntry(name).catch(() => {});
			env.mark('cache:pack:not_stored');
			env.warn('The game was not stored on this device:', name, err);
			return false;
		});
		store = entry;
		return {
			write(view) {
				if (state !== 'open') return;
				queue.push(view);
				poke();
			},
			end(complete) {
				stop(complete ? 'complete' : 'failed');
			},
		};
	}

	// Reads STREAM, which must hold exactly BUFFER's length, into BUFFER, calling
	// onBytes(bytes so far, the piece's length) after each piece. A byte stream is read
	// with a BYOB reader through one small buffer that each read hands back; other
	// streams' chunks are copied in. With STALL, a read fails once no piece has come for
	// STALL ms of the time the page was free to take one: a watchdog ticks every tenth of
	// it, and a tick that comes late (the page was busy, as during the engine's setup on a
	// slow phone) counts only its own tenth and can't fail the read, so a busy page never
	// gives up on data that is on its way; only an on-time tick, after a whole tick of
	// free time with no piece, does.
	async function readInto(stream, buffer, onBytes, stall) {
		let byob = null;
		try {
			byob = stream.getReader({mode: 'byob'});
		} catch (err) {
			byob = null;
		}
		const reader = byob || stream.getReader();
		let scratch = byob ? new ArrayBuffer(SCRATCH) : null;
		let offset = 0;
		let pieces = 0;
		let fail = null;
		const stalled = new Promise((resolve, reject) => { fail = reject; });
		stalled.catch(() => {});
		let watchdog = null;
		if (stall) {
			const tick = stall / 10;
			let quiet = 0;
			let seen = 0;
			let last = Date.now();
			watchdog = setInterval(() => {
				const now = Date.now();
				const late = now - last > 2 * tick;
				last = now;
				if (pieces !== seen) {
					seen = pieces;
					quiet = 0;
					return;
				}
				quiet += tick;
				if (!late && quiet >= stall) fail(new Error('no data for ' + stall + ' ms'));
			}, tick);
		}
		try {
			for (;;) {
				const read = byob ? byob.read(new Uint8Array(scratch)) : reader.read();
				const {done, value} = await (watchdog ? Promise.race([read, stalled]) : read);
				pieces += 1;
				if (byob && value) scratch = value.buffer;
				if (done) break;
				if (offset + value.byteLength > buffer.byteLength) throw new Error('more than the expected ' + buffer.byteLength + ' bytes');
				buffer.set(value, offset);
				offset += value.byteLength;
				onBytes(offset, value.byteLength);
			}
		} catch (err) {
			reader.cancel().catch(() => {});
			throw err;
		} finally {
			clearInterval(watchdog);
		}
		if (offset !== buffer.byteLength) throw new Error(offset + ' of ' + buffer.byteLength + ' bytes');
	}

	// The download. While this tab stores the pack: the browser's HTTP cache copy when
	// it has one ('only-if-cached' should never go to the network), else the network
	// without a second copy in that cache ('no-store'); if the store then fails, the
	// next launch downloads again where the HTTP cache might have kept the pack. WebKit
	// answers 'only-if-cached' with the whole download from the network: that answer is
	// the download, read and stored as one. Otherwise a plain fetch, as before.
	async function download(name, storing, attempt) {
		if (!storing) return env.fetch(name);
		if (attempt === 1) {
			try {
				const cached = await env.fetch(name, {cache: 'only-if-cached', mode: 'same-origin'});
				if (cached.ok && cached.body) return cached;
			} catch (err) {
				// Not in the HTTP cache.
			}
		}
		return env.fetch(name, {cache: 'no-store'});
	}

	// The pack, in one buffer of its size (above): from this device's copy, or
	// downloaded and stored as it comes. progress(bytes, 'device' or 'network').
	async function pack(name, size, progress) {
		const buffer = new Uint8Array(size);
		const file = await storedFile(name, size);
		if (file) {
			try {
				progress(0, 'device');
				await readInto(file.stream(), buffer, (bytes) => progress(bytes, 'device'), STALL_MS);
				fromDevice = true;
				env.mark('cache:pack:device');
				return buffer.buffer;
			} catch (err) {
				env.warn('The stored game did not read; downloading it:', err);
			}
		}
		const c = await cache;
		const storing = Boolean(c && c.owner);
		for (let attempt = 1; ; attempt += 1) {
			let writer = null;
			try {
				progress(0, 'network');
				const response = await download(name, storing, attempt);
				if (!response.ok || !response.body) throw new Error('HTTP ' + response.status);
				writer = storing ? await startStore(name, size) : null;
				await readInto(response.body, buffer, (bytes, length) => {
					progress(bytes, 'network');
					if (writer) writer.write(buffer.subarray(bytes - length, bytes));
				});
				if (writer) writer.end(true);
				return buffer.buffer;
			} catch (err) {
				if (writer) writer.end(false);
				if (attempt >= ATTEMPTS) throw new Error('Failed loading file \'' + name + '\': ' + (err instanceof Error ? err.message : err));
				await new Promise((resolve) => setTimeout(resolve, 1000));
			}
		}
	}

	// Whether this tab is still writing this device's copy, and when that is over
	// (written, or failed: the line moves on before any clean-up).
	const saving = () => Boolean(store && store.writing);
	const saved = () => (store ? store.over : Promise.resolve());

	// Once the page has the pack: waits for this tab's store and, when this build's pack
	// is stored (that store succeeded, or it came from the device), removes every other
	// build's folder; then lets the lock go.
	async function finish() {
		const c = await cache;
		try {
			const stored = store ? await store.done : fromDevice;
			if (c && c.owner && stored) {
				const others = [];
				for await (const name of c.top.keys()) {
					if (name !== build) others.push(name);
				}
				for (const name of others) await c.top.removeEntry(name, {recursive: true}).catch(() => {});
				if (others.length > 0) env.mark('cache:removed_other_builds');
			}
		} catch (err) {
			env.warn('Build cache clean-up failed:', err);
		} finally {
			unlock();
		}
	}

	return {pack, saving, saved, finish};
}

// The loading screen's step once every byte is in: onStep('saving') while this tab
// still writes this device's copy of the pack, then onStep('starting') as soon as the
// copy is written, though the engine may still be getting ready; else
// onStep('starting') at once.
function tiAfterDownload(files, onStep) {
	if (!files || !files.saving()) {
		onStep('starting');
		return;
	}
	onStep('saving');
	files.saved().then(() => onStep('starting'));
}

// Whether this page keeps a copy of the pack on the device: everywhere it can, but not
// on an iPhone or iPad until that is measured on one. In WebKit on Linux, storing as the
// download came in raised the browser's network process from about 250 to about
// 700 MiB for a second or two, and iOS limits that process on its own (KNOWN_ISSUES).
// ?store=1 or ?store=0 in the page's address turns it on or off, on any browser, for a
// test on a device.
const STORE_ON_IPHONE_AND_IPAD = false;
function tiStoreOnThisDevice(search, appleTouch) {
	const forced = new URLSearchParams(search).get('store');
	if (forced === '1') return true;
	if (forced === '0') return false;
	return STORE_ON_IPHONE_AND_IPAD || !appleTouch;
}

// An iPhone, iPod or iPad: an iPad asks for desktop sites by default and then says
// Macintosh, but has touch. The start prompt's iPhone and iPad notes use it too.
function tiAppleTouchDevice(agent, maxTouchPoints) {
	return /\b(iPhone|iPod|iPad)\b/.test(agent) || (/\bMacintosh\b/.test(agent) && maxTouchPoints > 1);
}

// Releasing the pack once the game has loaded what it keeps (owner, 2026-11-18: an
// iPhone ends the page past 2,048 MB). The engine reads every resource from the pack's
// file in its own file system, which keeps the page's one buffer of it (above): about
// 160 MB of the page's memory for the whole session. Once play is ready the game names
// the pack's files it never reads again (game/scripts/web/pack_release.gd): the files
// of the imported resources it holds, each held for the rest of the session so that a
// later load of it comes from the engine's cache, and the baked world, loaded once.
// The page then gives the engine's file new contents (tiReleasedPack) that keep every
// other byte, copied into a buffer of their own, and frees the pack's buffer. A file
// the game may still load (not loaded yet, or loaded and let go), every script and
// every file read as it is (JSON, the credits) stays readable as before. The page
// reaches the engine's file through tools/build-web.sh's engine-script patch
// (tiFileNode); without it, or with anything else unexpected, it keeps the whole pack.
//
//   tiPackDirectory(bytes) -> {entries: [{path, offset, size}] by offset} or null
//   tiReleasedPack(bytes, released, onMiss) -> {contents, keptBytes, state()}
//   tiPackRelease(buffer, env) -> {release(json) -> string, state()}
// tools/check_web_build_files.mjs runs these with stand-ins for the engine's file.

// The pack's directory, as Godot 4.7.2 reads it (core/io/file_access_pack.cpp,
// PackedSourcePCK::try_open_pack; pack formats 2 to 4) from BYTES, the whole pack: each
// file's path (without res://), offset and size, by offset. Null when BYTES is not such
// a pack, its directory is encrypted, it is a sparse bundle (its files live outside
// it), or its entries run past its end or into each other.
function tiPackDirectory(bytes) {
	try {
		const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
		if (view.getUint32(0, true) !== 0x43504447) return null;
		const version = view.getUint32(4, true);
		const flags = view.getUint32(20, true);
		if (version < 2 || version > 4 || (flags & (1 | 4)) !== 0) return null;
		const base = Number(view.getBigUint64(24, true));
		// Format 2: the directory follows the header's 16 reserved words; 3 and 4 name it.
		let at = version >= 3 ? Number(view.getBigUint64(32, true)) : 96;
		const count = view.getUint32(at, true);
		at += 4;
		const decoder = new TextDecoder();
		const entries = [];
		for (let i = 0; i < count; i += 1) {
			const length = view.getUint32(at, true);
			const path = decoder.decode(bytes.subarray(at + 4, at + 4 + length)).replace(/\0+$/, '');
			at += 4 + length;
			const offset = base + Number(view.getBigUint64(at, true));
			const size = Number(view.getBigUint64(at + 8, true));
			// After the offset and size: the file's MD5 (16 bytes) and its flags.
			const removal = (view.getUint32(at + 32, true) & 2) !== 0;
			at += 36;
			if (!removal) entries.push({path, offset, size});
		}
		entries.sort((a, b) => a.offset - b.offset);
		let end = 0;
		for (const entry of entries) {
			if (!Number.isSafeInteger(entry.offset + entry.size) || entry.offset < end || entry.offset + entry.size > bytes.byteLength) return null;
			end = entry.offset + entry.size;
		}
		return {entries};
	} catch (err) {
		// A read past the end of BYTES: not a whole pack.
		return null;
	}
}

// New contents for the pack's file in the engine's file system (Emscripten's MEMFS reads
// a file through its contents' subarray(), or byte by byte for reads of 8 bytes or
// fewer) that keep every byte of BYTES (the whole pack) outside RELEASED (entries of
// tiPackDirectory's, by offset), copied into one buffer of their own, so BYTES' buffer
// can go. A read that starts in a released file is the engine reading what the game said
// it never reads again: it fails with an I/O error (EIO) and onMiss(entry, position,
// length) names it, so it is never silent. A read that starts in kept bytes and runs on
// into a released file gets zeros there: the C library reads up to a kilobyte past what
// it was asked for (stdio's buffer), and the engine reads no further than the file it
// opened. State: the kept bytes, misses and such reads on.
function tiReleasedPack(bytes, released, onMiss) {
	const size = bytes.byteLength;
	// The kept runs [start, end) by position, and where each starts in the kept buffer.
	const starts = [];
	const ends = [];
	let from = 0;
	for (const entry of released) {
		if (entry.offset > from) {
			starts.push(from);
			ends.push(entry.offset);
		}
		from = Math.max(from, entry.offset + entry.size);
	}
	if (from < size) {
		starts.push(from);
		ends.push(size);
	}
	const at = [];
	let keptBytes = 0;
	for (let i = 0; i < starts.length; i += 1) {
		at.push(keptBytes);
		keptBytes += ends[i] - starts[i];
	}
	const kept = new Uint8Array(keptBytes);
	for (let i = 0; i < starts.length; i += 1) kept.set(bytes.subarray(starts[i], ends[i]), at[i]);
	const releasedStarts = released.map((entry) => entry.offset);
	let misses = 0;
	let spills = 0;
	// The last of SORTED at or before POSITION, or -1.
	const below = (sorted, position) => {
		let lo = 0;
		let hi = sorted.length - 1;
		let hit = -1;
		while (lo <= hi) {
			const mid = (lo + hi) >> 1;
			if (sorted[mid] <= position) {
				hit = mid;
				lo = mid + 1;
			} else {
				hi = mid - 1;
			}
		}
		return hit;
	};
	const runOf = (position) => {
		const i = below(starts, position);
		return i >= 0 && position < ends[i] ? i : -1;
	};
	const miss = (position, length) => {
		misses += 1;
		const i = below(releasedStarts, position);
		onMiss(i >= 0 && position < released[i].offset + released[i].size ? released[i] : null, position, length);
		// Emscripten's file system takes an error of this name as the error number it carries.
		throw Object.assign(new Error('read of released game data at byte ' + position), {name: 'ErrnoError', errno: 29});
	};
	const subarray = (begin, end) => {
		const i = runOf(begin);
		if (i < 0) miss(begin, end - begin);
		if (end <= ends[i]) return kept.subarray(at[i] + begin - starts[i], at[i] + end - starts[i]);
		spills += 1;
		const out = new Uint8Array(end - begin);
		for (let j = i; j < starts.length && starts[j] < end; j += 1) {
			const a = Math.max(begin, starts[j]);
			const b = Math.min(end, ends[j]);
			out.set(kept.subarray(at[j] + a - starts[j], at[j] + b - starts[j]), a - begin);
		}
		return out;
	};
	const byteAt = (position) => {
		const i = runOf(position);
		if (i < 0) miss(position, 1);
		return kept[at[i] + position - starts[i]];
	};
	const target = {subarray, length: size};
	const contents = new Proxy(target, {
		get(object, key) {
			// A byte by its index, as MEMFS reads 8 bytes or fewer.
			if (typeof key === 'string' && key.charCodeAt(0) >= 48 && key.charCodeAt(0) <= 57) {
				const position = Number(key);
				if (Number.isSafeInteger(position)) return position < size ? byteAt(position) : undefined;
			}
			return object[key];
		},
	});
	return {contents, keptBytes, state: () => ({kept_bytes: keptBytes, kept_runs: starts.length, misses, spills})};
}

// The page's side of the release (window.__tiPack), for the pack in BUFFER (an
// ArrayBuffer). env: node() gives the pack's file in the engine's file system (or null),
// saved() a promise that this tab's store of the pack has stopped writing from BUFFER
// (tiBuildFiles' saved()), later(fn) runs fn in a task of its own (not inside the
// engine's call), now(), log, error and mark. release(json) takes the game's request,
// {"drop": [paths], "once": [paths]} (res:// paths of pack files), answers "scheduled"
// (or why not), and in that task gives the file its new contents; once the store is no
// longer writing it frees BUFFER (ArrayBuffer.transfer(0) detaches it, which frees its
// memory at once; without it, dropping it leaves that to the garbage collector).
// Anything unexpected keeps the whole pack in memory, as before.
function tiPackRelease(buffer, env) {
	let pack = buffer;
